          @Composable
          fun ArchiveDialog(defaultName: String, onZip: (String, String) -> Unit, onDismiss: () -> Unit) {
              var name by remember { mutableStateOf(defaultName) }
              var password by remember { mutableStateOf("") }
              var showPassword by remember { mutableStateOf(false) }
              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(14.dp))
                          .background(Color(0xFF2A2A2A))
                          .padding(16.dp)
                  ) {
                      Text("Archive (Zip)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                      Spacer(Modifier.height(12.dp))
                      OutlinedTextField(
                          value = name,
                          onValueChange = { name = it },
                          singleLine = true,
                          label = { Text("Name") },
                          suffix = { Text(".zip", color = Color.White.copy(alpha = 0.6f)) },
                          colors = fieldColors(),
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(10.dp))
                      OutlinedTextField(
                          value = password,
                          onValueChange = { password = it },
                          singleLine = true,
                          label = { Text("Password (optional)") },
                          visualTransformation = if (showPassword) androidx.compose.ui.text.input.VisualTransformation.None else PasswordVisualTransformation(),
                          trailingIcon = {
                              Text(
                                  text = if (showPassword) "Hide" else "Show",
                                  color = Color.White.copy(alpha = 0.7f),
                                  fontSize = 12.sp,
                                  modifier = Modifier
                                      .padding(end = 12.dp)
                                      .clip(RoundedCornerShape(6.dp))
                                      .pointerInput(Unit) { detectTapGestures { showPassword = !showPassword } }
                                      .padding(6.dp)
                              )
                          },
                          colors = fieldColors(),
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(14.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          DialogButton(text = "Cancel", modifier = Modifier.weight(1f)) { onDismiss() }
                          DialogButton(text = "Zip", modifier = Modifier.weight(1f), primary = true) {
                              val clean = name.trim().removeSuffix(".zip").replace("/", "_").ifEmpty { "Archive" }
                              onZip(clean, password)
                          }
                      }
                  }
              }
          }

