          // ---------- Syntax colors for the text / code editor ----------
          // A small generic tokenizer (no per-language grammar): comments, strings, numbers, keywords, types,
          // function calls, constants, JSON / config keys and HTML / XML tags. Pastel colors for the dark theme.
          // It runs in the background after you stop typing (and is skipped for very big files), so typing stays fast.
          object SyntaxHighlighter {
              const val MAX_CHARS = 1_000_000

              class Lang(
                  val lineComments: List<String>,
                  val blockComments: Boolean,
                  val markup: Boolean,
                  val keywords: Boolean,
                  val keyValue: Boolean,
                  val quotes: String
              )

              private val cComment = Color(0xFF8A9A8A)
              private val cString = Color(0xFFA5D6A7)
              private val cNumber = Color(0xFFFFB86C)
              private val cKeyword = Color(0xFFC792EA)
              private val cType = Color(0xFFFFCB6B)
              private val cFunction = Color(0xFF82AAFF)
              private val cKey = Color(0xFF80CBC4)
              private val cConstant = Color(0xFFF78C6C)

              private val keywordSet = hashSetOf(
                  "abstract", "as", "async", "await", "break", "case", "catch", "class", "const", "continue", "data",
                  "def", "default", "del", "defer", "do", "elif", "else", "elsif", "enum", "except", "export", "extends",
                  "extern", "final", "finally", "fn", "for", "fun", "func", "function", "go", "if", "impl", "implements",
                  "import", "in", "inline", "interface", "internal", "is", "lambda", "let", "match", "module", "mut",
                  "namespace", "new", "object", "open", "operator", "override", "package", "pass", "private", "protected",
                  "pub", "public", "raise", "return", "sealed", "self", "static", "struct", "super", "suspend", "switch",
                  "this", "throw", "throws", "trait", "try", "type", "typealias", "typeof", "union", "unsafe", "use",
                  "using", "val", "var", "void", "volatile", "when", "where", "while", "with", "yield", "fi", "then",
                  "done", "esac", "echo", "select", "from", "insert", "update", "delete", "create", "table", "join",
                  "left", "right", "inner", "outer", "group", "order", "by", "having", "limit", "and", "or", "not",
                  "int", "long", "short", "byte", "char", "float", "double", "boolean", "string", "bool"
              )

              private val constantSet = hashSetOf(
                  "true", "false", "null", "nil", "none", "None", "True", "False", "undefined", "NULL", "TRUE", "FALSE", "NaN"
              )

              private val plain = hashSetOf(
                  "txt", "md", "markdown", "log", "csv", "tsv", "srt", "vtt", "lrc", "nfo", "text", "readme", "license",
                  "ass", "ssa", "sub", "m3u", "m3u8", "list", "url", "vcf", "ics", "rst", "adoc", "tex"
              )

              // null = no colors (plain text, unknown type)
              fun langFor(name: String): Lang? {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  if (ext.isEmpty() || ext in plain) return null
                  return when (ext) {
                      "json", "jsonl", "ndjson" -> Lang(emptyList(), false, false, false, false, "\"")
                      "html", "htm", "xhtml", "xml", "svg", "plist", "kml", "gpx", "xsd", "xsl", "vue", "aidl", "rss", "atom" ->
                          Lang(emptyList(), false, true, false, false, "\"'")
                      "yaml", "yml", "toml", "ini", "cfg", "conf", "properties", "env", "gitignore", "editorconfig", "reg", "rc", "lock", "pro" ->
                          Lang(listOf("#", ";"), false, false, false, true, "\"'")
                      "sh", "bash", "zsh", "ps1", "bat", "cmd", "mk", "make", "cmake", "dockerfile" ->
                          Lang(listOf("#", "REM ", "::"), false, false, true, false, "\"'`")
                      "py", "rb", "pl", "r" ->
                          Lang(listOf("#"), false, false, true, false, "\"'")
                      "sql" -> Lang(listOf("--"), true, false, true, false, "\"'")
                      "lua" -> Lang(listOf("--"), true, false, true, false, "\"'")
                      else -> Lang(listOf("//"), true, false, true, false, "\"'`")
                  }
              }

              private fun isWordChar(c: Char) = c.isLetterOrDigit() || c == '_'

              fun highlight(text: String, lang: Lang): AnnotatedString {
                  val styles = ArrayList<AnnotatedString.Range<SpanStyle>>()
                  fun add(start: Int, end: Int, color: Color) {
                      if (end > start) styles.add(AnnotatedString.Range(SpanStyle(color = color), start, end))
                  }
                  val n = text.length
                  var i = 0
                  while (i < n) {
                      val c = text[i]
                      // ----- markup: comments and tags -----
                      if (lang.markup) {
                          if (c == '<') {
                              if (text.startsWith("<!--", i)) {
                                  val e = text.indexOf("-->", i + 4)
                                  val end = if (e < 0) n else e + 3
                                  add(i, end, cComment)
                                  i = end
                                  continue
                              }
                              // tag: <name attr="value"> ... >
                              var j = i + 1
                              if (j < n && (text[j] == '/' || text[j] == '?' || text[j] == '!')) j++
                              while (j < n && (isWordChar(text[j]) || text[j] == ':' || text[j] == '-' || text[j] == '.')) j++
                              add(i, j, cKey)
                              // attributes until '>'
                              while (j < n && text[j] != '>') {
                                  val ch = text[j]
                                  if (ch == '"' || ch == '\'') {
                                      var k = j + 1
                                      while (k < n && text[k] != ch) k++
                                      val end = if (k < n) k + 1 else n
                                      add(j, end, cString)
                                      j = end
                                  } else if (isWordChar(ch)) {
                                      var k = j
                                      while (k < n && (isWordChar(text[k]) || text[k] == ':' || text[k] == '-' || text[k] == '.')) k++
                                      add(j, k, cType)
                                      j = k
                                  } else j++
                              }
                              if (j < n) { add(j, j + 1, cKey); j++ }
                              i = j
                              continue
                          }
                          i++
                          continue
                      }
                      // ----- comments -----
                      if (lang.blockComments && c == '/' && text.startsWith("/*", i)) {
                          val e = text.indexOf("*/", i + 2)
                          val end = if (e < 0) n else e + 2
                          add(i, end, cComment)
                          i = end
                          continue
                      }
                      var isLineComment = false
                      for (p in lang.lineComments) {
                          if (text.startsWith(p, i)) {
                              // '#' / ';' inside a word (a#b) is not a comment
                              if ((p == "#" || p == ";") && i > 0 && !text[i - 1].isWhitespace()) continue
                              isLineComment = true
                              break
                          }
                      }
                      if (isLineComment) {
                          var e = text.indexOf('\n', i)
                          if (e < 0) e = n
                          add(i, e, cComment)
                          i = e
                          continue
                      }
                      // ----- strings (and JSON / config keys) -----
                      if (lang.quotes.indexOf(c) >= 0) {
                          var j = i + 1
                          while (j < n && text[j] != c && text[j] != '\n') {
                              if (text[j] == '\\' && j + 1 < n) j++
                              j++
                          }
                          val end = if (j < n && text[j] == c) j + 1 else j
                          // a string followed by ':' is a key
                          var k = end
                          while (k < n && (text[k] == ' ' || text[k] == '\t')) k++
                          val isKey = (lang.quotes == "\"" || lang.keyValue) && k < n && text[k] == ':'
                          add(i, end, if (isKey) cKey else cString)
                          i = end
                          continue
                      }
                      // ----- numbers -----
                      if (c.isDigit() && (i == 0 || !isWordChar(text[i - 1]))) {
                          var j = i + 1
                          while (j < n && (text[j].isLetterOrDigit() || text[j] == '.' || text[j] == '_')) j++
                          add(i, j, cNumber)
                          i = j
                          continue
                      }
                      // ----- words -----
                      if (c.isLetter() || c == '_') {
                          var j = i + 1
                          while (j < n && isWordChar(text[j])) j++
                          val word = text.substring(i, j)
                          var k = j
                          while (k < n && (text[k] == ' ' || text[k] == '\t')) k++
                          val next = if (k < n) text[k] else '\n'
                          when {
                              word in constantSet -> add(i, j, cConstant)
                              lang.keyValue && (next == ':' || next == '=') && startsLine(text, i) -> add(i, j, cKey)
                              lang.keywords && word in keywordSet -> add(i, j, cKeyword)
                              lang.keywords && next == '(' -> add(i, j, cFunction)
                              lang.keywords && word[0].isUpperCase() && word.length > 1 -> add(i, j, cType)
                          }
                          i = j
                          continue
                      }
                      i++
                  }
                  return AnnotatedString(text, styles, emptyList())
              }

              private fun startsLine(text: String, pos: Int): Boolean {
                  var k = pos - 1
                  while (k >= 0 && (text[k] == ' ' || text[k] == '\t' || text[k] == '-')) k--
                  return k < 0 || text[k] == '\n'
              }

              // The text was just edited and the new colors are not ready yet: keep the old colors, moved along
              // with the edit, so the text does not flash plain while typing.
              fun adapt(old: AnnotatedString, raw: AnnotatedString): AnnotatedString {
                  val o = old.text
                  val nw = raw.text
                  if (o == nw) return old
                  val max = minOf(o.length, nw.length)
                  var p = 0
                  while (p < max && o[p] == nw[p]) p++
                  var s = 0
                  while (s < max - p && o[o.length - 1 - s] == nw[nw.length - 1 - s]) s++
                  val oldEnd = o.length - s
                  val newEnd = nw.length - s
                  val delta = nw.length - o.length
                  fun map(x: Int): Int = when {
                      x <= p -> x
                      x >= oldEnd -> x + delta
                      else -> minOf(x, newEnd)
                  }
                  val moved = ArrayList<AnnotatedString.Range<SpanStyle>>(old.spanStyles.size)
                  for (r in old.spanStyles) {
                      val a = map(r.start)
                      val b = map(r.end)
                      if (b > a && b <= nw.length) moved.add(AnnotatedString.Range(r.item, a, b))
                  }
                  return AnnotatedString(nw, moved, emptyList())
              }
          }

          // =====================================================================
          // CodeEditText: the text field of the editor is a NATIVE Android EditText (not a Compose text field),
          // because Compose's text field gets very slow with big text and the keyboard open. It draws:
          //  - line numbers in a fixed gutter on the left
          //  - a faint highlight on the line the cursor is on
          //  - syntax colors (spans, calculated in the background after you stop typing)
          // Text size is set so that about 60 lines fit the height. No wrapping: it scrolls sideways.
          // =====================================================================
          class CodeEditText(context: Context) : android.widget.EditText(context) {
              class SyntaxSpan(color: Int) : android.text.style.ForegroundColorSpan(color)

              var onUserEdit: (() -> Unit)? = null
              var lang: SyntaxHighlighter.Lang? = null
              var readOnly: Boolean = false

              private val density = context.resources.displayMetrics.density
              private val ui = android.os.Handler(android.os.Looper.getMainLooper())
              private var suppress = false
              private var version = 0
              private var fitHeightPx = 0
              private var gutterDigits = 2
              private val numberPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
              private val fill = android.graphics.Paint()
              private val highlightRunnable = Runnable { runHighlight() }

              init {
                  typeface = android.graphics.Typeface.MONOSPACE
                  setTextColor(0xFFFFFFFF.toInt())
                  setBackgroundColor(0xFF1E1E1E.toInt())
                  gravity = android.view.Gravity.TOP or android.view.Gravity.START
                  setHorizontallyScrolling(true)
                  includeFontPadding = false
                  setLineSpacing(0f, 1f)
                  inputType = android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE or
                      android.text.InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                  // Less work for the system on every key: no extract UI, no learning, and no autofill / content
                  // capture (autofill copies the WHOLE text on every keystroke, which is slow for big files).
                  imeOptions = android.view.inputmethod.EditorInfo.IME_FLAG_NO_EXTRACT_UI or
                      android.view.inputmethod.EditorInfo.IME_FLAG_NO_PERSONALIZED_LEARNING
                  importantForAutofill = android.view.View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      importantForContentCapture = android.view.View.IMPORTANT_FOR_CONTENT_CAPTURE_NO_EXCLUDE_DESCENDANTS
                  }
                  isSaveEnabled = false
                  highlightColor = 0x55FFFFFF
                  isVerticalScrollBarEnabled = true
                  numberPaint.typeface = android.graphics.Typeface.MONOSPACE
                  numberPaint.textAlign = android.graphics.Paint.Align.RIGHT
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      val cursor = android.graphics.drawable.GradientDrawable()
                      cursor.setColor(0xFFFFFFFF.toInt())
                      cursor.setSize((2 * density).toInt().coerceAtLeast(2), -1)
                      textCursorDrawable = cursor
                  }
                  updatePadding()
                  addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: android.text.Editable?) {
                          val t0 = System.nanoTime()
                          version++
                          if (!suppress) onUserEdit?.invoke()
                          updatePadding()
                          scheduleHighlight(350)
                          val ms = (System.nanoTime() - t0) / 1_000_000L
                          if (ms >= 8L) AppLog.w("editor: afterTextChanged took ${ms}ms (len=${s?.length}, spans=${applied.size})")
                      }
                  })
              }

              override fun onCheckIsTextEditor(): Boolean = !readOnly && super.onCheckIsTextEditor()

              // Replaces the whole content (used once when the file is loaded)
              fun load(content: String, readOnlyMode: Boolean) {
                  val tL = System.nanoTime()
                  readOnly = readOnlyMode
                  if (readOnlyMode) keyListener = null
                  suppress = true
                  setText(content)
                  suppress = false
                  setSelection(0)
                  updatePadding()
                  scheduleHighlight(0)
                  AppLog.d("editor: load() of ${content.length} chars took ${(System.nanoTime() - tL) / 1_000_000L}ms")
              }

              // ----- size: about 60 lines fill the height (measured once, so the keyboard does not change it) -----
              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  if (fitHeightPx == 0 && h > 0) {
                      fitHeightPx = h
                      val lineH = (h - 16 * density) / 60f
                      val probe = android.graphics.Paint()
                      probe.typeface = android.graphics.Typeface.MONOSPACE
                      probe.textSize = 100f
                      val m = probe.fontMetrics
                      val ratio = (m.descent - m.ascent) / 100f
                      val px = lineH / ratio
                      setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, px)
                      numberPaint.textSize = px
                      updatePadding()
                  }
              }

              // Left padding = the line-number gutter (its width follows the number of digits)
              private fun updatePadding() {
                  val lines = lineCount.coerceAtLeast(1)
                  gutterDigits = maxOf(2, lines.toString().length)
                  val left = gutterWidth() + (6 * density).toInt()
                  if (paddingLeft != left) {
                      setPadding(left, (8 * density).toInt(), (24 * density).toInt(), (8 * density).toInt())
                  }
              }

              private fun gutterWidth(): Int =
                  (gutterDigits * numberPaint.measureText("0") + 14 * density).toInt()

              override fun onSelectionChanged(selStart: Int, selEnd: Int) {
                  super.onSelectionChanged(selStart, selEnd)
                  invalidate()
              }

              override fun onDraw(canvas: android.graphics.Canvas) {
                  val t0 = System.nanoTime()
                  drawInner(canvas)
                  val ms = (System.nanoTime() - t0) / 1_000_000L
                  if (ms >= 12L) AppLog.w("editor: onDraw took ${ms}ms (lines=${lineCount}, spans=${applied.size}, ime=${imeVisible})")
              }

              var imeVisible = false

              // LAG FIX (found with the Logcat viewer): with no-wrap text, Android's TextView rebuilds the whole
              // text layout on EVERY measure (its layout width is "very wide", never equal to the view width).
              // On a 5000 line file that is ~840 ms, and it happened on every tap, every key and every frame of
              // the keyboard animation. The text layout does not depend on the view HEIGHT, so when the width
              // spec is the same as last time we skip the expensive super.onMeasure and only take the new size.
              private var lastWSpec = Int.MIN_VALUE
              private var measuredOnce = false

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val t0 = System.nanoTime()
                  val exactW = android.view.View.MeasureSpec.getMode(widthMeasureSpec) == android.view.View.MeasureSpec.EXACTLY
                  val exactH = android.view.View.MeasureSpec.getMode(heightMeasureSpec) == android.view.View.MeasureSpec.EXACTLY
                  if (measuredOnce && exactW && exactH && widthMeasureSpec == lastWSpec && layout != null) {
                      setMeasuredDimension(
                          android.view.View.MeasureSpec.getSize(widthMeasureSpec),
                          android.view.View.MeasureSpec.getSize(heightMeasureSpec)
                      )
                      keepCursorVisible()
                      return
                  }
                  super.onMeasure(widthMeasureSpec, heightMeasureSpec)
                  lastWSpec = widthMeasureSpec
                  measuredOnce = true
                  val ms = (System.nanoTime() - t0) / 1_000_000L
                  if (ms >= 8L) AppLog.w("editor: full onMeasure took ${ms}ms")
              }

              // Since the skipped measure no longer scrolls the cursor into view when the keyboard shrinks the
              // field, do it here (vertical only)
              private fun keepCursorVisible() {
                  post {
                      val l = layout ?: return@post
                      if (!hasFocus()) return@post
                      val visible = height - extendedPaddingTop - extendedPaddingBottom
                      if (visible <= 0) return@post
                      val line = l.getLineForOffset(selectionEnd.coerceAtLeast(0))
                      val top = l.getLineTop(line)
                      val bottom = l.getLineBottom(line)
                      var y = scrollY
                      if (bottom > y + visible) y = bottom - visible
                      if (top < y) y = top
                      val maxY = (l.height - visible).coerceAtLeast(0)
                      y = y.coerceIn(0, maxY)
                      if (y != scrollY) scrollTo(scrollX, y)
                  }
              }

              override fun onLayout(changed: Boolean, left: Int, top: Int, right: Int, bottom: Int) {
                  val t0 = System.nanoTime()
                  super.onLayout(changed, left, top, right, bottom)
                  val ms = (System.nanoTime() - t0) / 1_000_000L
                  if (ms >= 8L) AppLog.w("editor: onLayout took ${ms}ms")
              }

              private fun drawInner(canvas: android.graphics.Canvas) {
                  val l = layout
                  if (l == null) {
                      super.onDraw(canvas)
                      return
                  }
                  val offY = extendedPaddingTop.toFloat()
                  val current = l.getLineForOffset(selectionEnd.coerceAtLeast(0))
                  // faint highlight on the line being edited
                  fill.color = 0x1AFFFFFF
                  canvas.drawRect(
                      scrollX.toFloat(), offY + l.getLineTop(current),
                      (scrollX + width).toFloat(), offY + l.getLineBottom(current), fill
                  )
                  super.onDraw(canvas)
                  // line numbers (fixed on the left, drawn over the text that scrolls under them)
                  val gw = gutterWidth().toFloat()
                  fill.color = 0xFF262626.toInt()
                  canvas.drawRect(scrollX.toFloat(), scrollY.toFloat(), scrollX + gw, (scrollY + height).toFloat(), fill)
                  fill.color = 0x22FFFFFF
                  canvas.drawRect(scrollX + gw - 1f, scrollY.toFloat(), scrollX + gw, (scrollY + height).toFloat(), fill)
                  val first = l.getLineForVertical((scrollY - offY).toInt().coerceAtLeast(0))
                  val last = l.getLineForVertical((scrollY + height - offY).toInt().coerceAtLeast(0))
                  val right = scrollX + gw - 8 * density
                  for (i in first..last) {
                      numberPaint.color = if (i == current) 0xFFFFFFFF.toInt() else 0x66FFFFFF
                      canvas.drawText((i + 1).toString(), right, offY + l.getLineBaseline(i), numberPaint)
                  }
              }

              // ----- syntax colors -----
              // The colors of the WHOLE file are calculated in the background (cache). Only the part on screen
              // (plus 20 lines above / below) gets real color spans. Thousands of spans make every keystroke slow,
              // because Android shifts all of them on each edit; a few hundred are fine.
              private var cache: AnnotatedString? = null
              private var cacheVersion = -1
              private val applied = ArrayList<SyntaxSpan>()

              private fun scheduleHighlight(delayMs: Long) {
                  ui.removeCallbacks(highlightRunnable)
                  if (lang != null) ui.postDelayed(highlightRunnable, delayMs)
              }

              override fun onScrollChanged(l: Int, t: Int, oldl: Int, oldt: Int) {
                  super.onScrollChanged(l, t, oldl, oldt)
                  if (t != oldt && cache != null) scheduleHighlight(90)
              }

              private fun clearSyntax() {
                  val ed = text
                  if (ed != null) for (s in applied) ed.removeSpan(s)
                  applied.clear()
              }

              private fun applyWindow() {
                  val lay = layout
                  if (lay == null) {
                      // not measured yet: try again shortly
                      ui.postDelayed(highlightRunnable, 100)
                      return
                  }
                  val ed = text ?: return
                  val c = cache ?: return
                  val tA = System.nanoTime()
                  clearSyntax()
                  if (lay.lineCount == 0) return
                  val firstLine = (lay.getLineForVertical(scrollY) - 20).coerceAtLeast(0)
                  val lastLine = (lay.getLineForVertical(scrollY + height) + 20).coerceAtMost(lay.lineCount - 1)
                  val from = lay.getLineStart(firstLine)
                  val to = lay.getLineEnd(lastLine)
                  for (r in c.spanStyles) {
                      if (r.end <= from) continue
                      if (r.start >= to) break
                      if (r.end > ed.length) break
                      val span = SyntaxSpan(r.item.color.toArgb())
                      ed.setSpan(span, r.start, r.end, android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      applied.add(span)
                  }
                  AppLog.d("editor: applyWindow ${(System.nanoTime() - tA) / 1_000_000L}ms, spans=${applied.size}, total colour ranges=${c.spanStyles.size}")
              }

              private fun runHighlight() {
                  val lg = lang ?: return
                  val ed = text ?: return
                  if (ed.length > SyntaxHighlighter.MAX_CHARS) {
                      clearSyntax()
                      return
                  }
                  if (cache != null && cacheVersion == version) {
                      applyWindow()
                      return
                  }
                  val snapshot = ed.toString()
                  val v = version
                  Thread {
                      val tH = System.nanoTime()
                      val result = SyntaxHighlighter.highlight(snapshot, lg)
                      AppLog.d("editor: highlight of ${snapshot.length} chars took ${(System.nanoTime() - tH) / 1_000_000L}ms (background)")
                      ui.post {
                          // use it only if the text did not change meanwhile
                          if (v == version) {
                              cache = result
                              cacheVersion = v
                              applyWindow()
                          }
                      }
                  }.start()
              }
          }

          // =====================================================================
          // TEXT / CODE EDITOR SCREEN: back button top-left, Save top-right (faint and not tappable until
          // something changed), the rest is the native text field above. UTF-8 files only (anything else would be
          // damaged by saving). Line endings (CRLF) and a BOM are kept as they were. Files inside an
          // opened archive are read only.
          // =====================================================================
          @Composable
          fun TextEditorScreen(file: File, onClose: (saved: Boolean) -> Unit) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val readOnly = remember(file) { ArchiveSupport.isInside(context, file) }
              var loaded by remember { mutableStateOf(false) }
              var loadedText by remember { mutableStateOf<String?>(null) }
              var editor by remember { mutableStateOf<CodeEditText?>(null) }
              var changed by remember { mutableStateOf(false) }
              var crlf by remember { mutableStateOf(false) }
              var bom by remember { mutableStateOf(false) }
              var savedOnce by remember { mutableStateOf(false) }
              var saving by remember { mutableStateOf(false) }
              var confirmLeave by remember { mutableStateOf(false) }

              // 1) read the file in the background
              LaunchedEffect(file) {
                  val result = withContext(Dispatchers.IO) {
                      try {
                          val decoder = Charsets.UTF_8.newDecoder()
                              .onMalformedInput(CodingErrorAction.REPORT)
                              .onUnmappableCharacter(CodingErrorAction.REPORT)
                          decoder.decode(ByteBuffer.wrap(file.readBytes())).toString()
                      } catch (e: Exception) { null }
                  }
                  if (result == null) {
                      Toast.makeText(context, "Can't open: not a UTF-8 text file", Toast.LENGTH_SHORT).show()
                      onClose(false)
                      return@LaunchedEffect
                  }
                  var t: String = result
                  if (t.startsWith("﻿")) { bom = true; t = t.substring(1) }
                  if (t.contains("\r\n")) { crlf = true; t = t.replace("\r\n", "\n") }
                  loadedText = t
              }

              // 2) put the text into the native field once both the text and the field exist
              LaunchedEffect(loadedText, editor) {
                  val t = loadedText
                  val e = editor
                  if (t != null && e != null && !loaded) {
                      e.load(t, readOnly)
                      changed = false
                      loaded = true
                  }
              }

              val dirty = loaded && !readOnly && changed

              fun save(after: () -> Unit = {}) {
                  val e = editor
                  if (!dirty || saving || e == null) return
                  val text = e.text.toString()
                  saving = true
                  scope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              var out = text
                              if (crlf) out = out.replace("\n", "\r\n")
                              if (bom) out = "﻿" + out
                              file.writeText(out, Charsets.UTF_8)
                              true
                          } catch (ex: Exception) { false }
                      }
                      saving = false
                      if (ok) {
                          changed = false
                          savedOnce = true
                          Toast.makeText(context, "Saved", Toast.LENGTH_SHORT).show()
                          after()
                      } else {
                          Toast.makeText(context, "Couldn't save", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              fun requestClose() {
                  if (dirty) confirmLeave = true else onClose(savedOnce)
              }

              BackHandler { requestClose() }

              val lang = remember(file) { SyntaxHighlighter.langFor(file.name) }

              FrameMonitor("editor")
              val imeDensity = LocalDensity.current
              val imeBottom = WindowInsets.ime.getBottom(imeDensity)
              LaunchedEffect(imeBottom) {
                  editor?.imeVisible = imeBottom > 0
                  AppLog.d("editor: keyboard height now ${imeBottom}px (${if (imeBottom > 0) "visible" else "hidden"})")
              }
              LaunchedEffect(file) {
                  AppLog.d("editor: opened ${file.name} (${file.length()} bytes), Android ${Build.VERSION.SDK_INT}, ${Build.MODEL}")
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .windowInsetsPadding(WindowInsets.systemBars)
                      .imePadding()
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 8.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconFlashButton(Icons.AutoMirrored.Filled.ArrowBack, "Back", iconSize = 24.dp) { requestClose() }
                      Spacer(Modifier.weight(1f))
                      val savePressed = remember { mutableStateOf(false) }
                      val active = dirty && !saving
                      Box(
                          modifier = Modifier
                              .clip(CircleShape)
                              .background(
                                  when {
                                      !active -> Color.White.copy(alpha = 0.10f)
                                      savePressed.value -> Color.Black
                                      else -> Color.White
                                  }
                              )
                              .then(if (active) Modifier.pressFlash(savePressed) { save() } else Modifier)
                              .padding(horizontal = 20.dp, vertical = 9.dp)
                      ) {
                          Text(
                              text = "Save",
                              color = when {
                                  !active -> Color.White.copy(alpha = 0.30f)
                                  savePressed.value -> Color.White
                                  else -> Color.Black
                              },
                              fontSize = 14.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                      }
                      Spacer(Modifier.width(4.dp))
                  }
                  Box(Modifier.fillMaxWidth().height(1.dp).background(Color.White.copy(alpha = 0.12f)))

                  Box(modifier = Modifier.weight(1f).fillMaxWidth()) {
                      AndroidView(
                          modifier = Modifier.fillMaxSize(),
                          factory = { ctx ->
                              CodeEditText(ctx).also {
                                  it.lang = lang
                                  it.onUserEdit = { changed = true }
                                  editor = it
                              }
                          }
                      )
                      if (!loaded) {
                          Box(Modifier.fillMaxSize().background(Color(0xFF1E1E1E)), contentAlignment = Alignment.Center) {
                              CircularProgressIndicator(color = Color.White)
                          }
                      }
                  }
              }

              if (confirmLeave) {
                  AlertDialog(
                      onDismissRequest = { confirmLeave = false },
                      containerColor = Color(0xFF2A2A2A),
                      title = { Text("Unsaved changes", color = Color.White) },
                      text = { Text("Save before leaving?", color = Color.White.copy(alpha = 0.7f)) },
                      confirmButton = {
                          TextButton(onClick = {
                              confirmLeave = false
                              save { onClose(true) }
                          }) { Text("Save", color = Color.White) }
                      },
                      dismissButton = {
                          TextButton(onClick = {
                              confirmLeave = false
                              onClose(savedOnce)
                          }) { Text("Discard", color = Color.White) }
                      }
                  )
              }
          }

          // =====================================================================
          // LOGCAT (top-right menu): shows this app's own log lines (the system only allows an app to read its
          // own log) with Refresh and Copy. The app writes useful lines itself with AppLog (tag "GreyB"):
          // editor open/load times, keyboard shown/hidden, slow edits / slow frames, colour work, archives.
          // NOTE FOR FUTURE: log anything worth checking with AppLog.d(...) / AppLog.w(...).
          // =====================================================================
          object AppLog {
              const val TAG = "GreyB"
              fun d(msg: String) { android.util.Log.d(TAG, msg) }
              fun w(msg: String) { android.util.Log.w(TAG, msg) }
          }

          object LogReader {
              private fun run(args: List<String>): List<String>? = try {
                  val p = ProcessBuilder(args).redirectErrorStream(true).start()
                  val lines = p.inputStream.bufferedReader().readLines()
                  p.waitFor()
                  lines
              } catch (e: Exception) { null }

              // The last lines of this app's log
              fun read(maxLines: Int): List<String> {
                  val pid = android.os.Process.myPid()
                  val direct = run(listOf("logcat", "-d", "-v", "time", "--pid=$pid", "-t", "$maxLines"))
                  if (direct != null && direct.isNotEmpty() && !direct.first().startsWith("logcat:")) return direct
                  // Fallback for logcat versions without --pid: filter by the process id in each line
                  val all = run(listOf("logcat", "-d", "-v", "time", "-t", "${maxLines * 4}")) ?: return listOf("Could not read logcat")
                  val pat = Regex("\\(\\s*$pid\\)")
                  return all.filter { pat.containsMatchIn(it) }.takeLast(maxLines)
              }
          }

          // Logs frames that took long (jank) while it is composed. Use inside screens you want to check.
          @Composable
          fun FrameMonitor(label: String) {
              DisposableEffect(label) {
                  var last = 0L
                  val choreographer = android.view.Choreographer.getInstance()
                  val callback = object : android.view.Choreographer.FrameCallback {
                      override fun doFrame(frameTimeNanos: Long) {
                          if (last != 0L) {
                              val ms = (frameTimeNanos - last) / 1_000_000L
                              if (ms > 40L) AppLog.w("$label: slow frame ${ms}ms")
                          }
                          last = frameTimeNanos
                          choreographer.postFrameCallback(this)
                      }
                  }
                  choreographer.postFrameCallback(callback)
                  onDispose { choreographer.removeFrameCallback(callback) }
              }
          }

          @Composable
          fun LogcatScreen(onClose: () -> Unit) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var lines by remember { mutableStateOf<List<String>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              val listState = remember { LazyListState() }

              fun refresh() {
                  scope.launch {
                      loading = true
                      lines = withContext(Dispatchers.IO) { LogReader.read(3000) }
                      loading = false
                      if (lines.isNotEmpty()) listState.scrollToItem(lines.size - 1)
                  }
              }

              LaunchedEffect(Unit) { refresh() }
              BackHandler { onClose() }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .windowInsetsPadding(WindowInsets.systemBars)
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 8.dp, vertical = 2.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconFlashButton(Icons.AutoMirrored.Filled.ArrowBack, "Back", iconSize = 24.dp) { onClose() }
                      Text(
                          text = "Logcat",
                          color = Color.White,
                          fontWeight = FontWeight.Bold,
                          fontSize = 18.sp,
                          modifier = Modifier.weight(1f).padding(start = 8.dp)
                      )
                      DialogButton(text = "Refresh", modifier = Modifier.width(88.dp)) { refresh() }
                      Spacer(Modifier.width(6.dp))
                      DialogButton(text = "Copy", modifier = Modifier.width(80.dp), primary = true) {
                          val header = "GreyB logcat | Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT}) | ${Build.MANUFACTURER} ${Build.MODEL}\n"
                          var body = lines.joinToString("\n")
                          if (body.length > 400_000) body = body.takeLast(400_000)
                          val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("logcat", header + body))
                          Toast.makeText(context, "Copied ${lines.size} lines", Toast.LENGTH_SHORT).show()
                      }
                      Spacer(Modifier.width(4.dp))
                  }
                  Box(Modifier.fillMaxWidth().height(1.dp).background(Color.White.copy(alpha = 0.12f)))
                  Box(modifier = Modifier.weight(1f).fillMaxWidth()) {
                      LazyColumn(
                          state = listState,
                          modifier = Modifier.fillMaxSize().padding(horizontal = 8.dp)
                      ) {
                          items(lines.size) { i ->
                              val line = lines[i]
                              // "-v time" lines look like: 11-22 21:30:00.123 D/Tag( 1234): message  (level letter at index 19)
                              val level = if (line.length > 20 && line[20] == '/') line[19] else ' '
                              val color = when (level) {
                                  'E' -> Color(0xFFFF8A80)
                                  'W' -> Color(0xFFFFCC80)
                                  'I' -> Color.White
                                  'D' -> Color.White.copy(alpha = 0.75f)
                                  else -> Color.White.copy(alpha = 0.5f)
                              }
                              Text(
                                  text = line,
                                  color = color,
                                  fontSize = 10.sp,
                                  lineHeight = 13.sp,
                                  fontFamily = FontFamily.Monospace,
                                  modifier = Modifier.padding(vertical = 1.dp)
                              )
                          }
                      }
                      if (loading) {
                          CircularProgressIndicator(color = Color.White, modifier = Modifier.align(Alignment.Center))
                      } else if (lines.isEmpty()) {
                          Text("No log lines yet", color = Color.White.copy(alpha = 0.6f), modifier = Modifier.align(Alignment.Center))
                      }
                  }
              }
          }

          fun copyFileContent(context: Context, file: File) {
              if (file.length() > 2_000_000L) {
                  Toast.makeText(context, "File too large to copy", Toast.LENGTH_SHORT).show()
                  return
              }
              try {
                  val text = file.readText()
                  val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText(file.name, text))
                  Toast.makeText(context, "Copied ${file.name}", Toast.LENGTH_SHORT).show()
              } catch (e: Exception) {
                  Toast.makeText(context, "Could not read file", Toast.LENGTH_SHORT).show()
              }
          }

          // ---------- Bookmarks side panel ----------
          // No animation: it appears and disappears at once.
          // Press and hold the WHOLE row to drag; it follows the finger until release.
          // Each row shows an internal or SD card icon (same icons as Home).
          @Composable
          fun BookmarksPanel(
              visible: Boolean,
              listVersion: Int,
              onDismiss: () -> Unit,
              onNavigateHome: () -> Unit,
              onNavigateTo: (String) -> Unit,
              onReorder: (List<String>) -> Unit
          ) {
              val context = LocalContext.current
              var order by remember(listVersion) { mutableStateOf(Bookmarks.getAll(context)) }
              var draggingIndex by remember { mutableStateOf(-1) }
              var dragOffsetY by remember { mutableStateOf(0f) }
              val rowHeightPx = with(LocalDensity.current) { 44.dp.toPx() }

              if (!visible && draggingIndex == -1) return

              Box(modifier = Modifier.fillMaxSize()) {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color(0x99000000))
                          .clickable(
                              interactionSource = remember { MutableInteractionSource() },
                              indication = null,
                              onClick = onDismiss
                          )
                  )

                  Column(
                      modifier = Modifier
                          .align(Alignment.CenterStart)
                          .fillMaxHeight()
                          .width(240.dp)
                          .background(Color(0xFF232323))
                          .windowInsetsPadding(WindowInsets.systemBars)
                          .padding(vertical = 12.dp)
                  ) {
                      Text(
                          text = "Bookmarks",
                          color = Color(0xFF888888),
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Medium,
                          modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)
                      )

                      // Home: pinned, first, not draggable
                      TappableRow(onClick = onNavigateHome) {
                          Icon(
                              imageVector = Icons.Filled.Home,
                              contentDescription = null,
                              tint = Color(0xFF4FC3F7),
                              modifier = Modifier.size(20.dp)
                          )
                          Spacer(Modifier.width(10.dp))
                          Text("Home", fontSize = 14.sp, fontWeight = FontWeight.Medium)
                      }

                      Spacer(Modifier.height(4.dp))

                      // The bookmark list scrolls (Home stays pinned on top), so any number of bookmarks fits
                      Column(modifier = Modifier.weight(1f).verticalScroll(rememberScrollState())) {
                      order.forEachIndexed { index, path ->
                          val name = File(path).name.ifEmpty { path }
                          val isDragging = index == draggingIndex
                          val internal = isInternalPath(context, path)
                          val rowPressed = remember { mutableStateOf(false) }
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .graphicsLayer {
                                      translationY = if (isDragging) dragOffsetY else 0f
                                  }
                                  .background(
                                      if (isDragging) Color(0xFF2F2F2F)
                                      else if (rowPressed.value) Color.White
                                      else Color.Transparent
                                  )
                                  .pointerInput(order) {
                                      detectDragGesturesAfterLongPress(
                                          onDragStart = {
                                              draggingIndex = index
                                              dragOffsetY = 0f
                                          },
                                          onDrag = { change, dragAmount ->
                                              change.consume()
                                              dragOffsetY += dragAmount.y
                                              if (draggingIndex >= 0) {
                                                  val moveBy = (dragOffsetY / rowHeightPx).toInt()
                                                  if (moveBy != 0) {
                                                      val newIndex = (draggingIndex + moveBy).coerceIn(0, order.size - 1)
                                                      if (newIndex != draggingIndex) {
                                                          val mutable = order.toMutableList()
                                                          val item = mutable.removeAt(draggingIndex)
                                                          mutable.add(newIndex, item)
                                                          order = mutable
                                                          draggingIndex = newIndex
                                                          dragOffsetY -= moveBy * rowHeightPx
                                                      }
                                                  }
                                              }
                                          },
                                          onDragEnd = {
                                              draggingIndex = -1
                                              dragOffsetY = 0f
                                              onReorder(order)
                                          },
                                          onDragCancel = {
                                              draggingIndex = -1
                                              dragOffsetY = 0f
                                          }
                                      )
                                  }
                                  .pressFlash(rowPressed) { onNavigateTo(path) }
                                  .padding(horizontal = 16.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(
                                  imageVector = if (internal) Icons.Filled.PhoneAndroid else Icons.Filled.SdCard,
                                  contentDescription = if (internal) "Internal storage" else "SD card",
                                  tint = Color(0xFF90CAF9),
                                  modifier = Modifier.size(20.dp)
                              )
                              Spacer(Modifier.width(10.dp))
                              Text(name, color = if (rowPressed.value) Color.Black else Color.White, fontSize = 14.sp, maxLines = 1, modifier = Modifier.weight(1f))
                          }
                      }

                      if (order.isEmpty()) {
                          Text(
                              text = "No bookmarks yet",
                              color = Color(0xFF666666),
                              fontSize = 12.sp,
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)
                          )
                      }
                      }
                  }
              }
          }

          // ---------- Marquee filename (merged from GreyIV) ----------
          // Static "..." view, pauses, pans to reveal the full name, then snaps back and repeats.
          // Never relies on the text layout engine's line-break/wrap decisions, so it is unaffected by
          // punctuation like fullwidth colon or other Unicode chars.
          @Composable
          fun MarqueeFilename(name: String, modifier: Modifier = Modifier) {
              var containerWidthPx by remember { mutableStateOf(0f) }
              var textWidthPx by remember(name) { mutableStateOf(0f) }
              val offsetAnim = remember(name) { Animatable(0f) }

              val overflowAmount = (textWidthPx - containerWidthPx).coerceAtLeast(0f)
              val needsMarquee = overflowAmount > 1f

              LaunchedEffect(name, containerWidthPx, textWidthPx, needsMarquee) {
                  if (!needsMarquee) return@LaunchedEffect
                  while (true) {
                      offsetAnim.snapTo(0f)
                      delay(1800)
                      offsetAnim.animateTo(
                          targetValue = -overflowAmount,
                          animationSpec = tween(
                              durationMillis = (overflowAmount * 12).toInt().coerceIn(800, 6000)
                          )
                      )
                      delay(1200)
                      offsetAnim.animateTo(
                          targetValue = 0f,
                          animationSpec = tween(400)
                      )
                      delay(600)
                  }
              }

              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .clipToBounds()
                      .onSizeChangedCompat { w, _ -> containerWidthPx = w.toFloat() }
              ) {
                  Text(
                      text = name,
                      color = Color.White,
                      fontSize = 15.sp,
                      maxLines = 1,
                      softWrap = false,
                      overflow = TextOverflow.Visible,
                      modifier = Modifier
                          .onSizeChangedCompat { w, _ -> textWidthPx = w.toFloat() }
                          .graphicsLayer { translationX = offsetAnim.value }
                  )
              }
          }

          // ---------- Image viewer ----------
          // Merged from GreyIV: marquee filename, true-resolution label, large-image decoding.
          @Composable
          fun ImageViewerScreen(images: List<File>, startIndex: Int, onClose: () -> Unit) {
              val pagerState = rememberPagerState(initialPage = startIndex) { images.size }
              var controlsVisible by remember { mutableStateOf(true) }
              var currentPageZoomed by remember { mutableStateOf(false) }

              // Tracks resolution per page index once known, so the label can
              // appear as soon as it's available and persists across swipes.
              val resolutions = remember { mutableStateMapOf<Int, Pair<Int, Int>>() }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  HorizontalPager(
                      state = pagerState,
                      modifier = Modifier.fillMaxSize(),
                      userScrollEnabled = !currentPageZoomed
                  ) { page ->
                      val file = images[page]
                      val uri = remember(file) { Uri.fromFile(file) }
                      if (ThumbnailCache.isGif(file.name)) {
                          GifPage(
                              uri = uri,
                              onTap = { controlsVisible = !controlsVisible },
                              onSizeKnown = { w, h -> resolutions[page] = w to h }
                          )
                      } else {
                          ZoomableImagePage(
                              uri = uri,
                              onTap = { controlsVisible = !controlsVisible },
                              onZoomStateChanged = { zoomed ->
                                  if (page == pagerState.currentPage) currentPageZoomed = zoomed
                              },
                              onSizeKnown = { w, h -> resolutions[page] = w to h }
                          )
                      }
                  }

                  AnimatedVisibility(
                      visible = controlsVisible,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.align(Alignment.TopStart)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xAA000000))
                              .windowInsetsPadding(WindowInsets.statusBars)
                              .padding(horizontal = 8.dp, vertical = 6.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconFlashButton(Icons.Filled.Close, "Close", iconSize = 24.dp) { onClose() }
                          Spacer(Modifier.width(8.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              MarqueeFilename(
                                  name = images.getOrNull(pagerState.currentPage)?.name ?: ""
                              )
                              val res = resolutions[pagerState.currentPage]
                              if (res != null) {
                                  Text(
                                      text = "(${res.first}x${res.second})",
                                      color = Color.White.copy(alpha = 0.6f),
                                      fontSize = 12.sp,
                                      maxLines = 1
                                  )
                              }
                          }
                          Spacer(Modifier.width(8.dp))
                          Text(
                              text = "${pagerState.currentPage + 1}/${images.size}",
                              color = Color.White.copy(alpha = 0.7f),
                              fontSize = 13.sp
                          )
                          Spacer(Modifier.width(8.dp))
                      }
                  }
              }

              BackHandler { onClose() }
          }

          @Composable
          fun GifPage(uri: Uri, onTap: () -> Unit, onSizeKnown: (Int, Int) -> Unit) {
              val context = LocalContext.current
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null,
                          onClick = onTap
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  AndroidView(
                      factory = { ctx ->
                          android.widget.ImageView(ctx).apply {
                              scaleType = android.widget.ImageView.ScaleType.FIT_CENTER
                              val drawable = FullImageCache.loadAnimatedDrawable(ctx, uri)
                              when (drawable) {
                                  is AnimatedImageDrawable -> {
                                      setImageDrawable(drawable)
                                      drawable.start()
                                      onSizeKnown(drawable.intrinsicWidth, drawable.intrinsicHeight)
                                  }
                                  is Bitmap -> {
                                      setImageBitmap(drawable)
                                      onSizeKnown(drawable.width, drawable.height)
                                  }
                              }
                          }
                      },
                      modifier = Modifier.fillMaxSize()
                  )
              }
          }

          @Composable
          fun ZoomableImagePage(
              uri: Uri,
              onTap: () -> Unit,
              onZoomStateChanged: (Boolean) -> Unit,
              onSizeKnown: (Int, Int) -> Unit
          ) {
              val context = LocalContext.current
              val density = LocalDensity.current
              var containerSize by remember { mutableStateOf(Offset.Zero) }
              val decayAnimationSpec = rememberSplineBasedDecay<Float>()

              val targetDimension = with(density) { (2200.dp.toPx()).toInt() }
              var bitmap by remember(uri) { mutableStateOf<Bitmap?>(null) }
              var decodeFailed by remember(uri) { mutableStateOf(false) }

              LaunchedEffect(uri) {
                  // Cheap bounds-only probe first so the resolution label shows the
                  // TRUE source size, not the downsampled render size.
                  val size = FullImageCache.probeSize(context, uri)
                  if (size != null) onSizeKnown(size.first, size.second)

                  val result = FullImageCache.decodeForViewer(context, uri, targetDimension)
                  if (result != null) {
                      bitmap = result
                  } else {
                      decodeFailed = true
                  }
              }

              val minScale = 1f
              val maxScale = 6f

              val scaleAnim = remember(uri) { Animatable(1f) }
              val offsetXAnim = remember(uri) { Animatable(0f) }
              val offsetYAnim = remember(uri) { Animatable(0f) }
              val scope = rememberCoroutineScope()

              LaunchedEffect(scaleAnim.value) {
                  onZoomStateChanged(scaleAnim.value > minScale + 0.01f)
              }

              fun clampOffsets(scale: Float, x: Float, y: Float): Offset {
                  if (scale <= minScale) return Offset.Zero
                  val maxOffsetX = (containerSize.x * (scale - 1f)) / (2f * scale)
                  val maxOffsetY = (containerSize.y * (scale - 1f)) / (2f * scale)
                  return Offset(x.coerceIn(-maxOffsetX, maxOffsetX), y.coerceIn(-maxOffsetY, maxOffsetY))
              }

              fun animateTo(target: Float, offX: Float, offY: Float, durationMs: Int = 220) {
                  scope.launch { scaleAnim.animateTo(target, animationSpec = tween(durationMs)) }
                  scope.launch { offsetXAnim.animateTo(offX, animationSpec = tween(durationMs)) }
                  scope.launch { offsetYAnim.animateTo(offY, animationSpec = tween(durationMs)) }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .onSizeChangedCompat { w, h -> containerSize = Offset(w.toFloat(), h.toFloat()) }
                      .pointerInput(uri) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val downTime = System.currentTimeMillis()
                              var moved = false
                              var wasMultiTouch = false
                              val velocityTracker = VelocityTracker()

                              do {
                                  val event = awaitPointerEvent()
                                  val zoomChange = event.calculateZoom()
                                  val panChange = event.calculatePan()
                                  val isMultiTouch = event.changes.size > 1
                                  if (isMultiTouch) wasMultiTouch = true

                                  if (isMultiTouch || scaleAnim.value > minScale + 0.01f) {
                                      if (panChange.getDistance() > 1f || zoomChange != 1f) moved = true
                                      val newScale = (scaleAnim.value * zoomChange).coerceIn(minScale, maxScale)
                                      val rawX = offsetXAnim.value + panChange.x / newScale
                                      val rawY = offsetYAnim.value + panChange.y / newScale
                                      val clamped = clampOffsets(newScale, rawX, rawY)
                                      scope.launch { scaleAnim.snapTo(newScale) }
                                      scope.launch { offsetXAnim.snapTo(clamped.x) }
                                      scope.launch { offsetYAnim.snapTo(clamped.y) }
                                      event.changes.forEach {
                                          velocityTracker.addPointerInputChange(it)
                                          it.consume()
                                      }
                                  }
                              } while (event.changes.any { it.pressed })

                              if (scaleAnim.value < minScale + 0.02f && scaleAnim.value != minScale) {
                                  animateTo(minScale, 0f, 0f, 180)
                              } else if (moved && !wasMultiTouch && scaleAnim.value > minScale + 0.01f) {
                                  val velocity = velocityTracker.calculateVelocity()
                                  val currentScale = scaleAnim.value
                                  scope.launch {
                                      offsetXAnim.animateDecay(
                                          initialVelocity = velocity.x / currentScale,
                                          animationSpec = decayAnimationSpec
                                      ) {
                                          val clamped = clampOffsets(currentScale, this.value, offsetYAnim.value)
                                          if (this.value != clamped.x) {
                                              scope.launch { offsetXAnim.snapTo(clamped.x) }
                                          }
                                      }
                                  }
                                  scope.launch {
                                      offsetYAnim.animateDecay(
                                          initialVelocity = velocity.y / currentScale,
                                          animationSpec = decayAnimationSpec
                                      ) {
                                          val clamped = clampOffsets(currentScale, offsetXAnim.value, this.value)
                                          if (this.value != clamped.y) {
                                              scope.launch { offsetYAnim.snapTo(clamped.y) }
                                          }
                                      }
                                  }
                              }

                              if (!moved && !wasMultiTouch) {
                                  val elapsed = System.currentTimeMillis() - downTime
                                  if (elapsed < 500) {
                                      val secondDown = withTimeoutOrNull(300L) {
                                          awaitFirstDown(requireUnconsumed = false)
                                      }
                                      if (secondDown != null) {
                                          do {
                                              val e2 = awaitPointerEvent()
                                              e2.changes.forEach { it.consume() }
                                          } while (e2.changes.any { it.pressed })

                                          if (scaleAnim.value > minScale + 0.05f) {
                                              animateTo(minScale, 0f, 0f)
                                          } else {
                                              val target = 3f
                                              val cx = containerSize.x / 2f
                                              val cy = containerSize.y / 2f
                                              val newOffset = clampOffsets(target, cx - down.position.x, cy - down.position.y)
                                              animateTo(target, newOffset.x, newOffset.y)
                                          }
                                      } else {
                                          onTap()
                                      }
                                  }
                              }
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  val bmp = bitmap
                  if (bmp != null) {
                      Image(
                          bitmap = bmp.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer(
                                  scaleX = scaleAnim.value,
                                  scaleY = scaleAnim.value,
                                  translationX = offsetXAnim.value * scaleAnim.value,
                                  translationY = offsetYAnim.value * scaleAnim.value
                              )
                      )
                  } else if (decodeFailed) {
                      Text(
                          "Couldn't load this image",
                          color = Color.White.copy(alpha = 0.6f),
                          fontSize = 14.sp
                      )
                  } else {
                      CircularProgressIndicator(color = Color.White.copy(alpha = 0.6f))
                  }
              }
          }

          fun Modifier.onSizeChangedCompat(onSize: (Int, Int) -> Unit): Modifier =
              this.then(
                  Modifier.layout { measurable, constraints ->
                      val placeable = measurable.measure(constraints)
                      onSize(placeable.width, placeable.height)
                      layout(placeable.width, placeable.height) {
                          placeable.place(0, 0)
                      }
                  }
              )

          fun openFile(context: Context, file: File) {
              val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
              val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(file.extension.lowercase()) ?: "*/*"
              openUri(context, uri, mime)
          }

          private fun openUri(context: Context, uri: Uri, mime: String) {
              val intent = Intent(Intent.ACTION_VIEW).apply {
                  setDataAndType(uri, mime)
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              try {
                  context.startActivity(Intent.createChooser(intent, "Open with"))
              } catch (e: Exception) {
                  Toast.makeText(context, "No app to open this file", Toast.LENGTH_SHORT).show()
              }
          }

          @Composable
          fun FileExplorerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF1E1E1E),
                      surface = Color(0xFF2A2A2A),
                      primary = Color.White,
                      onBackground = Color.White,
                      onSurface = Color.White
                  ),
                  content = content
              )
          }
          ENDOFFILE

      - name: Generate Gradle Scripts
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cat > settings.gradle.kts << 'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "GreyBExplorer"
          include(":app")
          ENDOFFILE

          cat > build.gradle.kts << 'ENDOFFILE'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false
          }
          ENDOFFILE

          # R8 rules for the archive libraries (they have optional parts that are not on Android)
          cat > app/proguard-rules.pro << 'PROEOF'
          -dontwarn org.apache.commons.compress.**
          -dontwarn org.apache.commons.lang3.**
          -dontwarn org.apache.commons.io.**
          -dontwarn org.apache.commons.codec.**
          -dontwarn com.github.luben.zstd.**
          -dontwarn org.brotli.dec.**
          -dontwarn org.objectweb.asm.**
          -dontwarn org.tukaani.xz.**
          -dontwarn com.github.junrar.**
          -dontwarn org.slf4j.**
          -dontwarn java.lang.management.**
          -dontwarn javax.naming.**
          -dontwarn javax.annotation.**
          -keep class org.apache.commons.compress.** { *; }
          -keep class org.tukaani.xz.** { *; }
          -keep class com.github.junrar.** { *; }
          -keep class net.lingala.zip4j.** { *; }
          PROEOF

          cat > app/build.gradle.kts << APPEOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.greyb.explorer"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.greyb.explorer"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = ${BUILD_NUMBER}
                  versionName = "${BUILD_NUMBER}"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "greyb2024"
                      keyAlias = "greyb"
                      keyPassword = "greyb2024"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              packaging {
                  resources {
                      excludes += listOf(
                          "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/DEPENDENCIES",
                          "META-INF/INDEX.LIST", "META-INF/*.kotlin_module.bak"
                      )
                  }
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.documentfile:documentfile:1.0.1")
              // Zip reading / writing with password support (AES + classic zip encryption)
              implementation("net.lingala.zip4j:zip4j:2.11.5")
              // More archive formats: 7z, tar, tar.gz / bz2 / xz, single gz / bz2 / xz, and rar (RAR4)
              implementation("org.apache.commons:commons-compress:1.26.2")
              implementation("org.tukaani:xz:1.9")
              implementation("com.github.junrar:junrar:7.5.5")
          }
          APPEOF

          cat > gradle.properties << 'ENDOFFILE'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
          kotlin.code.style=official
          android.suppressUnsupportedCompileSdk=36
          ENDOFFILE

      - name: Generate fixed keystore (if missing)
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkey -v -keystore app/release.keystore -alias greyb -keyalg RSA -keysize 2048 -validity 10000 -storepass greyb2024 -keypass greyb2024 -dname "CN=GreyB, OU=GreyB, O=GreyB Explorer, L=Test, S=Test, C=US"
            echo "✅ New keystore created"
          else
            echo "✅ Using existing cached keystore"
          fi

      - name: Generate launcher icons
        run: |
          rm -rf app/src/main/res/mipmap-*
          pip3 install Pillow --quiet --break-system-packages 2>/dev/null || pip install Pillow --quiet
          python3 << 'ENDOFFILE'
          from PIL import Image, ImageDraw
          import os

          def make_icon(size):
              bg = (30, 30, 30, 255)
              white = (255, 255, 255, 255)
              accent = (100, 100, 100, 255)
              img = Image.new('RGBA', (size, size), bg)
              d = ImageDraw.Draw(img)
              d.rectangle([size*0.15, size*0.3, size*0.85, size*0.75], fill=white)
              d.rectangle([size*0.15, size*0.2, size*0.5, size*0.3], fill=accent)
              return img

          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, s in sizes.items():
              path = f'app/src/main/res/mipmap-{density}'
              os.makedirs(path, exist_ok=True)
              icon = make_icon(s)
              icon.save(f'{path}/ic_launcher.png')
              icon.save(f'{path}/ic_launcher_round.png')
          print("Icons generated!")
          ENDOFFILE

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.11.1 --distribution-type=bin
          chmod +x gradlew

      - name: Clean build
        run: rm -rf app/build && ./gradlew clean --no-daemon

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signing
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
              echo "✅ Release APK generated"
              echo "📦 APK size: $(ls -lh "$APK_PATH" | awk '{print $5}')"
              BT_PATH=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | head -1)
              if [ -n "$BT_PATH" ]; then $BT_PATH/apksigner verify --print-certs "$APK_PATH" 2>/dev/null || echo "⚠️ apksigner verify skipped"; fi
          else echo "❌ Release APK not found"; exit 1; fi

      - name: Bundle APK + source
        run: |
          mkdir -p GreyB-Explorer-release
          cp app/build/outputs/apk/release/app-release.apk GreyB-Explorer-release/GreyB-Explorer.apk
          cp app/src/main/java/com/greyb/explorer/MainActivity.kt GreyB-Explorer-release/
          cp app/src/main/AndroidManifest.xml GreyB-Explorer-release/
          cp .github/workflows/build.yml GreyB-Explorer-release/
          APK_SIZE=$(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')
          cat > GreyB-Explorer-release/BUILD_INFO.txt << INFOEOF
          Build:      #${{ github.run_number }}
          Commit:     ${{ github.sha }}
          Timestamp:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Signed:     Yes (fixed key)
          APK Size:   ${APK_SIZE}
          Optimized:  Yes (ProGuard/R8 enabled)
          INFOEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreyB-Explorer-${{ github.run_number }}
          path: GreyB-Explorer-release/
          retention-days: 30
