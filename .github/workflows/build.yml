name: Build GreyB Explorer

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK path
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: app/release.keystore
          key: greyb-explorer-keystore-v1

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/greyb/explorer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:label="GreyB Explorer"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="GreyB Explorer">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          ENDOFFILE

      - name: Generate file_paths.xml
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <root-path name="root" path="." />
              <external-path name="external" path="." />
              <files-path name="internal_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          ENDOFFILE

      - name: Generate styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#1E1E1E</item>
                  <item name="android:navigationBarColor">#1E1E1E</item>
                  <item name="android:statusBarColor">#1E1E1E</item>
              </style>
          </resources>
          ENDOFFILE

      - name: Generate MainActivity.kt
        run: |
          cat > app/src/main/java/com/greyb/explorer/MainActivity.kt << 'ENDOFFILE'
          package com.greyb.explorer

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaMetadataRetriever
          import android.media.ThumbnailUtils
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.storage.StorageManager
          import android.provider.Settings
          import android.webkit.MimeTypeMap
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.gestures.calculatePan
          import androidx.compose.foundation.gestures.calculateZoom
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.Folder
          import androidx.compose.material.icons.filled.InsertDriveFile
          import androidx.compose.material.icons.filled.PhoneAndroid
          import androidx.compose.material.icons.filled.SdCard
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.layout.layout
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import androidx.documentfile.provider.DocumentFile
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.lang.reflect.Method
          import java.security.MessageDigest

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      FileExplorerTheme {
                          FileExplorerApp()
                      }
                  }
              }
          }

          fun hasStoragePermission(context: Context): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  Environment.isExternalStorageManager()
              } else {
                  ContextCompat.checkSelfPermission(
                      context,
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  ) == PackageManager.PERMISSION_GRANTED
              }
          }

          // ---------- Natural sort ----------
          val naturalOrderComparator = Comparator<String> { a, b ->
              val ax = splitNatural(a.lowercase())
              val bx = splitNatural(b.lowercase())
              val n = minOf(ax.size, bx.size)
              for (i in 0 until n) {
                  val partA = ax[i]
                  val partB = bx[i]
                  val bothNumeric = partA.isNotEmpty() && partA[0].isDigit() && partB.isNotEmpty() && partB[0].isDigit()
                  val cmp = if (bothNumeric) {
                      val na = partA.trimStart('0').ifEmpty { "0" }
                      val nb = partB.trimStart('0').ifEmpty { "0" }
                      if (na.length != nb.length) na.length.compareTo(nb.length) else na.compareTo(nb)
                  } else {
                      partA.compareTo(partB)
                  }
                  if (cmp != 0) return@Comparator cmp
              }
              ax.size.compareTo(bx.size)
          }

          private fun splitNatural(s: String): List<String> {
              val parts = mutableListOf<String>()
              var i = 0
              while (i < s.length) {
                  val start = i
                  val isDigit = s[i].isDigit()
                  while (i < s.length && s[i].isDigit() == isDigit) i++
                  parts.add(s.substring(start, i))
              }
              return parts
          }

          // ---------- Thumbnail cache ----------
          object ThumbnailCache {
              private const val MAX_THUMBS = 500
              private const val THUMB_SIZE = 240

              private fun thumbDir(context: Context): File {
                  val dir = File(context.cacheDir, "thumbs")
                  if (!dir.exists()) dir.mkdirs()
                  return dir
              }

              private fun keyFor(pathAndStamp: String): String {
                  val digest = MessageDigest.getInstance("MD5").digest(pathAndStamp.toByteArray())
                  return digest.joinToString("") { "%02x".format(it) }
              }

              fun isImage(name: String): Boolean {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return ext in setOf("jpg", "jpeg", "png", "webp", "gif", "bmp", "heic", "heif")
              }

              fun isVideo(name: String): Boolean {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return ext in setOf("mp4", "mkv", "webm", "3gp", "mov", "avi", "m4v")
              }

              suspend fun getThumbnail(context: Context, file: File): Bitmap? = withContext(Dispatchers.IO) {
                  if (!file.isFile) return@withContext null
                  val name = file.name
                  if (!isImage(name) && !isVideo(name)) return@withContext null
                  loadOrGenerate(context, keyFor("${file.absolutePath}:${file.lastModified()}")) {
                      when {
                          isImage(name) -> decodeSampledImage(file.absolutePath, THUMB_SIZE)
                          isVideo(name) -> extractVideoFrame(file.absolutePath)
                          else -> null
                      }
                  }
              }

              suspend fun getFolderThumbnail(context: Context, dir: File): Bitmap? = withContext(Dispatchers.IO) {
                  val firstImage = try {
                      dir.listFiles()?.filter { it.isFile && isImage(it.name) }
                          ?.minByOrNull { it.name.lowercase() }
                  } catch (e: Exception) { null } ?: return@withContext null

                  loadOrGenerate(context, keyFor("folder:${dir.absolutePath}:${firstImage.name}:${firstImage.lastModified()}")) {
                      decodeSampledImage(firstImage.absolutePath, THUMB_SIZE)
                  }
              }

              private fun loadOrGenerate(context: Context, key: String, generate: () -> Bitmap?): Bitmap? {
                  val cacheFile = File(thumbDir(context), "$key.jpg")
                  if (cacheFile.exists()) {
                      try {
                          val cached = BitmapFactory.decodeFile(cacheFile.absolutePath)
                          if (cached != null) return cached
                      } catch (e: Exception) { }
                  }

                  val bitmap = try { generate() } catch (e: Exception) { null }

                  if (bitmap != null) {
                      try {
                          FileOutputStream(cacheFile).use { out ->
                              bitmap.compress(Bitmap.CompressFormat.JPEG, 85, out)
                          }
                          evictIfNeeded(context)
                      } catch (e: Exception) { }
                  }
                  return bitmap
              }

              private fun decodeSampledImage(path: String, targetSize: Int): Bitmap? {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, options)
                  if (options.outWidth <= 0 || options.outHeight <= 0) return null
                  var sample = 1
                  while (options.outWidth / (sample * 2) >= targetSize && options.outHeight / (sample * 2) >= targetSize) {
                      sample *= 2
                  }
                  val opts2 = BitmapFactory.Options().apply { inSampleSize = sample }
                  return BitmapFactory.decodeFile(path, opts2)
              }

              private fun extractVideoFrame(path: String): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  try {
                      retriever.setDataSource(path)
                      val frame = retriever.getFrameAtTime(-1, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                          ?: retriever.frameAtTime
                      if (frame != null) return frame
                  } catch (e: Exception) {
                  } finally {
                      try { retriever.release() } catch (e: Exception) { }
                  }
                  return try {
                      @Suppress("DEPRECATION")
                      ThumbnailUtils.createVideoThumbnail(path, android.provider.MediaStore.Video.Thumbnails.MINI_KIND)
                  } catch (e: Exception) { null }
              }

              private fun evictIfNeeded(context: Context) {
                  val dir = thumbDir(context)
                  val files = dir.listFiles() ?: return
                  if (files.size <= MAX_THUMBS) return
                  files.sortBy { it.lastModified() }
                  val toDelete = files.size - MAX_THUMBS
                  for (i in 0 until toDelete) {
                      try { files[i].delete() } catch (e: Exception) { }
                  }
              }
          }

          // ---------- Full-resolution image cache for the viewer ----------
          object FullImageCache {
              suspend fun decodeForViewer(path: String, maxDimension: Int): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(path, options)
                      if (options.outWidth <= 0 || options.outHeight <= 0) return@withContext null
                      var sample = 1
                      while (options.outWidth / (sample * 2) >= maxDimension && options.outHeight / (sample * 2) >= maxDimension) {
                          sample *= 2
                      }
                      val opts2 = BitmapFactory.Options().apply {
                          inSampleSize = sample
                          inPreferredConfig = Bitmap.Config.ARGB_8888
                      }
                      BitmapFactory.decodeFile(path, opts2)
                  } catch (e: Exception) { null }
              }
          }

          // Reflection-based path extraction for StorageVolume — works across API levels
          // including older ones where getDirectory()/getPath() aren't public API.
          private fun storageVolumePath(volume: Any): File? {
              try {
                  val getDirectory: Method = volume.javaClass.getMethod("getDirectory")
                  val dir = getDirectory.invoke(volume) as? File
                  if (dir != null) return dir
              } catch (e: Exception) { }

              for (methodName in listOf("getPathFile", "getPath")) {
                  try {
                      val m: Method = volume.javaClass.getMethod(methodName)
                      val result = m.invoke(volume)
                      when (result) {
                          is File -> return result
                          is String -> return File(result)
                      }
                  } catch (e: Exception) { }
              }
              return null
          }

          fun getStorageRoots(context: Context): List<Pair<String, File>> {
              val roots = mutableListOf<Pair<String, File>>()

              try {
                  val storageManager = context.getSystemService(Context.STORAGE_SERVICE) as StorageManager
                  val volumes = storageManager.storageVolumes

                  for (volume in volumes) {
                      try {
                          val isRemovable = volume.isRemovable
                          val state = volume.state
                          if (state != Environment.MEDIA_MOUNTED && state != Environment.MEDIA_MOUNTED_READ_ONLY) continue

                          val dir = storageVolumePath(volume) ?: continue
                          if (!dir.exists() || !dir.canRead()) continue

                          val label = when {
                              !isRemovable -> "Internal Storage"
                              else -> volume.getDescription(context) ?: "SD Card"
                          }
                          roots.add(label to dir)
                      } catch (e: Exception) { }
                  }
              } catch (e: Exception) { }

              if (roots.isEmpty()) {
                  Environment.getExternalStorageDirectory()?.let {
                      if (it.exists() && it.canRead()) {
                          roots.add("Internal Storage" to it)
                      }
                  }
                  try {
                      val storageDir = File("/storage")
                      if (storageDir.exists() && storageDir.canRead()) {
                          storageDir.listFiles()?.forEach { f ->
                              if (f.isDirectory && f.name != "emulated" && f.name != "self" && f.canRead()
                                  && f.name.matches(Regex("[0-9A-F]{4}-[0-9A-F]{4}"))) {
                                  roots.add("SD Card" to f)
                              }
                          }
                      }
                  } catch (e: Exception) { }
              }

              return roots.distinctBy { it.second.absolutePath }
          }

          @Composable
          fun FileExplorerApp() {
              val context = LocalContext.current
              var navigationStack by remember { mutableStateOf<List<File>>(emptyList()) }
              val currentDir = navigationStack.lastOrNull()
              var hasPermission by remember { mutableStateOf(hasStoragePermission(context)) }
              var refreshTrigger by remember { mutableStateOf(0) }

              var safRoot by remember { mutableStateOf<DocumentFile?>(null) }
              var safStack by remember { mutableStateOf<List<DocumentFile>>(emptyList()) }

              var viewerImages by remember { mutableStateOf<List<File>?>(null) }
              var viewerStartIndex by remember { mutableStateOf(0) }

              val prefs = context.getSharedPreferences("saf_prefs", Context.MODE_PRIVATE)

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  hasPermission = hasStoragePermission(context)
              }

              val safLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      try {
                          val doc = DocumentFile.fromTreeUri(context, uri)
                          if (doc != null && doc.canRead()) {
                              context.contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              )
                              prefs.edit().putString("saf_uri", uri.toString()).apply()
                              safRoot = doc
                              safStack = listOf(doc)
                          }
                      } catch (e: Exception) {
                          Toast.makeText(context, "Cannot access selected folder", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  val savedUriString = prefs.getString("saf_uri", null)
                  if (savedUriString != null) {
                      try {
                          val uri = Uri.parse(savedUriString)
                          val doc = DocumentFile.fromTreeUri(context, uri)
                          if (doc != null && doc.canRead()) {
                              safRoot = doc
                              safStack = listOf(doc)
                          } else {
                              prefs.edit().remove("saf_uri").apply()
                          }
                      } catch (e: Exception) {
                          prefs.edit().remove("saf_uri").apply()
                      }
                  }
                  if (!hasPermission) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                          intent.data = Uri.parse("package:${context.packageName}")
                          context.startActivity(intent)
                      } else {
                          permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }
              }

              val lifecycleOwner = LocalLifecycleOwner.current
              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_RESUME) {
                          hasPermission = hasStoragePermission(context)
                          refreshTrigger++
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              BackHandler(enabled = viewerImages != null || navigationStack.isNotEmpty() || safStack.size > 1) {
                  if (viewerImages != null) {
                      viewerImages = null
                  } else if (safStack.size > 1) {
                      safStack = safStack.dropLast(1)
                  } else if (navigationStack.isNotEmpty()) {
                      navigationStack = navigationStack.dropLast(1)
                  }
              }

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color(0xFF1E1E1E)
              ) {
                  if (viewerImages != null) {
                      ImageViewerScreen(
                          images = viewerImages!!,
                          startIndex = viewerStartIndex,
                          onClose = { viewerImages = null }
                      )
                  } else if (safRoot != null) {
                      SafBrowserScreen(
                          currentDoc = safStack.last(),
                          onNavigate = { doc -> safStack = safStack + doc },
                          onBack = { safStack = safStack.dropLast(1) },
                          onExit = {
                              safRoot = null
                              safStack = emptyList()
                              prefs.edit().remove("saf_uri").apply()
                          }
                      )
                  } else if (!hasPermission) {
                      PermissionScreen(
                          onGrant = {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                  val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                  intent.data = Uri.parse("package:${context.packageName}")
                                  context.startActivity(intent)
                              } else {
                                  permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                              }
                          },
                          onUseSaf = { safLauncher.launch(null) }
                      )
                  } else {
                      if (currentDir == null) {
                          StorageRootsScreen(
                              refreshKey = refreshTrigger,
                              onRootClick = { root -> navigationStack = listOf(root) }
                          )
                      } else {
                          FileListScreen(
                              directory = currentDir!!,
                              onNavigate = { dir -> navigationStack = navigationStack + dir },
                              onBack = { navigationStack = navigationStack.dropLast(1) },
                              onOpenImage = { images, index ->
                                  viewerImages = images
                                  viewerStartIndex = index
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun PermissionScreen(onGrant: () -> Unit, onUseSaf: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxSize(),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("Storage permission required", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(8.dp))
                  Text("Grant access to browse files", color = Color.White.copy(alpha = 0.7f), fontSize = 16.sp)
                  Spacer(Modifier.height(24.dp))
                  Button(onClick = onGrant, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1565C0))) {
                      Text("Grant Access", color = Color.White, fontSize = 16.sp)
                  }
                  Spacer(Modifier.height(12.dp))
                  TextButton(onClick = onUseSaf) {
                      Text("Use SAF instead", color = Color(0xFF4FC3F7), fontSize = 14.sp)
                  }
              }
          }

          @Composable
          fun ScreenHeader(title: String, onBack: (() -> Unit)? = null, trailing: (@Composable () -> Unit)? = null) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF2A2A2A))
                      .padding(horizontal = 16.dp, vertical = 16.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (onBack != null) {
                      Icon(
                          imageVector = Icons.Filled.ArrowBack,
                          contentDescription = "Back",
                          tint = Color.White,
                          modifier = Modifier.size(24.dp).clickable { onBack() }
                      )
                      Spacer(Modifier.width(14.dp))
                  }
                  Text(
                      text = title,
                      color = Color.White,
                      fontSize = 17.sp,
                      maxLines = 1,
                      modifier = Modifier.weight(1f)
                  )
                  trailing?.invoke()
              }
          }

          @Composable
          fun StorageRootsScreen(
              refreshKey: Int,
              onRootClick: (File) -> Unit
          ) {
              val context = LocalContext.current
              val roots = remember(refreshKey) { getStorageRoots(context) }

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader(title = "Storage")

                  if (roots.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("No storage found", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(16.dp)
                      ) {
                          items(roots) { (label, root) ->
                              Row(
                                  modifier = Modifier.fillMaxWidth().clickable { onRootClick(root) }.padding(vertical = 12.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(
                                      imageVector = if (label == "Internal Storage") Icons.Filled.PhoneAndroid else Icons.Filled.SdCard,
                                      contentDescription = label,
                                      tint = Color(0xFF90CAF9),
                                      modifier = Modifier.size(56.dp)
                                  )
                                  Spacer(Modifier.width(16.dp))
                                  Text(text = label, color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Medium)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FileListScreen(
              directory: File,
              onNavigate: (File) -> Unit,
              onBack: () -> Unit,
              onOpenImage: (images: List<File>, index: Int) -> Unit
          ) {
              val context = LocalContext.current
              val files = remember(directory) {
                  directory.listFiles()
                      ?.sortedWith(compareBy<File> { it.isFile }.thenBy(naturalOrderComparator) { it.name })
                      ?: emptyList()
              }
              val imagesInDir = remember(files) { files.filter { it.isFile && ThumbnailCache.isImage(it.name) } }

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader(title = directory.path, onBack = onBack)

                  if (files.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Empty folder", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(8.dp)
                      ) {
                          items(files) { file ->
                              FileRow(file = file, onClick = {
                                  when {
                                      file.isDirectory -> onNavigate(file)
                                      ThumbnailCache.isImage(file.name) -> {
                                          val idx = imagesInDir.indexOf(file).coerceAtLeast(0)
                                          onOpenImage(imagesInDir, idx)
                                      }
                                      else -> openFile(context, file)
                                  }
                              })
                          }
                      }
                  }
              }
          }

          @Composable
          fun SafBrowserScreen(
              currentDoc: DocumentFile,
              onNavigate: (DocumentFile) -> Unit,
              onBack: () -> Unit,
              onExit: () -> Unit
          ) {
              val context = LocalContext.current
              val children = remember(currentDoc) {
                  currentDoc.listFiles()
                      .sortedWith(compareBy<DocumentFile> { it.isDirectory }.thenBy(naturalOrderComparator) { it.name ?: "" })
              }

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader(
                      title = currentDoc.name ?: "Selected Folder",
                      onBack = onBack,
                      trailing = {
                          Icon(
                              imageVector = Icons.Filled.Close,
                              contentDescription = "Exit",
                              tint = Color.White,
                              modifier = Modifier.size(22.dp).clickable { onExit() }
                          )
                      }
                  )

                  if (children.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Empty folder", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(8.dp)
                      ) {
                          items(children) { doc ->
                              Row(
                                  modifier = Modifier.fillMaxWidth().clickable {
                                      if (doc.isDirectory) {
                                          onNavigate(doc)
                                      } else {
                                          openFile(context, doc.uri)
                                      }
                                  }.padding(horizontal = 16.dp, vertical = 12.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  FileThumbBox(isDirectory = doc.isDirectory, thumb = null)
                                  Spacer(Modifier.width(16.dp))
                                  Text(doc.name ?: "Unknown", color = Color.White, fontSize = 18.sp, maxLines = 1)
                              }
                          }
                      }
                  }
              }
          }

          // Folder tiles always show a dim bottom bar with "Folder" text —
          // whether the tile is the grey+icon fallback or a real photo thumbnail.
          @Composable
          fun FileThumbBox(isDirectory: Boolean, thumb: Bitmap?) {
              Box(
                  modifier = Modifier
                      .size(56.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(
                          if (isDirectory && thumb == null) Color(0xFF3A3A3A) else Color.Transparent
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  if (thumb != null) {
                      Image(
                          bitmap = thumb.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else if (isDirectory) {
                      Icon(
                          imageVector = Icons.Filled.Folder,
                          contentDescription = null,
                          tint = Color(0xFF9A9A9A),
                          modifier = Modifier.size(30.dp)
                      )
                  } else {
                      Icon(
                          imageVector = Icons.Filled.InsertDriveFile,
                          contentDescription = null,
                          tint = Color(0xFFB0BEC5),
                          modifier = Modifier.size(34.dp)
                      )
                  }

                  if (isDirectory) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .fillMaxWidth()
                              .height(16.dp)
                              .background(Color(0x8C000000)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = "Folder",
                              color = Color.White,
                              fontSize = 8.sp,
                              fontWeight = FontWeight.Medium
                          )
                      }
                  }
              }
          }

          @Composable
          fun FileRow(file: File, onClick: () -> Unit) {
              val context = LocalContext.current
              val hasFileThumb = file.isFile && (ThumbnailCache.isImage(file.name) || ThumbnailCache.isVideo(file.name))

              val thumb by produceState<Bitmap?>(initialValue = null, key1 = file.absolutePath, key2 = file.lastModified()) {
                  value = when {
                      hasFileThumb -> ThumbnailCache.getThumbnail(context, file)
                      file.isDirectory -> ThumbnailCache.getFolderThumbnail(context, file)
                      else -> null
                  }
              }

              Row(
                  modifier = Modifier.fillMaxWidth().clickable { onClick() }.padding(horizontal = 16.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  FileThumbBox(isDirectory = file.isDirectory, thumb = thumb)
                  Spacer(Modifier.width(16.dp))
                  Text(file.name, color = Color.White, fontSize = 18.sp, maxLines = 1)
              }
          }

          // ---------- Image viewer ----------
          @Composable
          fun ImageViewerScreen(images: List<File>, startIndex: Int, onClose: () -> Unit) {
              val pagerState = rememberPagerState(initialPage = startIndex) { images.size }
              var controlsVisible by remember { mutableStateOf(true) }
              var currentPageZoomed by remember { mutableStateOf(false) }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  HorizontalPager(
                      state = pagerState,
                      modifier = Modifier.fillMaxSize(),
                      userScrollEnabled = !currentPageZoomed
                  ) { page ->
                      ZoomableImagePage(
                          file = images[page],
                          onTap = { controlsVisible = !controlsVisible },
                          onZoomStateChanged = { zoomed ->
                              if (page == pagerState.currentPage) currentPageZoomed = zoomed
                          }
                      )
                  }

                  AnimatedVisibility(
                      visible = controlsVisible,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.align(Alignment.TopStart)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xAA000000))
                              .padding(horizontal = 16.dp, vertical = 16.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              imageVector = Icons.Filled.Close,
                              contentDescription = "Close",
                              tint = Color.White,
                              modifier = Modifier.size(24.dp).clickable { onClose() }
                          )
                          Spacer(Modifier.width(14.dp))
                          Text(
                              text = images.getOrNull(pagerState.currentPage)?.name ?: "",
                              color = Color.White,
                              fontSize = 15.sp,
                              maxLines = 1,
                              modifier = Modifier.weight(1f)
                          )
                          Text(
                              text = "${pagerState.currentPage + 1}/${images.size}",
                              color = Color.White.copy(alpha = 0.7f),
                              fontSize = 13.sp
                          )
                      }
                  }
              }

              BackHandler { onClose() }
          }

          @Composable
          fun ZoomableImagePage(
              file: File,
              onTap: () -> Unit,
              onZoomStateChanged: (Boolean) -> Unit
          ) {
              val density = LocalDensity.current
              var containerSize by remember { mutableStateOf(Offset.Zero) }

              val targetDimension = with(density) { (2200.dp.toPx()).toInt() }
              var bitmap by remember(file.absolutePath) { mutableStateOf<Bitmap?>(null) }
              LaunchedEffect(file.absolutePath) {
                  bitmap = FullImageCache.decodeForViewer(file.absolutePath, targetDimension)
              }

              var scale by remember(file.absolutePath) { mutableStateOf(1f) }
              var offsetX by remember(file.absolutePath) { mutableStateOf(0f) }
              var offsetY by remember(file.absolutePath) { mutableStateOf(0f) }

              val minScale = 1f
              val maxScale = 6f

              LaunchedEffect(scale) {
                  onZoomStateChanged(scale > minScale + 0.01f)
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .onSizeChangedCompat { w, h -> containerSize = Offset(w.toFloat(), h.toFloat()) }
                      .pointerInput(file.absolutePath) {
                          detectTapGestures(
                              onTap = { onTap() },
                              onDoubleTap = { tapPos ->
                                  if (scale > minScale + 0.05f) {
                                      scale = minScale
                                      offsetX = 0f
                                      offsetY = 0f
                                  } else {
                                      val newScale = 3f
                                      val cx = containerSize.x / 2f
                                      val cy = containerSize.y / 2f
                                      offsetX = (cx - tapPos.x)
                                      offsetY = (cy - tapPos.y)
                                      scale = newScale
                                  }
                              }
                          )
                      }
                      .pointerInput(file.absolutePath) {
                          // REPLACED WITH THE FIX FROM CLAUDE
                          awaitEachGesture {
                              awaitFirstDown(requireUnconsumed = false)
                              do {
                                  val event = awaitPointerEvent()
                                  val zoomChange = event.calculateZoom()
                                  val panChange = event.calculatePan()

                                  // Only claim the gesture once there's real pinch intent (2+ pointers)
                                  // or we're already zoomed in. At scale == 1f with a single finger,
                                  // do nothing here so the drag passes through to the HorizontalPager
                                  // for swipe-to-next/prev.
                                  val isMultiTouch = event.changes.size > 1
                                  if (isMultiTouch || scale > minScale + 0.01f) {
                                      val newScale = (scale * zoomChange).coerceIn(minScale, maxScale)
                                      if (newScale > minScale) {
                                          offsetX += panChange.x / newScale
                                          offsetY += panChange.y / newScale
                                          val maxOffsetX = (containerSize.x * (newScale - 1f)) / (2f * newScale)
                                          val maxOffsetY = (containerSize.y * (newScale - 1f)) / (2f * newScale)
                                          offsetX = offsetX.coerceIn(-maxOffsetX, maxOffsetX)
                                          offsetY = offsetY.coerceIn(-maxOffsetY, maxOffsetY)
                                      } else {
                                          offsetX = 0f
                                          offsetY = 0f
                                      }
                                      scale = newScale
                                      event.changes.forEach { it.consume() }
                                  }
                              } while (event.changes.any { it.pressed })
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  val bmp = bitmap
                  if (bmp != null) {
                      Image(
                          bitmap = bmp.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer(
                                  scaleX = scale,
                                  scaleY = scale,
                                  translationX = offsetX * scale,
                                  translationY = offsetY * scale
                              )
                      )
                  } else {
                      CircularProgressIndicator(color = Color.White.copy(alpha = 0.6f))
                  }
              }
          }

          fun Modifier.onSizeChangedCompat(onSize: (Int, Int) -> Unit): Modifier =
              this.then(
                  Modifier.layout { measurable, constraints ->
                      val placeable = measurable.measure(constraints)
                      onSize(placeable.width, placeable.height)
                      layout(placeable.width, placeable.height) {
                          placeable.place(0, 0)
                      }
                  }
              )

          fun openFile(context: Context, file: File) {
              val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
              val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(file.extension.lowercase()) ?: "*/*"
              openUri(context, uri, mime)
          }

          fun openFile(context: Context, uri: Uri) {
              val mime = context.contentResolver.getType(uri) ?: "*/*"
              openUri(context, uri, mime)
          }

          private fun openUri(context: Context, uri: Uri, mime: String) {
              val intent = Intent(Intent.ACTION_VIEW).apply {
                  setDataAndType(uri, mime)
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              try {
                  context.startActivity(Intent.createChooser(intent, "Open with"))
              } catch (e: Exception) {
                  Toast.makeText(context, "No app to open this file", Toast.LENGTH_SHORT).show()
              }
          }

          @Composable
          fun FileExplorerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF1E1E1E),
                      surface = Color(0xFF2A2A2A),
                      primary = Color.White,
                      onBackground = Color.White,
                      onSurface = Color.White
                  ),
                  content = content
              )
          }
          ENDOFFILE

