name: Build GreyB Explorer

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK path
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: app/release.keystore
          key: greyb-explorer-keystore-v1

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/greyb/explorer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:label="GreyB Explorer"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="GreyB Explorer">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          ENDOFFILE

      - name: Generate file_paths.xml
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <root-path name="root" path="." />
              <external-path name="external" path="." />
              <files-path name="internal_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          ENDOFFILE

      - name: Generate styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#1E1E1E</item>
                  <item name="android:navigationBarColor">#1E1E1E</item>
                  <item name="android:statusBarColor">#1E1E1E</item>
              </style>
          </resources>
          ENDOFFILE

      - name: Generate MainActivity.kt
        run: |
          cat > app/src/main/java/com/greyb/explorer/MainActivity.kt << 'ENDOFFILE'
          package com.greyb.explorer

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.ImageDecoder
          import android.graphics.drawable.AnimatedImageDrawable
          import android.media.MediaMetadataRetriever
          import android.media.ThumbnailUtils
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.storage.StorageManager
          import android.provider.Settings
          import android.webkit.MimeTypeMap
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.core.Animatable
          import androidx.compose.animation.core.animateDecay
          import androidx.compose.animation.core.tween
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.rememberSplineBasedDecay
          import androidx.compose.animation.slideInHorizontally
          import androidx.compose.animation.slideOutHorizontally
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.gestures.calculatePan
          import androidx.compose.foundation.gestures.calculateZoom
          import androidx.compose.foundation.gestures.detectDragGesturesAfterLongPress
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.interaction.collectIsPressedAsState
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Bookmark
          import androidx.compose.material.icons.filled.BookmarkBorder
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.DragHandle
          import androidx.compose.material.icons.filled.Folder
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.InsertDriveFile
          import androidx.compose.material.icons.filled.List
          import androidx.compose.material.icons.filled.MoreVert
          import androidx.compose.material.icons.filled.PhoneAndroid
          import androidx.compose.material.icons.filled.SdCard
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.input.pointer.util.VelocityTracker
          import androidx.compose.ui.input.pointer.util.addPointerInputChange
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.layout.layout
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.compose.ui.window.Popup
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import androidx.documentfile.provider.DocumentFile
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          import java.io.File
          import java.io.FileOutputStream
          import java.lang.reflect.Method
          import java.security.MessageDigest

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      FileExplorerTheme {
                          FileExplorerApp()
                      }
                  }
              }
          }

          fun hasStoragePermission(context: Context): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  Environment.isExternalStorageManager()
              } else {
                  ContextCompat.checkSelfPermission(
                      context,
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  ) == PackageManager.PERMISSION_GRANTED
              }
          }

          // ---------- Natural sort ----------
          val naturalOrderComparator = Comparator<String> { a, b ->
              val ax = splitNatural(a.lowercase())
              val bx = splitNatural(b.lowercase())
              val n = minOf(ax.size, bx.size)
              for (i in 0 until n) {
                  val partA = ax[i]
                  val partB = bx[i]
                  val bothNumeric = partA.isNotEmpty() && partA[0].isDigit() && partB.isNotEmpty() && partB[0].isDigit()
                  val cmp = if (bothNumeric) {
                      val na = partA.trimStart('0').ifEmpty { "0" }
                      val nb = partB.trimStart('0').ifEmpty { "0" }
                      if (na.length != nb.length) na.length.compareTo(nb.length) else na.compareTo(nb)
                  } else {
                      partA.compareTo(partB)
                  }
                  if (cmp != 0) return@Comparator cmp
              }
              ax.size.compareTo(bx.size)
          }

          private fun splitNatural(s: String): List<String> {
              val parts = mutableListOf<String>()
              var i = 0
              while (i < s.length) {
                  val start = i
                  val isDigit = s[i].isDigit()
                  while (i < s.length && s[i].isDigit() == isDigit) i++
                  parts.add(s.substring(start, i))
              }
              return parts
          }

          // ---------- Bookmarks ----------
          object Bookmarks {
              private const val PREFS = "bookmarks_prefs"
              private const val KEY = "bookmark_paths"

              fun getAll(context: Context): List<String> {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "") ?: ""
                  return if (raw.isBlank()) emptyList() else raw.split("|").filter { it.isNotBlank() }
              }

              fun isBookmarked(context: Context, path: String): Boolean = getAll(context).contains(path)

              fun add(context: Context, path: String) {
                  val current = getAll(context).toMutableList()
                  if (!current.contains(path)) {
                      current.add(path)
                      save(context, current)
                  }
              }

              fun remove(context: Context, path: String) {
                  val current = getAll(context).toMutableList()
                  current.remove(path)
                  save(context, current)
              }

              fun reorder(context: Context, newOrder: List<String>) {
                  save(context, newOrder)
              }

              private fun save(context: Context, list: List<String>) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY, list.joinToString("|")).apply()
              }
          }

          // ---------- Thumbnail cache ----------
          object ThumbnailCache {
              private const val MAX_THUMBS = 500
              private const val THUMB_SIZE = 240

              private fun thumbDir(context: Context): File {
                  val dir = File(context.cacheDir, "thumbs")
                  if (!dir.exists()) dir.mkdirs()
                  return dir
              }

              private fun keyFor(pathAndStamp: String): String {
                  val digest = MessageDigest.getInstance("MD5").digest(pathAndStamp.toByteArray())
                  return digest.joinToString("") { "%02x".format(it) }
              }

              fun isImage(name: String): Boolean {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return ext in setOf("jpg", "jpeg", "png", "webp", "gif", "bmp", "heic", "heif")
              }

              fun isGif(name: String): Boolean = name.substringAfterLast('.', "").lowercase() == "gif"

              fun isVideo(name: String): Boolean {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return ext in setOf("mp4", "mkv", "webm", "3gp", "mov", "avi", "m4v")
              }

              suspend fun getThumbnail(context: Context, file: File): Bitmap? = withContext(Dispatchers.IO) {
                  if (!file.isFile) return@withContext null
                  val name = file.name
                  if (!isImage(name) && !isVideo(name)) return@withContext null
                  loadOrGenerate(context, keyFor("${file.absolutePath}:${file.lastModified()}")) {
                      when {
                          isImage(name) -> decodeSampledImage(file.absolutePath, THUMB_SIZE)
                          isVideo(name) -> extractVideoFrame(file.absolutePath)
                          else -> null
                      }
                  }
              }

              suspend fun getFolderThumbnail(context: Context, dir: File): Bitmap? = withContext(Dispatchers.IO) {
                  val firstImage = try {
                      dir.listFiles()?.filter { it.isFile && isImage(it.name) }
                          ?.minByOrNull { it.name.lowercase() }
                  } catch (e: Exception) { null } ?: return@withContext null

                  loadOrGenerate(context, keyFor("folder:${dir.absolutePath}:${firstImage.name}:${firstImage.lastModified()}")) {
                      decodeSampledImage(firstImage.absolutePath, THUMB_SIZE)
                  }
              }

              private fun loadOrGenerate(context: Context, key: String, generate: () -> Bitmap?): Bitmap? {
                  val cacheFile = File(thumbDir(context), "$key.jpg")
                  if (cacheFile.exists()) {
                      try {
                          val cached = BitmapFactory.decodeFile(cacheFile.absolutePath)
                          if (cached != null) return cached
                      } catch (e: Exception) { }
                  }

                  val bitmap = try { generate() } catch (e: Exception) { null }

                  if (bitmap != null) {
                      try {
                          FileOutputStream(cacheFile).use { out ->
                              bitmap.compress(Bitmap.CompressFormat.JPEG, 85, out)
                          }
                          evictIfNeeded(context)
                      } catch (e: Exception) { }
                  }
                  return bitmap
              }

              private fun decodeSampledImage(path: String, targetSize: Int): Bitmap? {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, options)
                  if (options.outWidth <= 0 || options.outHeight <= 0) return null
                  var sample = 1
                  while (options.outWidth / (sample * 2) >= targetSize && options.outHeight / (sample * 2) >= targetSize) {
                      sample *= 2
                  }
                  val opts2 = BitmapFactory.Options().apply { inSampleSize = sample }
                  return BitmapFactory.decodeFile(path, opts2)
              }

              private fun extractVideoFrame(path: String): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  try {
                      retriever.setDataSource(path)
                      val frame = retriever.getFrameAtTime(-1, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                          ?: retriever.frameAtTime
                      if (frame != null) return frame
                  } catch (e: Exception) {
                  } finally {
                      try { retriever.release() } catch (e: Exception) { }
                  }
                  return try {
                      @Suppress("DEPRECATION")
                      ThumbnailUtils.createVideoThumbnail(path, android.provider.MediaStore.Video.Thumbnails.MINI_KIND)
                  } catch (e: Exception) { null }
              }

              private fun evictIfNeeded(context: Context) {
                  val dir = thumbDir(context)
                  val files = dir.listFiles() ?: return
                  if (files.size <= MAX_THUMBS) return
                  files.sortBy { it.lastModified() }
                  val toDelete = files.size - MAX_THUMBS
                  for (i in 0 until toDelete) {
                      try { files[i].delete() } catch (e: Exception) { }
                  }
              }
          }

          // ---------- Full-resolution image cache for the viewer ----------
          object FullImageCache {
              suspend fun decodeForViewer(path: String, maxDimension: Int): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeFile(path, options)
                      if (options.outWidth <= 0 || options.outHeight <= 0) return@withContext null
                      var sample = 1
                      while (options.outWidth / (sample * 2) >= maxDimension && options.outHeight / (sample * 2) >= maxDimension) {
                          sample *= 2
                      }
                      val opts2 = BitmapFactory.Options().apply {
                          inSampleSize = sample
                          inPreferredConfig = Bitmap.Config.ARGB_8888
                      }
                      BitmapFactory.decodeFile(path, opts2)
                  } catch (e: Exception) { null }
              }

              fun loadAnimatedDrawable(context: Context, path: String): Any? {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try {
                          val source = ImageDecoder.createSource(File(path))
                          ImageDecoder.decodeDrawable(source)
                      } catch (e: Exception) { null }
                  } else {
                      try { BitmapFactory.decodeFile(path) } catch (e: Exception) { null }
                  }
              }
          }

          // Reflection-based path extraction for StorageVolume
          private fun storageVolumePath(volume: Any): File? {
              try {
                  val getDirectory: Method = volume.javaClass.getMethod("getDirectory")
                  val dir = getDirectory.invoke(volume) as? File
                  if (dir != null) return dir
              } catch (e: Exception) { }

              for (methodName in listOf("getPathFile", "getPath")) {
                  try {
                      val m: Method = volume.javaClass.getMethod(methodName)
                      val result = m.invoke(volume)
                      when (result) {
                          is File -> return result
                          is String -> return File(result)
                      }
                  } catch (e: Exception) { }
              }
              return null
          }

          fun getStorageRoots(context: Context): List<Pair<String, File>> {
              val roots = mutableListOf<Pair<String, File>>()

              try {
                  val storageManager = context.getSystemService(Context.STORAGE_SERVICE) as StorageManager
                  val volumes = storageManager.storageVolumes

                  for (volume in volumes) {
                      try {
                          val isRemovable = volume.isRemovable
                          val state = volume.state
                          if (state != Environment.MEDIA_MOUNTED && state != Environment.MEDIA_MOUNTED_READ_ONLY) continue

                          val dir = storageVolumePath(volume) ?: continue
                          if (!dir.exists() || !dir.canRead()) continue

                          val label = when {
                              !isRemovable -> "Internal Storage"
                              else -> volume.getDescription(context) ?: "SD Card"
                          }
                          roots.add(label to dir)
                      } catch (e: Exception) { }
                  }
              } catch (e: Exception) { }

              if (roots.isEmpty()) {
                  Environment.getExternalStorageDirectory()?.let {
                      if (it.exists() && it.canRead()) {
                          roots.add("Internal Storage" to it)
                      }
                  }
                  try {
                      val storageDir = File("/storage")
                      if (storageDir.exists() && storageDir.canRead()) {
                          storageDir.listFiles()?.forEach { f ->
                              if (f.isDirectory && f.name != "emulated" && f.name != "self" && f.canRead()
                                  && f.name.matches(Regex("[0-9A-F]{4}-[0-9A-F]{4}"))) {
                                  roots.add("SD Card" to f)
                              }
                          }
                      }
                  } catch (e: Exception) { }
              }

              return roots.distinctBy { it.second.absolutePath }
          }

          @Composable
          fun FileExplorerApp() {
              val context = LocalContext.current
              var currentDir by remember { mutableStateOf<File?>(null) }
              var hasPermission by remember { mutableStateOf(hasStoragePermission(context)) }
              var refreshTrigger by remember { mutableStateOf(0) }

              var safRoot by remember { mutableStateOf<DocumentFile?>(null) }
              var safStack by remember { mutableStateOf<List<DocumentFile>>(emptyList()) }

              var viewerImages by remember { mutableStateOf<List<File>?>(null) }
              var viewerStartIndex by remember { mutableStateOf(0) }

              var panelOpen by remember { mutableStateOf(false) }
              var bookmarkListVersion by remember { mutableStateOf(0) }

              val prefs = context.getSharedPreferences("saf_prefs", Context.MODE_PRIVATE)

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  hasPermission = hasStoragePermission(context)
              }

              val safLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      try {
                          val doc = DocumentFile.fromTreeUri(context, uri)
                          if (doc != null && doc.canRead()) {
                              context.contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              )
                              prefs.edit().putString("saf_uri", uri.toString()).apply()
                              safRoot = doc
                              safStack = listOf(doc)
                          }
                      } catch (e: Exception) {
                          Toast.makeText(context, "Cannot access selected folder", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  val savedUriString = prefs.getString("saf_uri", null)
                  if (savedUriString != null) {
                      try {
                          val uri = Uri.parse(savedUriString)
                          val doc = DocumentFile.fromTreeUri(context, uri)
                          if (doc != null && doc.canRead()) {
                              safRoot = doc
                              safStack = listOf(doc)
                          } else {
                              prefs.edit().remove("saf_uri").apply()
                          }
                      } catch (e: Exception) {
                          prefs.edit().remove("saf_uri").apply()
                      }
                  }
                  if (!hasPermission) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                          intent.data = Uri.parse("package:${context.packageName}")
                          context.startActivity(intent)
                      } else {
                          permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }
              }

              val lifecycleOwner = LocalLifecycleOwner.current
              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_RESUME) {
                          hasPermission = hasStoragePermission(context)
                          refreshTrigger++
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              BackHandler(enabled = viewerImages != null || panelOpen || currentDir != null || safStack.size > 1) {
                  when {
                      viewerImages != null -> viewerImages = null
                      panelOpen -> panelOpen = false
                      safStack.size > 1 -> safStack = safStack.dropLast(1)
                      currentDir != null -> {
                          val parent = currentDir!!.parentFile
                          currentDir = if (parent != null && getStorageRoots(context).any { it.second.absolutePath == currentDir!!.absolutePath }) {
                              null
                          } else {
                              parent
                          }
                      }
                  }
              }

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color(0xFF1E1E1E)
              ) {
                  Box(modifier = Modifier.fillMaxSize()) {
                      if (viewerImages != null) {
                          ImageViewerScreen(
                              images = viewerImages!!,
                              startIndex = viewerStartIndex,
                              onClose = { viewerImages = null }
                          )
                      } else if (safRoot != null) {
                          SafBrowserScreen(
                              currentDoc = safStack.last(),
                              onNavigate = { doc -> safStack = safStack + doc },
                              onExit = {
                                  safRoot = null
                                  safStack = emptyList()
                                  prefs.edit().remove("saf_uri").apply()
                              },
                              onOpenPanel = { panelOpen = true }
                          )
                      } else if (!hasPermission) {
                          PermissionScreen(
                              onGrant = {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                      intent.data = Uri.parse("package:${context.packageName}")
                                      context.startActivity(intent)
                                  } else {
                                      permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                                  }
                              },
                              onUseSaf = { safLauncher.launch(null) }
                          )
                      } else {
                          val dir = currentDir
                          if (dir == null) {
                              HomeScreen(
                                  refreshKey = refreshTrigger,
                                  onRootClick = { root -> currentDir = root },
                                  onOpenPanel = { panelOpen = true }
                              )
                          } else {
                              FileListScreen(
                                  directory = dir,
                                  onNavigate = { d -> currentDir = d },
                                  onJumpTo = { target -> currentDir = target },
                                  onNavigateHome = { currentDir = null },
                                  onOpenImage = { images, index ->
                                      viewerImages = images
                                      viewerStartIndex = index
                                  },
                                  onOpenPanel = { panelOpen = true },
                                  bookmarkListVersion = bookmarkListVersion,
                                  onBookmarkChanged = { bookmarkListVersion++ }
                              )
                          }
                      }

                      BookmarksPanel(
                          visible = panelOpen,
                          listVersion = bookmarkListVersion,
                          onDismiss = { panelOpen = false },
                          onNavigateHome = {
                              currentDir = null
                              panelOpen = false
                          },
                          onNavigateTo = { path ->
                              currentDir = File(path)
                              panelOpen = false
                          },
                          onReorder = { newOrder ->
                              Bookmarks.reorder(context, newOrder)
                              bookmarkListVersion++
                          }
                      )
                  }
              }
          }

