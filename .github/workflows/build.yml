          }

          fun hasStoragePermission(context: Context): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  Environment.isExternalStorageManager()
              } else {
                  ContextCompat.checkSelfPermission(
                      context,
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  ) == PackageManager.PERMISSION_GRANTED
              }
          }

          // ---------- Natural sort helpers ----------
          val naturalOrderComparator = Comparator<String> { a, b ->
              val ax = splitNatural(a.lowercase())
              val bx = splitNatural(b.lowercase())
              val n = minOf(ax.size, bx.size)
              for (i in 0 until n) {
                  val partA = ax[i]
                  val partB = bx[i]
                  val bothNumeric = partA.isNotEmpty() && partA[0].isDigit() && partB.isNotEmpty() && partB[0].isDigit()
                  val cmp = if (bothNumeric) {
                      val na = partA.trimStart('0').ifEmpty { "0" }
                      val nb = partB.trimStart('0').ifEmpty { "0" }
                      if (na.length != nb.length) na.length.compareTo(nb.length) else na.compareTo(nb)
                  } else {
                      partA.compareTo(partB)
                  }
                  if (cmp != 0) return@Comparator cmp
              }
              ax.size.compareTo(bx.size)
          }

          private fun splitNatural(s: String): List<String> {
              val parts = mutableListOf<String>()
              var i = 0
              while (i < s.length) {
                  val start = i
                  val isDigit = s[i].isDigit()
                  while (i < s.length && s[i].isDigit() == isDigit) i++
                  parts.add(s.substring(start, i))
              }
              return parts
          }

          // ---------- Sorting ----------
          enum class SortMode(val label: String, val key: String) {
              NAME_AZ("Name (A-Z)", "name_az"),
              NAME_ZA("Name (Z-A)", "name_za"),
              NEWEST("Time (newest first)", "newest"),
              OLDEST("Time (oldest first)", "oldest");

              companion object {
                  fun fromKey(key: String?): SortMode = values().firstOrNull { it.key == key } ?: NEWEST
              }
          }

          // ---------- Last opened item ----------
          // The folder / file opened last gets a faint white highlight (only one, whole app).
          // It moves when another item is opened. Pressed / marked rows (solid white) win over it.
          object LastOpened {
              var path by mutableStateOf<String?>(null)
          }

          // ---------- Scroll memory ----------
          // Entering a folder always starts at the top. Going back UP to a folder, or coming back
          // after opening a FILE (image, zip, other app), returns to where that list was.
          object ScrollMemory {
              private val saved = HashMap<String, IntArray>()
              private val restore = HashSet<String>()

              @Synchronized
              fun save(path: String, index: Int, offset: Int) { saved[path] = intArrayOf(index, offset) }

              @Synchronized
              fun markRestore(path: String) { if (saved.containsKey(path)) restore.add(path) }

              @Synchronized
              fun clearRestore() { restore.clear() }

              private var lastDir: String? = null
              private var topNext = false

              // Next folder shown starts at the top whatever happens (breadcrumb taps)
              @Synchronized
              fun forceTop() { topNext = true; restore.clear() }

              // Returns the position to go back to, or null = start at the top.
              //  - going UP (back / breadcrumb) from a folder inside this one: old position
              //  - coming back after opening a file (image, zip, other app): old position
              //  - entering a folder: always the top
              @Synchronized
              fun take(path: String): IntArray? {
                  val prev = lastDir
                  lastDir = path
                  if (topNext) {
                      topNext = false
                      return null
                  }
                  val fromInside = prev != null && prev.startsWith("$path/")
                  val flagged = restore.remove(path)
                  return if (fromInside || flagged) saved[path] else null
              }
          }

          object SortPrefs {
              private const val PREFS = "sort_prefs"
              private const val KEY = "sort_mode"
              fun load(context: Context): SortMode =
                  SortMode.fromKey(context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, null))
              fun save(context: Context, mode: SortMode) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY, mode.key).apply()
              }
          }

          // ---------- Formatting helpers ----------
          fun formatSize(bytes: Long): String {
              val units = arrayOf("B", "KB", "MB", "GB", "TB")
              var value = bytes.toDouble()
              var idx = 0
              while (value >= 1024 && idx < units.size - 1) {
                  value /= 1024
                  idx++
              }
              return if (idx == 0) "$bytes B" else String.format(Locale.US, "%.1f %s", value, units[idx])
          }

          private val dateFormat = ThreadLocal.withInitial {
              SimpleDateFormat("d MMM yyyy, h:mm a", Locale.getDefault())
          }

          fun formatDate(millis: Long): String = dateFormat.get()!!.format(Date(millis))

          val textExtensions = setOf(
              "txt", "yml", "yaml", "java", "kt", "kts", "xml", "json", "md", "csv", "tsv",
              "gradle", "properties", "py", "js", "ts", "html", "css", "c", "cpp", "h", "hpp",
              "sh", "log", "ini", "cfg", "conf", "toml", "sql", "go", "rs", "swift", "dart",
              "php", "rb", "bat", "ps1", "lua", "srt", "vtt", "cmd", "jsx", "tsx", "vue", "scss", "less",
              "cs", "vb", "pl", "r", "scala", "groovy", "adoc", "rst", "tex", "cmake", "mk", "make",
              "gitignore", "editorconfig", "env", "plist", "ass", "ssa", "reg", "vcf", "ics", "url",
              "htm", "xhtml", "jsonl", "ndjson", "kml", "gpx", "lock", "lrc", "m3u", "m3u8", "nfo",
              "pro", "smali", "aidl", "mjs", "cjs", "svg", "rc", "list", "text", "readme", "license"
          )

          fun isTextName(name: String): Boolean = name.substringAfterLast('.', "").lowercase() in textExtensions

          // Text / code editor: which files open in it. Known text extensions, plus any unknown file whose
          // first bytes look like text (no NUL bytes, almost no control characters). Big files go to
          // other apps instead, because a phone text field gets slow past about 1 MB.
          object TextFiles {
              const val MAX_BYTES = 1_000_000L

              fun canEdit(file: File): Boolean {
                  if (file.length() > MAX_BYTES) return false
                  if (isTextName(file.name)) return true
                  return looksLikeText(file)
              }

              private fun looksLikeText(file: File): Boolean {
                  return try {
                      file.inputStream().use { input ->
                          val buf = ByteArray(4096)
                          val n = input.read(buf)
                          if (n <= 0) return true
                          var control = 0
                          for (i in 0 until n) {
                              val b = buf[i].toInt() and 0xFF
                              if (b == 0) return false
                              if (b < 32 && b != 9 && b != 10 && b != 12 && b != 13 && b != 27) control++
                          }
                          control * 100 < n * 2
                      }
                  } catch (e: Exception) { false }
              }
          }

          // ---------- Bookmarks (no limit on how many) ----------
          object Bookmarks {
              private const val PREFS = "bookmarks_prefs"
              private const val KEY = "bookmark_paths"

              fun getAll(context: Context): List<String> {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "") ?: ""
                  return if (raw.isBlank()) emptyList() else raw.split("|").filter { it.isNotBlank() }
              }

              fun isBookmarked(context: Context, path: String): Boolean = getAll(context).contains(path)

              fun add(context: Context, path: String) {
                  val current = getAll(context).toMutableList()
                  if (!current.contains(path)) {
                      current.add(path)
                      save(context, current)
                  }
              }

              fun remove(context: Context, path: String) {
                  val current = getAll(context).toMutableList()
                  current.remove(path)
                  save(context, current)
              }

              fun reorder(context: Context, newOrder: List<String>) {
                  save(context, newOrder)
              }

              private fun save(context: Context, list: List<String>) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY, list.joinToString("|")).apply()
              }
          }

          // ---------- Saved tabs ----------
          object SavedTabs {
              private const val PREFS = "tabs_prefs"
              private const val KEY = "saved_tabs"
              const val HOME_TOKEN = "__HOME__"

              fun load(context: Context): List<String> {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "") ?: ""
                  return if (raw.isBlank()) emptyList() else raw.split("|")
              }

              fun save(context: Context, tabs: List<String>) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY, tabs.joinToString("|")).apply()
              }
          }

          // ---------- Tab model ----------
          // A tab is either Home (dir == null) or a folder.
          class TabState(val id: Long, initialDir: File?) {
              private var currentDir by mutableStateOf<File?>(initialDir)

              // Deepest folder of the current path. It stays after you go back (or tap Home), so the
              // breadcrumbs can still show the trail ahead (muted). It is replaced as soon as you open
              // a folder that is NOT on that trail (another branch, or another storage like the SD card).
              var deepest by mutableStateOf<File?>(initialDir)
                  private set

              var dir: File?
                  get() = currentDir
                  set(value) {
                      currentDir = value
                      if (value != null) {
                          val deep = deepest
                          val keep = deep != null &&
                              (deep.absolutePath == value.absolutePath ||
                                  deep.absolutePath.startsWith(value.absolutePath.trimEnd('/') + "/"))
                          if (!keep) deepest = value
                      }
                  }
          }

          // ---------- Entries and listings (read once, reused) ----------
          // Every file's size, folder flag and date are read once here, not on each draw.
          class Entry(val file: File, val name: String, val isDir: Boolean, val size: Long, val modified: Long)

          // Wrapper so every reload is a new object and always triggers state updates
          class Listing(val entries: List<Entry>)

          fun readEntries(dir: File): List<Entry> {
              // Inside an opened archive the list comes from the archive's file list, not from the disk
              ArchiveSupport.virtualList(dir)?.let { return it }
              val arr = dir.listFiles() ?: return emptyList()
              return arr.map { f ->
                  val isDir = f.isDirectory
                  Entry(f, f.name, isDir, if (isDir) 0L else f.length(), f.lastModified())
              }
          }

          fun sortEntries(list: List<Entry>, mode: SortMode): List<Entry> {
              val cmp: Comparator<Entry> = when (mode) {
                  SortMode.NAME_AZ -> Comparator { a, b -> naturalOrderComparator.compare(a.name, b.name) }
                  SortMode.NAME_ZA -> Comparator { a, b -> naturalOrderComparator.compare(b.name, a.name) }
                  SortMode.NEWEST -> compareByDescending { it.modified }
                  SortMode.OLDEST -> compareBy { it.modified }
              }
              // Folders always first, then files, both sorted by the chosen mode
              return list.filter { it.isDir }.sortedWith(cmp) + list.filter { !it.isDir }.sortedWith(cmp)
          }

          // Memory cache of recent folder listings, so going back is instant
          object DirCache {
              private val map = LinkedHashMap<String, Listing>()

              @Synchronized
              fun get(path: String): Listing? = map[path]

              @Synchronized
              fun put(path: String, listing: Listing) {
                  map.remove(path)
                  map[path] = listing
                  while (map.size > 40) map.remove(map.keys.first())
              }

              // Forget everything (used after copy / move / rename / delete)
              @Synchronized
              fun clear() { map.clear() }
          }

          // Folder item counts, read in the background and remembered
          object FolderCount {
              private val map = HashMap<String, Int>()

              @Synchronized
              fun cached(path: String): Int? = map[path]

              @Synchronized
              fun clear() { map.clear() }

              fun load(dir: File): Int {
                  val n = ArchiveSupport.virtualCount(dir) ?: (dir.listFiles()?.size ?: 0)
                  synchronized(this) { map[dir.absolutePath] = n }
                  return n
              }
          }

          // ---------- Pulse ----------
          // While something is marked or waiting to be pasted, this flips every 500 ms.
          // ONLY the top-right menu button reads it (blinks white bg + black text, about once a second).
          // Marked rows are static white/black; pending menu rows show a white dot instead.
          val LocalPulse = compositionLocalOf<State<Boolean>?> { null }

          // =====================================================================
          // PROGRESS POPUP (reusable): NOTE FOR FUTURE - every long task (copy, move, delete, zip,
          // opening an archive, ...) must go through runOp(...) in FileExplorerApp. It shows
          // ProgressDialog with the title, the current item, a progress bar and a Cancel button.
          // The task gets an OpProgress and reports with op.detail / op.fraction (0..1, null = unknown),
          // and checks op.cancelled regularly.
          // =====================================================================
          class OpProgress(val title: String) {
              var detail by mutableStateOf("")
              var fraction by mutableStateOf<Float?>(null)
              val cancelled = AtomicBoolean(false)
          }

          class OpCancelled : RuntimeException()

          // ---------- Archives ----------
          // An archive opens like a folder: only its list of names is read (fast). A file is extracted into the
          // app cache only when you open or copy it. Supported: zip/cbz/jar, 7z, rar (RAR4), tar, tar.gz/tgz,
          // tar.bz2, tar.xz and single gz/bz2/xz files. Password protected zip, 7z and rar are supported.
          // Archive views are read only (no rename / delete / move / paste inside). The cache is cleared when
          // no tab is inside the archive any more, and at app start.
          class ArcEntry(val path: String, val isDir: Boolean, val size: Long, val modified: Long)

          class NeedPassword : Exception()

          class ArchiveSession(val key: String, val file: File, val kind: String, val password: String?, val entries: List<ArcEntry>) {
              // folder path ("" = top) -> the items directly inside it
              val children: Map<String, List<ArcEntry>> = buildChildren(entries)

              companion object {
                  fun parentOf(p: String): String = p.substringBeforeLast('/', "")

                  fun buildChildren(entries: List<ArcEntry>): Map<String, List<ArcEntry>> {
                      val dirs = LinkedHashMap<String, ArcEntry>()
                      val files = ArrayList<ArcEntry>()
                      fun addDir(path: String, mod: Long) {
                          if (path.isNotEmpty() && !dirs.containsKey(path)) {
                              dirs[path] = ArcEntry(path, true, 0L, mod)
                              addDir(parentOf(path), mod)
                          }
                      }
                      for (e in entries) {
                          if (e.isDir) addDir(e.path, e.modified) else {
                              files.add(e)
                              addDir(parentOf(e.path), e.modified)
                          }
                      }
                      val map = HashMap<String, MutableList<ArcEntry>>()
                      for (d in dirs.values) map.getOrPut(parentOf(d.path)) { ArrayList() }.add(d)
                      for (f in files) map.getOrPut(parentOf(f.path)) { ArrayList() }.add(f)
                      return map
                  }
              }
          }

          class ExtractResult(val dest: File?, val wrongPassword: Boolean, val message: String?)

          // Counts bytes while an archive library writes a file (used for rar) and lets Cancel stop it
          class ProgressOutputStream(
              private val out: OutputStream,
              private val op: OpProgress,
              private val counter: LongArray,
              private val total: Long
          ) : OutputStream() {
              override fun write(b: Int) { out.write(b); add(1) }
              override fun write(b: ByteArray, off: Int, len: Int) { out.write(b, off, len); add(len) }
              override fun close() { out.close() }
              private fun add(n: Int) {
                  if (op.cancelled.get()) throw OpCancelled()
                  counter[0] += n
                  op.fraction = (counter[0].toDouble() / total).toFloat().coerceIn(0f, 1f)
              }
          }

          object ArchiveSupport {
              private var rootDir: File? = null
              private val sessions = HashMap<String, ArchiveSession>()

              fun kindOf(name: String): String? {
                  val n = name.lowercase()
                  return when {
                      n.endsWith(".zip") || n.endsWith(".cbz") || n.endsWith(".jar") -> "zip"
                      n.endsWith(".7z") -> "7z"
                      n.endsWith(".rar") || n.endsWith(".cbr") -> "rar"
                      n.endsWith(".tar.gz") || n.endsWith(".tgz") -> "targz"
                      n.endsWith(".tar.bz2") || n.endsWith(".tbz2") || n.endsWith(".tbz") -> "tarbz2"
                      n.endsWith(".tar.xz") || n.endsWith(".txz") -> "tarxz"
                      n.endsWith(".tar") -> "tar"
                      n.endsWith(".gz") -> "gz"
                      n.endsWith(".bz2") -> "bz2"
                      n.endsWith(".xz") -> "xz"
                      else -> null
                  }
              }

              fun isArchiveName(name: String): Boolean = kindOf(name) != null

              fun root(context: Context): File {
                  val r = File(context.cacheDir, "archives")
                  rootDir = r
                  return r
              }

              fun isInside(context: Context, f: File): Boolean {
                  root(context)
                  return isVirtualPath(f.absolutePath)
              }

              fun isVirtualPath(path: String): Boolean {
                  val r = rootDir ?: return false
                  return path.startsWith(r.absolutePath + "/")
              }

              // For the top folder of an opened archive: the real folder the archive file is in (else null)
              fun originFolder(context: Context, d: File): File? {
                  val r = root(context)
                  val p = d.parentFile ?: return null
                  if (p.parentFile?.absolutePath != r.absolutePath) return null
                  val s = File(r, p.name + ".src")
                  if (!s.exists()) return null
                  val path = s.readText()
                  return if (path.isEmpty()) null else File(path)
              }

              // Archives that were just opened but no tab shows yet: cleanup must not touch them
              private val pinned = HashSet<String>()

              // The folder "up" from a folder inside an opened archive. At the top of the archive that is the
              // real folder holding the archive file (never the hidden cache folder). null = Home.
              fun parentFor(d: File): File? {
                  val loc = locate(d.absolutePath) ?: return null
                  if (loc.second.isEmpty()) {
                      val up = loc.first.file.parentFile
                      return if (up != null && up.exists()) up else null
                  }
                  return d.parentFile
              }

              // Delete extracted files (and forget the file lists) of archives that no tab is inside any more.
              // Runs under the same lock as open(), so it can never delete an archive that is being opened again.
              fun cleanup(context: Context, tabPaths: List<String>) {
                  synchronized(this) {
                      val r = root(context)
                      val rootPath = r.absolutePath + "/"
                      r.listFiles()?.forEach { f ->
                          val key = f.name.removeSuffix(".src")
                          val used = tabPaths.any { it.startsWith(rootPath + key + "/") }
                          if (used) {
                              pinned.remove(key)
                          } else if (!pinned.contains(key)) {
                              f.deleteRecursively()
                              sessions.remove(key)
                          }
                      }
                  }
              }

              // ----- virtual folders -----
              private fun locate(path: String): Pair<ArchiveSession, String>? {
                  val r = rootDir ?: return null
                  val prefix = r.absolutePath + "/"
                  if (!path.startsWith(prefix)) return null
                  val parts = path.removePrefix(prefix).split("/")
                  val s = synchronized(this) { sessions[parts[0]] } ?: return null
                  return s to parts.drop(2).joinToString("/")
              }

              // Items of a folder inside an opened archive (null = not an archive folder)
              fun virtualList(dir: File): List<Entry>? {
                  val loc = locate(dir.absolutePath) ?: return null
                  val list = loc.first.children[loc.second] ?: return emptyList()
                  return list.map { e ->
                      val name = e.path.substringAfterLast('/')
                      Entry(File(dir, name), name, e.isDir, e.size, e.modified)
                  }
              }

              fun virtualCount(dir: File): Int? {
                  val loc = locate(dir.absolutePath) ?: return null
                  return loc.first.children[loc.second]?.size ?: 0
              }

              private fun destRootOf(s: ArchiveSession): File = File(File(rootDir!!, s.key), s.file.name)

              private fun cleanName(raw: String): String {
                  val p = raw.replace('\\', '/').trim('/').removePrefix("./")
                  if (p.split('/').any { it == ".." }) return ""
                  return p
              }

              // ----- opening (reads the file list only) -----
              fun open(context: Context, file: File, password: String?, op: OpProgress): ExtractResult {
                  val kind = kindOf(file.name) ?: return ExtractResult(null, false, "Unsupported archive")
                  try {
                      val rootD = root(context)
                      rootD.mkdirs()
                      val key = Integer.toHexString((file.absolutePath + file.lastModified() + file.length()).hashCode())
                      op.detail = "Reading the file list..."
                      val entries = try {
                          list(kind, file, password)
                      } catch (e: NeedPassword) {
                          return ExtractResult(null, true, null)
                      }
                      if (op.cancelled.get()) return ExtractResult(null, false, "Cancelled")
                      val session = ArchiveSession(key, file, kind, password, entries.filter { it.path.isNotEmpty() })
                      // Same lock as cleanup(): an old cleanup can not delete this archive while it is being opened
                      val dest = synchronized(this) {
                          pinned.add(key)
                          File(rootD, "$key.src").writeText(file.parentFile?.absolutePath ?: "")
                          sessions[key] = session
                          destRootOf(session).also { it.mkdirs() }
                      }
                      return ExtractResult(dest, false, null)
                  } catch (e: Exception) {
                      val m = e.message ?: e.javaClass.simpleName
                      return ExtractResult(null, false, "Couldn't open: $m")
                  }
              }

              private fun tarStream(kind: String, file: File): InputStream {
                  val raw = BufferedInputStream(FileInputStream(file), 64 * 1024)
                  return when (kind) {
                      "targz" -> GzipCompressorInputStream(raw)
                      "tarbz2" -> BZip2CompressorInputStream(raw)
                      "tarxz" -> XZCompressorInputStream(raw)
                      else -> raw
                  }
              }

              private fun singleName(file: File): String = file.name.substringBeforeLast('.').ifEmpty { file.name }

              private fun singleStream(kind: String, file: File): InputStream {
                  val raw = BufferedInputStream(FileInputStream(file), 64 * 1024)
                  return when (kind) {
                      "gz" -> GzipCompressorInputStream(raw)
                      "bz2" -> BZip2CompressorInputStream(raw)
                      else -> XZCompressorInputStream(raw)
                  }
              }

              private fun list(kind: String, file: File, password: String?): List<ArcEntry> {
                  val out = ArrayList<ArcEntry>()
                  when (kind) {
                      "zip" -> {
                          val zip = ZipFile(file)
                          if (!zip.isValidZipFile) throw java.io.IOException("not a valid zip file")
                          if (password != null) zip.setPassword(password.toCharArray())
                          val headers = zip.fileHeaders
                          if (zip.isEncrypted) {
                              if (password == null) throw NeedPassword()
                              val first = headers.firstOrNull { !it.isDirectory }
                              if (first != null) {
                                  try {
                                      zip.getInputStream(first).use { it.read() }
                                  } catch (e: net.lingala.zip4j.exception.ZipException) {
                                      throw NeedPassword()
                                  }
                              }
                          }
                          for (h in headers) {
                              out.add(ArcEntry(cleanName(h.fileName), h.isDirectory, h.uncompressedSize, h.lastModifiedTimeEpoch))
                          }
                      }
                      "7z" -> {
                          try {
                              val sf = if (password == null) SevenZFile(file) else SevenZFile(file, password.toCharArray())
                              sf.use {
                                  var e = it.nextEntry
                                  while (e != null) {
                                      if (!e.isAntiItem) {
                                          val mod = if (e.hasLastModifiedDate) e.lastModifiedDate.time else file.lastModified()
                                          out.add(ArcEntry(cleanName(e.name), e.isDirectory, e.size, mod))
                                      }
                                      e = it.nextEntry
                                  }
                              }
                              // Read the start of the first file: shows whether a password is needed / correct
                              val probe = if (password == null) SevenZFile(file) else SevenZFile(file, password.toCharArray())
                              probe.use {
                                  var e = it.nextEntry
                                  while (e != null && (e.isDirectory || e.size <= 0L)) e = it.nextEntry
                                  if (e != null) {
                                      val buf = ByteArray(64 * 1024)
                                      var total = 0L
                                      val limit = minOf(e.size, 8L * 1024 * 1024)
                                      while (total < limit) {
                                          val n = it.read(buf)
                                          if (n < 0) break
                                          total += n
                                      }
                                  }
                              }
                          } catch (e: PasswordRequiredException) {
                              throw NeedPassword()
                          } catch (e: java.io.IOException) {
                              if (password != null) throw NeedPassword()
                              throw e
                          }
                      }
                      "rar" -> {
                          val archive = try {
                              if (password == null) Archive(file) else Archive(file, password)
                          } catch (e: Exception) {
                              val m = (e.message ?: "").lowercase()
                              if (e.javaClass.simpleName.contains("V5")) throw java.io.IOException("RAR5 is not supported (only RAR4)")
                              if (m.contains("password") || m.contains("encrypt")) throw NeedPassword()
                              throw e
                          }
                          archive.use { a ->
                              val headers = a.fileHeaders
                              if (headers.any { it.isEncrypted }) {
                                  if (password == null) throw NeedPassword()
                                  val first = headers.firstOrNull { !it.isDirectory && it.isEncrypted }
                                  if (first != null) {
                                      try {
                                          a.extractFile(first, object : OutputStream() { override fun write(b: Int) {} override fun write(b: ByteArray, off: Int, len: Int) {} })
                                      } catch (e: Exception) {
                                          throw NeedPassword()
                                      }
                                  }
                              }
                              for (h in headers) {
                                  out.add(ArcEntry(cleanName(h.fileName), h.isDirectory, h.fullUnpackSize, h.mTime?.time ?: file.lastModified()))
                              }
                          }
                      }
                      "tar", "targz", "tarbz2", "tarxz" -> {
                          TarArchiveInputStream(tarStream(kind, file)).use { t ->
                              var e = t.nextEntry
                              while (e != null) {
                                  if (!e.isSymbolicLink && !e.isLink) {
                                      out.add(ArcEntry(cleanName(e.name), e.isDirectory, e.size, e.lastModifiedDate.time))
                                  }
                                  e = t.nextEntry
                              }
                          }
                      }
                      else -> {
                          // single compressed file: one entry; reading the start checks the file is valid
                          singleStream(kind, file).use { it.read() }
                          out.add(ArcEntry(singleName(file), false, 0L, file.lastModified()))
                      }
                  }
                  return out.filter { it.path.isNotEmpty() }
              }

              // ----- extracting single files / folders when opened or copied -----
              private fun wantedFiles(s: ArchiveSession, rel: String): List<ArcEntry> =
                  s.entries.filter { !it.isDir && (rel.isEmpty() || it.path == rel || it.path.startsWith("$rel/")) }

              private fun isDone(s: ArchiveSession, e: ArcEntry): Boolean {
                  val t = File(destRootOf(s), e.path)
                  return t.isFile && e.size > 0L && t.length() == e.size
              }

              // True when some of these files / folders still have to be extracted
              fun needsExtraction(files: List<File>): Boolean {
                  for (f in files) {
                      val loc = locate(f.absolutePath) ?: continue
                      if (wantedFiles(loc.first, loc.second).any { !isDone(loc.first, it) }) return true
                  }
                  return false
              }

              // Extracts the given virtual files / folders (with everything inside) into the cache. Returns an error text or null.
              fun materialize(files: List<File>, op: OpProgress): String? {
                  try {
                      for (f in files) {
                          val loc = locate(f.absolutePath) ?: continue
                          val s = loc.first
                          val destRoot = destRootOf(s)
                          // keep empty folders too
                          s.entries.filter { it.isDir && (loc.second.isEmpty() || it.path == loc.second || it.path.startsWith(loc.second + "/")) }
                              .forEach { File(destRoot, it.path).mkdirs() }
                          val need = wantedFiles(s, loc.second).filter { !isDone(s, it) }
                          if (need.isEmpty()) continue
                          extractFiles(s, need, destRoot, op)
                      }
                      return null
                  } catch (e: OpCancelled) {
                      return "Cancelled"
                  } catch (e: NeedPassword) {
                      return "Wrong password"
                  } catch (e: Exception) {
                      return "Couldn't extract: ${e.message ?: e.javaClass.simpleName}"
                  }
              }

              private fun copyOut(reader: (ByteArray) -> Int, target: File, mod: Long, op: OpProgress, counter: LongArray, total: Long) {
                  target.parentFile?.mkdirs()
                  target.outputStream().use { out ->
                      val buf = ByteArray(128 * 1024)
                      while (true) {
                          if (op.cancelled.get()) { out.close(); target.delete(); throw OpCancelled() }
                          val n = reader(buf)
                          if (n < 0) break
                          out.write(buf, 0, n)
                          counter[0] += n
                          op.fraction = (counter[0].toDouble() / total).toFloat().coerceIn(0f, 1f)
                      }
                  }
                  if (mod > 0L) target.setLastModified(mod)
              }

              private fun extractFiles(s: ArchiveSession, need: List<ArcEntry>, destRoot: File, op: OpProgress) {
                  val total = need.sumOf { it.size }.coerceAtLeast(1L)
                  val counter = LongArray(1)
                  val byPath = need.associateBy { it.path }
                  op.fraction = 0f
                  when (s.kind) {
                      "zip" -> {
                          val zip = ZipFile(s.file)
                          if (s.password != null) zip.setPassword(s.password.toCharArray())
                          for (h in zip.fileHeaders) {
                              val e = byPath[cleanName(h.fileName)] ?: continue
                              op.detail = e.path.substringAfterLast('/')
                              zip.getInputStream(h).use { input ->
                                  copyOut({ b -> input.read(b) }, File(destRoot, e.path), e.modified, op, counter, total)
                              }
                          }
                      }
                      "7z" -> {
                          val sf = if (s.password == null) SevenZFile(s.file) else SevenZFile(s.file, s.password.toCharArray())
                          sf.use {
                              var left = byPath.size
                              var e = it.nextEntry
                              while (e != null && left > 0) {
                                  val want = if (e.isDirectory) null else byPath[cleanName(e.name)]
                                  if (want != null) {
                                      op.detail = want.path.substringAfterLast('/')
                                      copyOut({ b -> it.read(b) }, File(destRoot, want.path), want.modified, op, counter, total)
                                      left--
                                  }
                                  e = it.nextEntry
                              }
                          }
                      }
                      "rar" -> {
                          val a = if (s.password == null) Archive(s.file) else Archive(s.file, s.password)
                          a.use {
                              for (h in it.fileHeaders) {
                                  val want = byPath[cleanName(h.fileName)] ?: continue
                                  op.detail = want.path.substringAfterLast('/')
                                  val target = File(destRoot, want.path)
                                  target.parentFile?.mkdirs()
                                  ProgressOutputStream(FileOutputStream(target), op, counter, total).use { out -> it.extractFile(h, out) }
                                  if (want.modified > 0L) target.setLastModified(want.modified)
                              }
                          }
                      }
                      "tar", "targz", "tarbz2", "tarxz" -> {
                          TarArchiveInputStream(tarStream(s.kind, s.file)).use { t ->
                              var left = byPath.size
                              var e = t.nextEntry
                              while (e != null && left > 0) {
                                  val want = if (e.isDirectory) null else byPath[cleanName(e.name)]
                                  if (want != null) {
                                      op.detail = want.path.substringAfterLast('/')
                                      copyOut({ b -> t.read(b) }, File(destRoot, want.path), want.modified, op, counter, total)
                                      left--
                                  }
                                  e = t.nextEntry
                              }
                          }
                      }
                      else -> {
                          val want = need.first()
                          op.detail = want.path
                          singleStream(s.kind, s.file).use { input ->
                              copyOut({ b -> input.read(b) }, File(destRoot, want.path), want.modified, op, counter, total)
                          }
                      }
                  }
              }
          }

          // Zip writing: STORE only (no compression, fast). With a password the files are AES-256 encrypted.
          object ZipOps {
              fun zip(items: List<File>, dest: File, password: String?, op: OpProgress): String {
                  try {
                      val zip = if (password.isNullOrEmpty()) ZipFile(dest) else ZipFile(dest, password.toCharArray())
                      zip.isRunInThread = true
                      val params = ZipParameters().apply {
                          compressionMethod = CompressionMethod.STORE
                          if (!password.isNullOrEmpty()) {
                              isEncryptFiles = true
                              encryptionMethod = EncryptionMethod.AES
                              aesKeyStrength = AesKeyStrength.KEY_STRENGTH_256
                          }
                      }
                      for ((i, item) in items.withIndex()) {
                          op.detail = "${i + 1}/${items.size}  ${item.name}"
                          if (item.isDirectory) zip.addFolder(item, params) else zip.addFile(item, params)
                          val monitor = zip.progressMonitor
                          while (monitor.state == ProgressMonitor.State.BUSY) {
                              if (op.cancelled.get()) monitor.isCancelAllTasks = true
                              op.fraction = ((i + monitor.percentDone / 100f) / items.size).coerceIn(0f, 1f)
                              Thread.sleep(80)
                          }
                          if (op.cancelled.get()) {
                              dest.delete()
                              return "Cancelled"
                          }
                          if (monitor.result == ProgressMonitor.Result.ERROR) {
                              dest.delete()
                              return "Zip failed: ${monitor.exception?.message ?: "error"}"
                          }
                          op.fraction = (i + 1).toFloat() / items.size
                      }
                      return "Created ${dest.name}"
                  } catch (e: Exception) {
                      dest.delete()
                      return "Zip failed: ${e.message}"
                  }
              }
          }

          // ---------- File operations (always run on a background thread) ----------
          object FileOps {
              // A name that does not exist in dir yet: "name (1).ext", "name (2).ext" ...
              fun uniqueTarget(dir: File, name: String, isDir: Boolean): File {
                  val first = File(dir, name)
                  if (!first.exists()) return first
                  val dot = name.lastIndexOf('.')
                  val hasExt = !isDir && dot > 0
                  val base = if (hasExt) name.substring(0, dot) else name
                  val ext = if (hasExt) name.substring(dot) else ""
                  var i = 1
                  var candidate = File(dir, "$base ($i)$ext")
                  while (candidate.exists()) {
                      i++
                      candidate = File(dir, "$base ($i)$ext")
                  }
                  return candidate
              }

              fun items(n: Int): String = if (n == 1) "1 item" else "$n items"

              private fun sizeOf(f: File): Long =
                  if (f.isDirectory) (f.listFiles()?.sumOf { sizeOf(it) } ?: 0L) else f.length()

              // Copies one file or folder with byte progress. The ORIGINAL date and time are kept
              // (files and folders), so a copy does not look newer than the source.
              private fun copyTree(src: File, dst: File, op: OpProgress, counter: LongArray, total: Long) {
                  if (op.cancelled.get()) throw OpCancelled()
                  if (src.isDirectory) {
                      dst.mkdirs()
                      src.listFiles()?.forEach { copyTree(it, File(dst, it.name), op, counter, total) }
                      dst.setLastModified(src.lastModified())
                  } else {
                      src.inputStream().use { input ->
                          dst.outputStream().use { output ->
                              val buf = ByteArray(256 * 1024)
                              while (true) {
                                  if (op.cancelled.get()) throw OpCancelled()
                                  val n = input.read(buf)
                                  if (n < 0) break
                                  output.write(buf, 0, n)
                                  counter[0] += n
                                  op.fraction = (counter[0].toDouble() / total).toFloat().coerceIn(0f, 1f)
                              }
                          }
                      }
                      dst.setLastModified(src.lastModified())
                  }
              }

              // Copy or move items into destDir. Returns a short message for a toast.
              fun paste(paths: List<String>, destDir: File, move: Boolean, op: OpProgress): String {
                  // Items copied out of an opened archive are extracted first (that is the "extract")
                  val virtualSrc = paths.filter { ArchiveSupport.isVirtualPath(it) }
                  if (virtualSrc.isNotEmpty()) {
                      op.detail = "Extracting..."
                      val err = ArchiveSupport.materialize(virtualSrc.map { File(it) }, op)
                      if (err != null) return err
                      op.fraction = 0f
                  }
                  var ok = 0
                  var failed = 0
                  val destPath = destDir.absolutePath
                  val toCopy = ArrayList<File>()
                  for (p in paths) {
                      val src = File(p)
                      if (!src.exists()) { failed++; continue }
                      // A folder can not go into itself or into one of its own subfolders
                      if (src.isDirectory && (destPath == src.absolutePath || destPath.startsWith(src.absolutePath + "/"))) {
                          failed++
                          continue
                      }
                      // Moving into the folder it is already in: nothing to do
                      if (move && src.parentFile?.absolutePath == destPath) { ok++; continue }
                      // Move on the same storage is an instant rename (the date stays as it is)
                      if (move && src.renameTo(uniqueTarget(destDir, src.name, src.isDirectory))) { ok++; continue }
                      toCopy.add(src)
                  }
                  op.detail = "Preparing..."
                  val total = toCopy.sumOf { sizeOf(it) }.coerceAtLeast(1L)
                  val counter = LongArray(1)
                  var cancelled = false
                  for ((i, src) in toCopy.withIndex()) {
                      op.detail = "${i + 1}/${toCopy.size}  ${src.name}"
                      val target = uniqueTarget(destDir, src.name, src.isDirectory)
                      try {
                          copyTree(src, target, op, counter, total)
                          // Other storage move: the original goes away only after a complete copy
                          if (move && !src.deleteRecursively()) { failed++ } else ok++
                      } catch (e: OpCancelled) {
                          target.deleteRecursively()
                          cancelled = true
                          break
                      } catch (e: Exception) {
                          target.deleteRecursively()
                          failed++
                      }
                  }
                  val verb = if (move) "Moved" else "Copied"
                  return when {
                      cancelled -> "Cancelled ($verb $ok)"
                      failed == 0 -> "$verb ${items(ok)}"
                      else -> "$verb $ok, $failed failed"
                  }
              }

              fun delete(paths: List<String>, op: OpProgress): String {
                  var ok = 0
                  var failed = 0
                  for ((i, p) in paths.withIndex()) {
                      if (op.cancelled.get()) break
                      op.detail = "${i + 1}/${paths.size}  ${File(p).name}"
                      op.fraction = i.toFloat() / paths.size
                      val done = try { File(p).deleteRecursively() } catch (e: Exception) { false }
                      if (done) ok++ else failed++
                  }
                  return if (failed == 0) "Deleted ${items(ok)}" else "Deleted $ok, $failed failed"
              }

              // Returns an error message, or null when renamed
              fun rename(src: File, newName: String): String? {
                  val name = newName.trim()
                  if (name.isEmpty()) return "Name can't be empty"
                  if (name.contains('/')) return "Name can't contain /"
                  if (name == src.name) return null
                  val target = File(src.parentFile, name)
                  if (target.exists()) return "\"$name\" already exists"
                  return if (src.renameTo(target)) null else "Could not rename"
              }
          }

          // ---------- Thumbnail cache (disk + memory) ----------
          object ThumbnailCache {
              private const val MAX_THUMBS = 500
              private const val THUMB_SIZE = 240

              private val memory = object : LruCache<String, Bitmap>(12 * 1024 * 1024) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount
              }

              private fun thumbDir(context: Context): File {
                  val dir = File(context.cacheDir, "thumbs")
                  if (!dir.exists()) dir.mkdirs()
                  return dir
              }

              private fun keyFor(pathAndStamp: String): String {
                  val digest = MessageDigest.getInstance("MD5").digest(pathAndStamp.toByteArray())
                  return digest.joinToString("") { "%02x".format(it) }
              }

              fun isImage(name: String): Boolean {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return ext in setOf("jpg", "jpeg", "png", "webp", "gif", "bmp", "heic", "heif")
              }

              fun isGif(name: String): Boolean = name.substringAfterLast('.', "").lowercase() == "gif"

              fun isVideo(name: String): Boolean {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  return ext in setOf("mp4", "mkv", "webm", "3gp", "mov", "avi", "m4v")
              }

              suspend fun getThumbnail(context: Context, file: File, modified: Long): Bitmap? = withContext(Dispatchers.IO) {
                  val name = file.name
                  if (!isImage(name) && !isVideo(name)) return@withContext null
                  val key = keyFor("${file.absolutePath}:$modified")
                  memory.get(key)?.let { return@withContext it }
                  val bmp = loadOrGenerate(context, key) {
                      when {
                          isImage(name) -> decodeSampledImage(file.absolutePath, THUMB_SIZE)
                          isVideo(name) -> extractVideoFrame(file.absolutePath)
                          else -> null
                      }
                  }
                  if (bmp != null) memory.put(key, bmp)
                  bmp
              }

              // Preview of a folder: its first image (by name), shown as a small badge
              suspend fun getFolderThumbnail(context: Context, dir: File): Bitmap? = withContext(Dispatchers.IO) {
                  val firstImage = try {
                      dir.listFiles()?.filter { it.isFile && isImage(it.name) }
                          ?.minByOrNull { it.name.lowercase() }
                  } catch (e: Exception) { null } ?: return@withContext null

                  val key = keyFor("folder:${dir.absolutePath}:${firstImage.name}:${firstImage.lastModified()}")
                  memory.get(key)?.let { return@withContext it }
                  val bmp = loadOrGenerate(context, key) { decodeSampledImage(firstImage.absolutePath, THUMB_SIZE) }
                  if (bmp != null) memory.put(key, bmp)
                  bmp
              }

              private fun loadOrGenerate(context: Context, key: String, generate: () -> Bitmap?): Bitmap? {
                  val cacheFile = File(thumbDir(context), "$key.jpg")
                  if (cacheFile.exists()) {
                      try {
                          val cached = BitmapFactory.decodeFile(cacheFile.absolutePath)
                          if (cached != null) return cached
                      } catch (e: Exception) { }
                  }

                  val bitmap = try { generate() } catch (e: Exception) { null }

                  if (bitmap != null) {
                      try {
                          FileOutputStream(cacheFile).use { out ->
                              bitmap.compress(Bitmap.CompressFormat.JPEG, 85, out)
                          }
                          evictIfNeeded(context)
                      } catch (e: Exception) { }
                  }
                  return bitmap
              }

              private fun decodeSampledImage(path: String, targetSize: Int): Bitmap? {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, options)
                  if (options.outWidth <= 0 || options.outHeight <= 0) return null
                  var sample = 1
                  while (options.outWidth / (sample * 2) >= targetSize && options.outHeight / (sample * 2) >= targetSize) {
                      sample *= 2
                  }
                  val opts2 = BitmapFactory.Options().apply { inSampleSize = sample }
                  return BitmapFactory.decodeFile(path, opts2)
              }

              private fun extractVideoFrame(path: String): Bitmap? {
                  val retriever = MediaMetadataRetriever()
                  try {
                      retriever.setDataSource(path)
                      val frame = retriever.getFrameAtTime(-1, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                          ?: retriever.frameAtTime
                      if (frame != null) return frame
                  } catch (e: Exception) {
                  } finally {
                      try { retriever.release() } catch (e: Exception) { }
                  }
                  return try {
                      @Suppress("DEPRECATION")
                      ThumbnailUtils.createVideoThumbnail(path, android.provider.MediaStore.Video.Thumbnails.MINI_KIND)
                  } catch (e: Exception) { null }
              }

              private fun evictIfNeeded(context: Context) {
                  val dir = thumbDir(context)
                  val files = dir.listFiles() ?: return
                  if (files.size <= MAX_THUMBS) return
                  files.sortBy { it.lastModified() }
                  val toDelete = files.size - MAX_THUMBS
                  for (i in 0 until toDelete) {
                      try { files[i].delete() } catch (e: Exception) { }
                  }
              }
          }

          // ---------- Full-resolution image cache for the viewer ----------
          // (merged from GreyIV) Uses ImageDecoder.setTargetSize so large sources (9000-10000px+) are
          // downsampled DURING decode rather than decoded full-res then discarded.
          object FullImageCache {
              suspend fun probeSize(context: Context, uri: Uri): Pair<Int, Int>? = withContext(Dispatchers.IO) {
                  try {
                      val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      openStream(context, uri)?.use { BitmapFactory.decodeStream(it, null, options) }
                      if (options.outWidth > 0 && options.outHeight > 0) {
                          options.outWidth to options.outHeight
                      } else null
                  } catch (e: Exception) { null }
              }

              suspend fun decodeForViewer(context: Context, uri: Uri, maxDimension: Int): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          val source = ImageDecoder.createSource(context.contentResolver, uri)
                          ImageDecoder.decodeBitmap(source) { decoder, info, _ ->
                              val w = info.size.width
                              val h = info.size.height
                              val longSide = maxOf(w, h)
                              if (longSide > maxDimension) {
                                  val scale = maxDimension.toFloat() / longSide
                                  decoder.setTargetSize(
                                      (w * scale).toInt().coerceAtLeast(1),
                                      (h * scale).toInt().coerceAtLeast(1)
                                  )
                              }
                              decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                              decoder.isMutableRequired = false
                          }
                      } else {
                          decodeLegacy(context, uri, maxDimension)
                      }
                  } catch (e: Exception) {
                      try { decodeLegacy(context, uri, maxDimension) } catch (e2: Exception) { null }
                  }
              }

              private fun decodeLegacy(context: Context, uri: Uri, maxDimension: Int): Bitmap? {
                  val boundsOptions = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  openStream(context, uri)?.use { BitmapFactory.decodeStream(it, null, boundsOptions) }
                  if (boundsOptions.outWidth <= 0 || boundsOptions.outHeight <= 0) return null

                  var sample = 1
                  while (boundsOptions.outWidth / (sample * 2) >= maxDimension &&
                      boundsOptions.outHeight / (sample * 2) >= maxDimension) {
                      sample *= 2
                  }
                  val opts = BitmapFactory.Options().apply {
                      inSampleSize = sample
                      inPreferredConfig = Bitmap.Config.ARGB_8888
                  }
                  return openStream(context, uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
              }

              fun loadAnimatedDrawable(context: Context, uri: Uri): Any? {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try {
                          val source = ImageDecoder.createSource(context.contentResolver, uri)
                          ImageDecoder.decodeDrawable(source)
                      } catch (e: Exception) { null }
                  } else {
                      try {
                          openStream(context, uri)?.use { BitmapFactory.decodeStream(it) }
                      } catch (e: Exception) { null }
                  }
              }

              private fun openStream(context: Context, uri: Uri): InputStream? {
                  return try { context.contentResolver.openInputStream(uri) } catch (e: Exception) { null }
              }
          }

          // Reflection-based path extraction for StorageVolume
          private fun storageVolumePath(volume: Any): File? {
              try {
                  val getDirectory: Method = volume.javaClass.getMethod("getDirectory")
                  val dir = getDirectory.invoke(volume) as? File
                  if (dir != null) return dir
              } catch (e: Exception) { }

              for (methodName in listOf("getPathFile", "getPath")) {
                  try {
                      val m: Method = volume.javaClass.getMethod(methodName)
                      val result = m.invoke(volume)
                      when (result) {
                          is File -> return result
                          is String -> return File(result)
                      }
                  } catch (e: Exception) { }
              }
              return null
          }

          fun getStorageRoots(context: Context): List<Pair<String, File>> {
              val roots = mutableListOf<Pair<String, File>>()

              try {
                  val storageManager = context.getSystemService(Context.STORAGE_SERVICE) as StorageManager
                  val volumes = storageManager.storageVolumes

                  for (volume in volumes) {
                      try {
                          val isRemovable = volume.isRemovable
                          val state = volume.state
                          if (state != Environment.MEDIA_MOUNTED && state != Environment.MEDIA_MOUNTED_READ_ONLY) continue

                          val dir = storageVolumePath(volume) ?: continue
                          if (!dir.exists() || !dir.canRead()) continue

                          val label = when {
                              !isRemovable -> "Internal Storage"
                              else -> volume.getDescription(context) ?: "SD Card"
                          }
                          roots.add(label to dir)
                      } catch (e: Exception) { }
                  }
              } catch (e: Exception) { }

              if (roots.isEmpty()) {
                  Environment.getExternalStorageDirectory()?.let {
                      if (it.exists() && it.canRead()) {
                          roots.add("Internal Storage" to it)
                      }
                  }
                  try {
                      val storageDir = File("/storage")
                      if (storageDir.exists() && storageDir.canRead()) {
                          storageDir.listFiles()?.forEach { f ->
                              if (f.isDirectory && f.name != "emulated" && f.name != "self" && f.canRead()
                                  && f.name.matches(Regex("[0-9A-F]{4}-[0-9A-F]{4}"))) {
                                  roots.add("SD Card" to f)
                              }
                          }
                      }
                  } catch (e: Exception) { }
              }

              return roots.distinctBy { it.second.absolutePath }
          }

          // Storage roots are looked up once and reused; cleared when the app resumes
          object StorageRoots {
              private var cache: List<Pair<String, File>>? = null

              @Synchronized
              fun get(context: Context): List<Pair<String, File>> =
                  cache ?: getStorageRoots(context).also { cache = it }

              @Synchronized
              fun clear() { cache = null }
          }

          // Returns true when a path lives on internal storage (used for bookmark icons)
          fun isInternalPath(context: Context, path: String): Boolean {
              val root = StorageRoots.get(context).firstOrNull { path.startsWith(it.second.absolutePath) }
              return root == null || root.first == "Internal Storage"
          }

          // Tab and breadcrumb names: storage roots use their label (so "0" becomes "Internal Storage")
          fun tabTitle(context: Context, dir: File?): String {
              if (dir == null) return "Home"
              val root = StorageRoots.get(context).firstOrNull { it.second.absolutePath == dir.absolutePath }
              return root?.first ?: dir.name.ifEmpty { dir.absolutePath }
          }

          @Composable
          fun FileExplorerApp() {
              val context = LocalContext.current
              var hasPermission by remember { mutableStateOf(hasStoragePermission(context)) }
              var refreshTrigger by remember { mutableStateOf(0) }
              var sortMode by remember { mutableStateOf(SortPrefs.load(context)) }

              // Tabs
              val tabs = remember { mutableStateListOf<TabState>() }
              var nextTabId by remember { mutableStateOf(1L) }
              var activeIndex by remember { mutableStateOf(0) }
              var pendingCloseIndex by remember { mutableStateOf(-1) }

              var editorFile by remember { mutableStateOf<File?>(null) }
              var logcatOpen by remember { mutableStateOf(false) }
              var viewerImages by remember { mutableStateOf<List<File>?>(null) }
              var viewerStartIndex by remember { mutableStateOf(0) }

              var panelOpen by remember { mutableStateOf(false) }
              var menuOpen by remember { mutableStateOf(false) }
              var bookmarkListVersion by remember { mutableStateOf(0) }

              // ---- Marking, copy / move, rename, delete ----
              val scope = rememberCoroutineScope()
              val marked = remember { mutableStateListOf<String>() }
              val markedSet by remember { derivedStateOf { marked.toSet() } }
              var clipPaths by remember { mutableStateOf<List<String>>(emptyList()) }
              var clipMove by remember { mutableStateOf(false) }
              var contextTarget by remember { mutableStateOf<File?>(null) }
              var renameTarget by remember { mutableStateOf<File?>(null) }
              var deleteTargets by remember { mutableStateOf<List<String>?>(null) }
              // The running long task (shows the progress popup), see OpProgress
              var op by remember { mutableStateOf<OpProgress?>(null) }
              var zipTargets by remember { mutableStateOf<List<String>?>(null) }
              var newFolderOpen by remember { mutableStateOf(false) }
              var archivePrompt by remember { mutableStateOf<File?>(null) }
              var archiveWrongPassword by remember { mutableStateOf(false) }

              // Something is marked or waiting to be pasted: the menu button blinks, menu rows get a dot
              val pending = marked.isNotEmpty() || clipPaths.isNotEmpty()
              val cancelLabel = when {
                  marked.size > 1 -> "Cancel Marks"
                  marked.isNotEmpty() -> "Cancel Mark"
                  clipMove -> "Cancel Move"
                  else -> "Cancel Copy"
              }
              val pulseOn = remember { mutableStateOf(false) }
              LaunchedEffect(pending) {
                  if (pending) {
                      while (true) {
                          pulseOn.value = true
                          delay(500)
                          pulseOn.value = false
                          delay(500)
                      }
                  } else {
                      pulseOn.value = false
                  }
              }

              fun toggleMark(file: File) {
                  val p = file.absolutePath
                  if (marked.contains(p)) marked.remove(p) else marked.add(p)
              }

              // The items an action applies to: all marked items if this one is marked, else just this one
              fun targetsFor(file: File): List<String> =
                  if (markedSet.contains(file.absolutePath)) marked.toList() else listOf(file.absolutePath)

              fun cancelPending() {
                  marked.clear()
                  clipPaths = emptyList()
              }

              fun afterFileOp() {
                  DirCache.clear()
                  FolderCount.clear()
                  // A tab that was inside a deleted / moved / renamed folder goes up to the nearest folder that still exists
                  tabs.forEach { t ->
                      val d = t.dir
                      if (d != null && !d.exists() && !ArchiveSupport.isVirtualPath(d.absolutePath)) {
                          var p = d.parentFile
                          while (p != null && !p.exists()) p = p.parentFile
                          t.dir = p
                      }
                  }
                  refreshTrigger++
              }

              // Runs a long task in the background with the progress popup. The block returns the toast text
              // (empty = no toast). `after` runs on the main thread when it is done.
              fun runOp(title: String, after: () -> Unit = {}, block: (OpProgress) -> String) {
                  if (op != null) return
                  val progress = OpProgress(title)
                  op = progress
                  scope.launch {
                      val msg = withContext(Dispatchers.IO) {
                          try { block(progress) } catch (e: Exception) { "Failed: ${e.message}" }
                      }
                      op = null
                      afterFileOp()
                      after()
                      if (msg.isNotEmpty()) Toast.makeText(context, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              // The archive view is read only: nothing can be pasted / created inside it
              fun archiveBlocked(dir: File?): Boolean {
                  if (dir != null && ArchiveSupport.isInside(context, dir)) {
                      Toast.makeText(context, "Open a real folder first (copy out of the archive to extract)", Toast.LENGTH_SHORT).show()
                      return true
                  }
                  return false
              }

              fun doPaste() {
                  val dest = tabs.getOrNull(activeIndex)?.dir ?: return
                  if (archiveBlocked(dest)) return
                  val paths = clipPaths
                  val move = clipMove
                  clipPaths = emptyList()
                  runOp(if (move) "Moving" else "Copying") { p -> FileOps.paste(paths, dest, move, p) }
              }

              fun openArchive(file: File, password: String?) {
                  val tab = tabs.getOrNull(activeIndex)
                  var result: ExtractResult? = null
                  runOp(
                      title = "Opening ${file.name}",
                      after = {
                          val r = result
                          if (r?.dest != null) {
                              tab?.dir = r.dest
                          } else if (r?.wrongPassword == true) {
                              archiveWrongPassword = password != null
                              archivePrompt = file
                          }
                      }
                  ) { p ->
                      val r = ArchiveSupport.open(context, file, password, p)
                      result = r
                      r.message ?: ""
                  }
              }

              // Archives open like folders (only the file list is read). Password questions come back here.
              fun startArchive(file: File) {
                  openArchive(file, null)
              }

              // Extracts the given archive items (files or folders) when needed, then runs `then`
              fun extractThen(files: List<File>, then: () -> Unit) {
                  if (!ArchiveSupport.needsExtraction(files)) {
                      then()
                      return
                  }
                  var ok = false
                  runOp(title = "Extracting", after = { if (ok) then() }) { p ->
                      val err = ArchiveSupport.materialize(files, p)
                      ok = err == null
                      err ?: ""
                  }
              }

              // Archive items can be marked and copied (= extracted), but not changed
              fun readOnlyBlocked(files: List<File>): Boolean {
                  if (files.any { ArchiveSupport.isInside(context, it) }) {
                      Toast.makeText(context, "Archives are read only: use Copy to extract", Toast.LENGTH_SHORT).show()
                      return true
                  }
                  return false
              }

              fun doZip(targets: List<String>, name: String, password: String) {
                  val dir = tabs.getOrNull(activeIndex)?.dir ?: return
                  if (archiveBlocked(dir)) return
                  val fileName = if (name.lowercase().endsWith(".zip")) name else "$name.zip"
                  val dest = FileOps.uniqueTarget(dir, fileName, false)
                  val items = targets.map { File(it) }.filter { it.exists() }
                  marked.clear()
                  runOp("Zipping") { p -> ZipOps.zip(items, dest, password.ifEmpty { null }, p) }
              }

              // Free the extracted copy as soon as no tab is inside the archive any more
              val tabPaths = tabs.map { it.dir?.absolutePath ?: "" }
              LaunchedEffect(tabPaths, op == null) {
                  if (op == null) withContext(Dispatchers.IO) { ArchiveSupport.cleanup(context, tabPaths) }
              }

              fun newTab(dir: File?) {
                  tabs.add(TabState(nextTabId, dir))
                  nextTabId++
                  activeIndex = tabs.size - 1
              }

              // Restore saved tabs, or start with a single Home tab
              LaunchedEffect(Unit) {
                  // Opened archives live in the cache only for one app session
                  withContext(Dispatchers.IO) { ArchiveSupport.root(context).deleteRecursively() }
                  if (tabs.isEmpty()) {
                      val saved = SavedTabs.load(context)
                      if (saved.isNotEmpty()) {
                          saved.forEach { token ->
                              if (token == SavedTabs.HOME_TOKEN) newTab(null)
                              else newTab(File(token))
                          }
                          // After reopening the app, the first (leftmost) saved tab is the one that is open
                          activeIndex = 0
                      } else {
                          newTab(null)
                      }
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { _ ->
                  hasPermission = hasStoragePermission(context)
              }

              if (!hasPermission) {
                  LaunchedEffect(Unit) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                          intent.data = Uri.parse("package:${context.packageName}")
                          context.startActivity(intent)
                      } else {
                          permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }
              }

              val lifecycleOwner = LocalLifecycleOwner.current
              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_RESUME) {
                          hasPermission = hasStoragePermission(context)
                          StorageRoots.clear()
                          refreshTrigger++
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              BackHandler(enabled = viewerImages != null || contextTarget != null || panelOpen || menuOpen || tabs.size > 1 || tabs.getOrNull(activeIndex)?.dir != null) {
                  when {
                      viewerImages != null -> viewerImages = null
                      contextTarget != null -> contextTarget = null
                      menuOpen -> menuOpen = false
                      panelOpen -> panelOpen = false
                      else -> {
                          val tab = tabs.getOrNull(activeIndex) ?: return@BackHandler
                          val d = tab.dir
                          if (d != null) {
                              // Back from the top of an opened archive goes to the folder holding the zip
                              val parent = if (ArchiveSupport.isInside(context, d)) ArchiveSupport.parentFor(d) else d.parentFile
                              val isRoot = StorageRoots.get(context).any { it.second.absolutePath == d.absolutePath }
                              tab.dir = if (parent != null && !isRoot) parent else null
                          }
                      }
                  }
              }

              CompositionLocalProvider(LocalPulse provides pulseOn) {
              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color(0xFF1E1E1E)
              ) {
                  Box(modifier = Modifier.fillMaxSize()) {
                      if (logcatOpen) {
                          LogcatScreen(onClose = { logcatOpen = false })
                      } else if (editorFile != null) {
                          TextEditorScreen(
                              file = editorFile!!,
                              onClose = { saved ->
                                  editorFile = null
                                  if (saved) afterFileOp()
                              }
                          )
                      } else if (viewerImages != null) {
                          ImageViewerScreen(
                              images = viewerImages!!,
                              startIndex = viewerStartIndex,
                              onClose = { viewerImages = null }
                          )
                      } else if (!hasPermission) {
                          Box(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .windowInsetsPadding(WindowInsets.systemBars)
                          ) {
                              PermissionScreen(
                                  onGrant = {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                          intent.data = Uri.parse("package:${context.packageName}")
                                          context.startActivity(intent)
                                      } else {
                                          permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                                      }
                                  }
                              )
                          }
                      } else {
                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .windowInsetsPadding(WindowInsets.systemBars)
                          ) {
                              ScreenHeader(
                                  breadcrumbs = activeBreadcrumbs(context, tabs.getOrNull(activeIndex)),
                                  onOpenPanel = { panelOpen = true },
                                  menuOpen = menuOpen,
                                  onMenuToggle = { menuOpen = !menuOpen },
                                  onMenuDismiss = { menuOpen = false },
                                  menuPulse = pending,
                                  menuContent = { close ->
                                      val activeDir = tabs.getOrNull(activeIndex)?.dir
                                      // Pending actions pulse (white bg / black text) so they are not forgotten
                                      if (pending) {
                                          MenuRow(text = cancelLabel, dot = true) {
                                              cancelPending()
                                              close()
                                          }
                                      }
                                      if (activeDir != null && clipPaths.isNotEmpty()) {
                                          MenuRow(text = if (clipMove) "Move here" else "Paste here", dot = true) {
                                              doPaste()
                                              close()
                                          }
                                      }
                                      if (activeDir != null && !ArchiveSupport.isInside(context, activeDir)) {
                                          MenuRow(text = "Add New Folder") {
                                              newFolderOpen = true
                                              close()
                                          }
                                      }
                                      if (activeDir != null) {
                                          val bookmarked = Bookmarks.isBookmarked(context, activeDir.absolutePath)
                                          MenuRow(text = if (bookmarked) "Remove bookmark" else "Add to bookmarks") {
                                              if (bookmarked) {
                                                  Bookmarks.remove(context, activeDir.absolutePath)
                                                  Toast.makeText(context, "Removed from bookmarks", Toast.LENGTH_SHORT).show()
                                              } else {
                                                  Bookmarks.add(context, activeDir.absolutePath)
                                                  Toast.makeText(context, "Added to bookmarks", Toast.LENGTH_SHORT).show()
                                              }
                                              bookmarkListVersion++
                                              close()
                                          }
                                      }
                                      MenuRow(text = "Save tabs") {
                                          // A tab inside an opened archive is temporary, so it is saved as Home
                                          val tokens = tabs.map { t ->
                                              val d = t.dir
                                              if (d == null || ArchiveSupport.isInside(context, d)) SavedTabs.HOME_TOKEN else d.absolutePath
                                          }
                                          SavedTabs.save(context, tokens)
                                          Toast.makeText(context, "Tabs saved", Toast.LENGTH_SHORT).show()
                                          close()
                                      }
                                      Text(
                                          text = "Sort",
                                          color = Color.White.copy(alpha = 0.55f),
                                          fontSize = 11.sp,
                                          modifier = Modifier.padding(start = 16.dp, top = 8.dp, bottom = 2.dp)
                                      )
                                      SortMode.values().forEach { mode ->
                                          MenuRow(text = (if (mode == sortMode) "✓  " else "     ") + mode.label) {
                                              sortMode = mode
                                              SortPrefs.save(context, mode)
                                          }
                                      }
                                      MenuRow(text = "Logcat") {
                                          logcatOpen = true
                                          close()
                                      }
                                  }
                              )

                              TabRow(
                                  context = context,
                                  tabs = tabs,
                                  activeIndex = activeIndex,
                                  onSelect = { activeIndex = it },
                                  onRequestClose = { pendingCloseIndex = it },
                                  onSwipeAddTab = { newTab(null) }
                              )

                              // Small gap between the tabs and the list
                              Spacer(Modifier.height(8.dp))

                              // Content: swipe left/right switches tabs, with motion between them
                              Box(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .pointerInput(tabs.size, activeIndex) {
                                          // Swipe to switch tabs. It watches the touch BEFORE the list does
                                          // (Initial pass), so it works even when the finger starts on a list item.
                                          // It triggers after about 48 dp of mostly-horizontal movement.
                                          awaitEachGesture {
                                              val down = awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Initial)
                                              val slop = viewConfiguration.touchSlop
                                              val startTime = System.currentTimeMillis()
                                              val trigger = 32.dp.toPx()
                                              val quickTrigger = 18.dp.toPx()
                                              var totalX = 0f
                                              var totalY = 0f
                                              var decided = false
                                              var horizontal = false
                                              while (true) {
                                                  val event = awaitPointerEvent(PointerEventPass.Initial)
                                                  val change = event.changes.firstOrNull { it.id == down.id } ?: break
                                                  val delta = change.positionChange()
                                                  totalX += delta.x
                                                  totalY += delta.y
                                                  if (!decided && (abs(totalX) > slop || abs(totalY) > slop)) {
                                                      decided = true
                                                      horizontal = abs(totalX) > abs(totalY)
                                                  }
                                                  if (decided && horizontal) change.consume()
                                                  if (!change.pressed) break
                                              }
                                              if (decided && horizontal) {
                                                  // A quick flick needs even less distance
                                                  val needed = if (System.currentTimeMillis() - startTime < 250) quickTrigger else trigger
                                                  if (totalX < -needed && activeIndex < tabs.size - 1) {
                                                      activeIndex++
                                                  } else if (totalX > needed && activeIndex > 0) {
                                                      activeIndex--
                                                  }
                                              }
                                          }
                                      }
                              ) {
                                  AnimatedContent(
                                      targetState = activeIndex,
                                      transitionSpec = {
                                          // Fast switch: 150 ms
                                          if (targetState > initialState) {
                                              (slideInHorizontally(tween(150)) { it / 4 } + fadeIn(tween(150))) togetherWith
                                                  (slideOutHorizontally(tween(150)) { -it / 4 } + fadeOut(tween(150)))
                                          } else {
                                              (slideInHorizontally(tween(150)) { -it / 4 } + fadeIn(tween(150))) togetherWith
                                                  (slideOutHorizontally(tween(150)) { it / 4 } + fadeOut(tween(150)))
                                          }
                                      },
                                      modifier = Modifier.fillMaxSize(),
                                      label = "tabSwitch"
                                  ) { idx ->
                                      val tab = tabs.getOrNull(idx)
                                      if (tab != null) {
                                          val dir = tab.dir
                                          if (dir == null) {
                                              HomeScreen(
                                                  refreshKey = refreshTrigger,
                                                  onRefresh = {
                                                      StorageRoots.clear()
                                                      refreshTrigger++
                                                  },
                                                  onRootClick = { root -> tab.dir = root }
                                              )
                                          } else {
                                              FileListScreen(
                                                  directory = dir,
                                                  sortMode = sortMode,
                                                  refreshKey = refreshTrigger,
                                                  marked = markedSet,
                                                  onToggleMark = { f -> toggleMark(f) },
                                                  onLongPress = { f -> contextTarget = f },
                                                  onNavigate = { d -> tab.dir = d },
                                                  onOpenArchive = { f -> startArchive(f) },
                                                  onOpenText = { f -> editorFile = f },
                                                  onExtract = { files, then -> extractThen(files, then) },
                                                  onOpenImage = { images, index ->
                                                      viewerImages = images
                                                      viewerStartIndex = index
                                                  }
                                              )
                                          }
                                      }
                                  }
                              }
                          }

                          // Pending close confirmation
                          if (pendingCloseIndex >= 0 && pendingCloseIndex < tabs.size) {
                              val idx = pendingCloseIndex
                              AlertDialog(
                                  onDismissRequest = { pendingCloseIndex = -1 },
                                  title = { Text("Close tab?") },
                                  text = { Text("Close \"${tabTitle(context, tabs[idx].dir)}\"?") },
                                  confirmButton = {
                                      TextButton(onClick = {
                                          tabs.removeAt(idx)
                                          if (tabs.isEmpty()) {
                                              newTab(null)
                                          } else if (activeIndex >= tabs.size) {
                                              activeIndex = tabs.size - 1
                                          } else if (activeIndex > idx) {
                                              activeIndex--
                                          }
                                          pendingCloseIndex = -1
                                      }) { Text("Close", color = Color(0xFFEF9A9A)) }
                                  },
                                  dismissButton = {
                                      TextButton(onClick = { pendingCloseIndex = -1 }) { Text("Cancel") }
                                  },
                                  containerColor = Color(0xFF2A2A2A),
                                  titleContentColor = Color.White,
                                  textContentColor = Color.White
                              )
                          }
                      }

                      // Long-press menu for an item (Rename, Mark, Copy, Move, Delete + pending actions)
                      val ctx = contextTarget
                      if (ctx != null) {
                          val targets = targetsFor(ctx)
                          val multi = targets.size > 1
                          FileContextMenu(
                              title = if (multi) "${targets.size} items marked" else ctx.name,
                              isMarked = markedSet.contains(ctx.absolutePath),
                              cancelLabel = if (pending) cancelLabel else null,
                              pasteLabel = if (clipPaths.isNotEmpty() && tabs.getOrNull(activeIndex)?.dir != null) {
                                  if (clipMove) "Move here" else "Paste here"
                              } else null,
                              onRename = {
                                  contextTarget = null
                                  if (!readOnlyBlocked(listOf(ctx))) renameTarget = ctx
                              },
                              onMark = {
                                  toggleMark(ctx)
                                  contextTarget = null
                              },
                              onCopy = {
                                  clipPaths = targets
                                  clipMove = false
                                  marked.clear()
                                  contextTarget = null
                                  Toast.makeText(context, "${FileOps.items(targets.size)} ready to paste", Toast.LENGTH_SHORT).show()
                              },
                              onMove = {
                                  contextTarget = null
                                  if (!readOnlyBlocked(targets.map { File(it) })) {
                                      clipPaths = targets
                                      clipMove = true
                                      marked.clear()
                                      Toast.makeText(context, "${FileOps.items(targets.size)} ready to move", Toast.LENGTH_SHORT).show()
                                  }
                              },
                              onArchive = {
                                  contextTarget = null
                                  if (!archiveBlocked(tabs.getOrNull(activeIndex)?.dir)) zipTargets = targets
                              },
                              onDelete = {
                                  contextTarget = null
                                  if (!readOnlyBlocked(targets.map { File(it) })) deleteTargets = targets
                              },
                              onCancel = {
                                  cancelPending()
                                  contextTarget = null
                              },
                              onPaste = {
                                  contextTarget = null
                                  doPaste()
                              },
                              onDismiss = { contextTarget = null }
                          )
                      }

                      // Rename
                      val rt = renameTarget
                      if (rt != null) {
                          RenameDialog(
                              file = rt,
                              onConfirm = { newName ->
                                  val err = FileOps.rename(rt, newName)
                                  if (err != null) {
                                      Toast.makeText(context, err, Toast.LENGTH_SHORT).show()
                                  } else {
                                      marked.remove(rt.absolutePath)
                                      renameTarget = null
                                      afterFileOp()
                                      Toast.makeText(context, "Renamed", Toast.LENGTH_SHORT).show()
                                  }
                              },
                              onDismiss = { renameTarget = null }
                          )
                      }

                      // Delete with confirmation
                      val dt = deleteTargets
                      if (dt != null) {
                          AlertDialog(
                              onDismissRequest = { deleteTargets = null },
                              title = { Text("Delete?") },
                              text = {
                                  Text(
                                      if (dt.size == 1) "Delete \"${File(dt[0]).name}\"? This can't be undone."
                                      else "Delete ${dt.size} items? This can't be undone."
                                  )
                              },
                              confirmButton = {
                                  TextButton(onClick = {
                                      deleteTargets = null
                                      marked.clear()
                                      runOp("Deleting") { p -> FileOps.delete(dt, p) }
                                  }) { Text("Delete", color = Color(0xFFEF9A9A)) }
                              },
                              dismissButton = {
                                  TextButton(onClick = { deleteTargets = null }) { Text("Cancel") }
                              },
                              containerColor = Color(0xFF2A2A2A),
                              titleContentColor = Color.White,
                              textContentColor = Color.White
                          )
                      }

                      // Archive (Zip): name + optional password
                      val zt = zipTargets
                      if (zt != null) {
                          ArchiveDialog(
                              defaultName = if (zt.size == 1) File(zt[0]).let { f -> if (f.isDirectory) f.name else f.nameWithoutExtension.ifEmpty { f.name } } else "Archive",
                              onZip = { name, password ->
                                  zipTargets = null
                                  doZip(zt, name, password)
                              },
                              onDismiss = { zipTargets = null }
                          )
                      }

                      // Add New Folder (name pre-filled and selected)
                      if (newFolderOpen) {
                          NewFolderDialog(
                              onConfirm = { name ->
                                  val dir = tabs.getOrNull(activeIndex)?.dir
                                  when {
                                      dir == null -> newFolderOpen = false
                                      name.contains('/') -> Toast.makeText(context, "Name can't contain /", Toast.LENGTH_SHORT).show()
                                      File(dir, name).exists() -> Toast.makeText(context, "\"$name\" already exists", Toast.LENGTH_SHORT).show()
                                      File(dir, name).mkdir() -> {
                                          newFolderOpen = false
                                          afterFileOp()
                                          Toast.makeText(context, "Folder created", Toast.LENGTH_SHORT).show()
                                      }
                                      else -> Toast.makeText(context, "Could not create folder", Toast.LENGTH_SHORT).show()
                                  }
                              },
                              onDismiss = { newFolderOpen = false }
                          )
                      }

                      // Password for a protected archive
                      val ap = archivePrompt
                      if (ap != null) {
                          PasswordDialog(
                              title = ap.name,
                              wrong = archiveWrongPassword,
                              onConfirm = { pw ->
                                  archivePrompt = null
                                  openArchive(ap, pw)
                              },
                              onDismiss = { archivePrompt = null }
                          )
                      }

                      // Progress popup for every long task (copy, move, delete, zip, open archive)
                      val running = op
                      if (running != null) {
                          ProgressDialog(running)
                      }

                      // Bookmarks panel: opens and closes with no animation
                      BookmarksPanel(
                          visible = panelOpen,
                          listVersion = bookmarkListVersion,
                          onDismiss = { panelOpen = false },
                          onNavigateHome = {
                              tabs.getOrNull(activeIndex)?.dir = null
                              panelOpen = false
                          },
                          onNavigateTo = { path ->
                              tabs.getOrNull(activeIndex)?.dir = File(path)
                              panelOpen = false
                          },
                          onReorder = { newOrder ->
                              Bookmarks.reorder(context, newOrder)
                              bookmarkListVersion++
                          }
                      )
                  }
              }
              }
          }

          // CURRENT = bright white, BEFORE = muted (the path behind you), TRAIL = more muted (the
          // path ahead that you came back from, remembered until you open a different folder).
          enum class CrumbKind { BEFORE, CURRENT, TRAIL }

          class Crumb(val label: String, val kind: CrumbKind, val onClick: () -> Unit)

          fun activeBreadcrumbs(context: Context, tab: TabState?): List<Crumb> {
              if (tab == null) return emptyList()
              val dir = tab.dir
              val shown = tab.deepest ?: dir

              // label, folder it points to (null for Home), what a tap does
              val items = mutableListOf<Triple<String, File?, () -> Unit>>()
              items.add(Triple("Home", null, { tab.dir = null }))
              if (shown != null) {
                  val archiveRoot = ArchiveSupport.root(context)
                  val matchingRoot = StorageRoots.get(context).firstOrNull { shown.absolutePath.startsWith(it.second.absolutePath) }
                  if (ArchiveSupport.isInside(context, shown)) {
                      // Opened archive: Home / archive.zip / folder ... (the hidden cache path is not shown)
                      val parts = shown.absolutePath.removePrefix(archiveRoot.absolutePath + "/").split("/")
                      var acc = File(archiveRoot, parts[0])
                      parts.drop(1).forEach { segment ->
                          acc = File(acc, segment)
                          val target = acc
                          items.add(Triple(segment, target, { tab.dir = target }))
                      }
                  } else if (matchingRoot != null) {
                      val rootFile = matchingRoot.second
                      val relative = shown.absolutePath.removePrefix(rootFile.absolutePath).trim('/')
                      items.add(Triple(matchingRoot.first, rootFile, { tab.dir = rootFile }))
                      if (relative.isNotEmpty()) {
                          var acc = rootFile
                          relative.split("/").forEach { segment ->
                              acc = File(acc, segment)
                              val target = acc
                              items.add(Triple(segment, target, { tab.dir = target }))
                          }
                      }
                  } else {
                      items.add(Triple(shown.name, shown, { tab.dir = shown }))
                  }
              }

              val currentIdx = if (dir == null) {
                  0
              } else {
                  val found = items.indexOfFirst { it.second?.absolutePath == dir.absolutePath }
                  if (found < 0) items.lastIndex else found
              }
              return items.mapIndexed { i, item ->
                  val kind = when {
                      i < currentIdx -> CrumbKind.BEFORE
                      i == currentIdx -> CrumbKind.CURRENT
                      else -> CrumbKind.TRAIL
                  }
                  // Tapping a breadcrumb counts as entering that folder: it starts at the top
                  Crumb(item.first, kind, {
                      if (kind != CrumbKind.CURRENT) ScrollMemory.forceTop()
                      item.third()
                  })
              }
          }

          // Tabs: a thick white line slides under the current tab. The + sits on the same line as the titles.
          @Composable
          fun TabRow(
              context: Context,
              tabs: List<TabState>,
              activeIndex: Int,
              onSelect: (Int) -> Unit,
              onRequestClose: (Int) -> Unit,
              onSwipeAddTab: () -> Unit
          ) {
              val density = LocalDensity.current
              var swipeTotal by remember { mutableStateOf(0f) }
              // Position and width of each tab, in pixels, measured after layout
              val bounds = remember { mutableStateMapOf<Int, Pair<Float, Float>>() }
              val indicatorX = remember { Animatable(0f) }
              val indicatorW = remember { Animatable(0f) }
              val plusPressed = remember { mutableStateOf(false) }
              val tabScroll = rememberScrollState()
              var tabViewportPx by remember { mutableStateOf(0) }

              // Drop positions of tabs that were closed
              LaunchedEffect(tabs.size) {
                  bounds.keys.removeAll { it >= tabs.size }
              }

              // Keep the current tab visible: scroll the row so it sits in the middle.
              // Needed when many tabs are open (5, 8, more) and the current one would be off screen.
              val activeBounds = bounds[activeIndex]
              LaunchedEffect(activeIndex, activeBounds, tabViewportPx, tabs.size) {
                  val b = activeBounds ?: return@LaunchedEffect
                  val want = (b.first + b.second / 2f - tabViewportPx / 2f).roundToInt().coerceIn(0, tabScroll.maxValue)
                  tabScroll.animateScrollTo(want, tween(200))
              }

              val target = bounds[activeIndex]
              LaunchedEffect(target) {
                  if (target != null) {
                      launch { indicatorX.animateTo(target.first, tween(150)) }
                      launch { indicatorW.animateTo(target.second, tween(150)) }
                  }
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF232323))
                      .pointerInput(tabs.size) {
                          detectHorizontalDragGestures(
                              onDragStart = { swipeTotal = 0f },
                              onDragEnd = { if (swipeTotal < -120f) onSwipeAddTab() },
                              onHorizontalDrag = { change, dragAmount ->
                                  change.consume()
                                  swipeTotal += dragAmount
                              }
                          )
                      },
                  verticalAlignment = Alignment.Top
              ) {
                  Box(
                      modifier = Modifier
                          .weight(1f)
                          .onSizeChanged { tabViewportPx = it.width }
                          .horizontalScroll(tabScroll)
                  ) {
                      Row(verticalAlignment = Alignment.Top) {
                          tabs.forEachIndexed { index, tab ->
                              val selected = index == activeIndex
                              val titlePressed = remember { mutableStateOf(false) }
                              val closePressed = remember { mutableStateOf(false) }
                              Column(
                                  modifier = Modifier
                                      .widthIn(min = 96.dp)
                                      .onGloballyPositioned { coords ->
                                          bounds[index] = coords.positionInParent().x to coords.size.width.toFloat()
                                      }
                                      .padding(start = 12.dp, end = 4.dp, top = 8.dp)
                              ) {
                                  Row(
                                      modifier = Modifier.height(28.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      // Icon + title share one touch area. Icon: Home, phone (internal) or SD card (external).
                                      Row(
                                          modifier = Modifier
                                              .height(28.dp)
                                              .widthIn(min = 56.dp)
                                              .background(if (titlePressed.value) Color.White else Color.Transparent)
                                              .pressFlash(titlePressed) { onSelect(index) }
                                              .padding(horizontal = 4.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          val tabDir = tab.dir
                                          Icon(
                                              imageVector = when {
                                                  tabDir == null -> Icons.Filled.Home
                                                  isInternalPath(context, tabDir.absolutePath) -> Icons.Filled.PhoneAndroid
                                                  else -> Icons.Filled.SdCard
                                              },
                                              contentDescription = null,
                                              tint = if (titlePressed.value) Color.Black else if (selected) Color(0xFF90CAF9) else Color(0xFF6E8FA3),
                                              modifier = Modifier.size(15.dp)
                                          )
                                          Spacer(Modifier.width(5.dp))
                                          Text(
                                              text = tabTitle(context, tab.dir),
                                              color = if (titlePressed.value) Color.Black else if (selected) Color.White else Color(0xFF9A9A9A),
                                              fontSize = 13.sp,
                                              fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis,
                                              modifier = Modifier.widthIn(max = 120.dp)
                                          )
                                      }
                                      Spacer(Modifier.width(6.dp))
                                      // Larger tap area for the x, so it is hard to hit by accident
                                      Box(
                                          modifier = Modifier
                                              .size(32.dp)
                                              .background(if (closePressed.value) Color.White else Color.Transparent)
                                              .pressFlash(closePressed) { onRequestClose(index) },
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Icon(
                                              imageVector = Icons.Filled.Close,
                                              contentDescription = "Close tab",
                                              tint = if (closePressed.value) Color.Black else Color(0xFF9A9A9A),
                                              modifier = Modifier.size(16.dp)
                                          )
                                      }
                                  }
                                  Spacer(Modifier.height(6.dp))
                              }
                          }
                      }

                      // Sliding indicator under the current tab
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomStart)
                              .offset { IntOffset(indicatorX.value.roundToInt(), 0) }
                              .width(with(density) { indicatorW.value.toDp() })
                              .height(4.dp)
                              .background(Color.White)
                      )
                  }

                  // + button on the same line as the tab titles
                  Box(
                      modifier = Modifier
                          .padding(top = 8.dp)
                          .height(28.dp)
                          .background(if (plusPressed.value) Color.White else Color.Transparent)
                          .pressFlash(plusPressed) { onSwipeAddTab() }
                          .padding(horizontal = 10.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          imageVector = Icons.Filled.Add,
                          contentDescription = "New tab",
                          tint = if (plusPressed.value) Color.Black else Color(0xFF90CAF9),
                          modifier = Modifier.size(22.dp)
                      )
                  }
              }
          }

          @Composable
          fun PermissionScreen(onGrant: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxSize(),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("Storage permission required", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(8.dp))
                  Text("Grant access to browse files", color = Color.White.copy(alpha = 0.7f), fontSize = 16.sp)
                  Spacer(Modifier.height(24.dp))
                  Button(onClick = onGrant, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1565C0))) {
                      Text("Grant Access", color = Color.White, fontSize = 16.sp)
                  }
              }
          }

          // =====================================================================
          // PRESS FEEDBACK: white background + black text while a finger is down.
          // NOTE FOR FUTURE: use pressFlash() on EVERY tappable area (rows, buttons, icons)
          // instead of clickable(), so the effect is the same everywhere.
          // - It appears after 60 ms of holding, so scrolling does not flash.
          // - A short tap is held visible for 140 ms, so quick taps also show it.
          // Plain clickable() delays or skips the press state on quick taps, which is why it is not used.
          // =====================================================================
          @Composable
          fun Modifier.pressFlash(pressed: MutableState<Boolean>, onClick: () -> Unit): Modifier {
              val currentClick by rememberUpdatedState(onClick)
              return this.pointerInput(Unit) {
                  detectTapGestures(
                      onPress = {
                          coroutineScope {
                              val showJob = launch {
                                  delay(60)
                                  pressed.value = true
                              }
                              val released = tryAwaitRelease()
                              showJob.cancel()
                              if (released) {
                                  pressed.value = true
                                  delay(140)
                              }
                              pressed.value = false
                          }
                      },
                      onTap = { currentClick() }
                  )
              }
          }

          // Same as pressFlash but also reports a long press (used by file rows)
          @Composable
          fun Modifier.pressFlashLong(pressed: MutableState<Boolean>, onLongClick: () -> Unit, onClick: () -> Unit): Modifier {
              val currentClick by rememberUpdatedState(onClick)
              val currentLong by rememberUpdatedState(onLongClick)
              return this.pointerInput(Unit) {
                  detectTapGestures(
                      onPress = {
                          coroutineScope {
                              val showJob = launch {
                                  delay(60)
                                  pressed.value = true
                              }
                              val released = tryAwaitRelease()
                              showJob.cancel()
                              if (released) {
                                  pressed.value = true
                                  delay(140)
                              }
                              pressed.value = false
                          }
                      },
                      onLongPress = { currentLong() },
                      onTap = { currentClick() }
                  )
              }
          }

          // True on every other half second while something is marked / waiting to paste.
          // Used by rows that should pulse (white background, black text).
          @Composable
          fun rememberPulseOn(enabled: Boolean): Boolean {
              val pulse = LocalPulse.current
              return enabled && pulse?.value == true
          }

          // Icon button with a 40 dp touch area and the press effect
          @Composable
          fun IconFlashButton(
              icon: ImageVector,
              description: String,
              boxSize: Dp = 40.dp,
              iconSize: Dp = 26.dp,
              pulse: Boolean = false,
              onClick: () -> Unit
          ) {
              val pressedState = remember { mutableStateOf(false) }
              val pulseOn = rememberPulseOn(pulse)
              val pressed = remember(pulseOn) { derivedStateOf { pressedState.value || pulseOn } }
              Box(
                  modifier = Modifier
                      .size(boxSize)
                      .clip(CircleShape)
                      .background(if (pressed.value) Color.White else Color.Transparent)
                      .pressFlash(pressedState, onClick),
                  contentAlignment = Alignment.Center
              ) {
                  Icon(
                      imageVector = icon,
                      contentDescription = description,
                      tint = if (pressed.value) Color.Black else Color.White,
                      modifier = Modifier.size(iconSize)
                  )
              }
          }

          // One breadcrumb segment with a bigger touch area and the press effect.
          // Current folder = bright white, the rest = muted (like the size and date text).
          @Composable
          fun BreadcrumbText(label: String, kind: CrumbKind, modifier: Modifier = Modifier, onClick: () -> Unit) {
              val pressed = remember { mutableStateOf(false) }
              val base = when (kind) {
                  CrumbKind.CURRENT -> Color.White
                  CrumbKind.BEFORE -> Color.White.copy(alpha = 0.75f)
                  CrumbKind.TRAIL -> Color.White.copy(alpha = 0.32f)
              }
              Text(
                  text = label,
                  color = if (pressed.value) Color.Black else base,
                  fontWeight = if (kind == CrumbKind.CURRENT) FontWeight.Bold else FontWeight.Normal,
                  fontSize = 14.4.sp,
                  maxLines = 1,
                  modifier = modifier
                      .background(if (pressed.value) Color.White else Color.Transparent)
                      .pressFlash(pressed, onClick)
                      .padding(horizontal = 3.dp, vertical = 8.dp)
              )
          }

          // Header: 10% taller than before. Icons and breadcrumbs 20% bigger.
          @Composable
          fun ScreenHeader(
              breadcrumbs: List<Crumb>,
              onOpenPanel: () -> Unit,
              menuOpen: Boolean,
              onMenuToggle: () -> Unit,
              onMenuDismiss: () -> Unit,
              menuPulse: Boolean = false,
              menuContent: (@Composable (closeMenu: () -> Unit) -> Unit)? = null
          ) {
              val scrollState = rememberScrollState()
              var viewportPx by remember { mutableStateOf(0) }
              // Position and width of each breadcrumb, in pixels, measured after layout
              val crumbBounds = remember { mutableStateMapOf<Int, Pair<Float, Float>>() }

              // Keep the current folder visible: scroll so it sits in the middle (like the tabs)
              val currentIdx = breadcrumbs.indexOfFirst { it.kind == CrumbKind.CURRENT }.coerceAtLeast(0)
              val currentBounds = crumbBounds[currentIdx]
              LaunchedEffect(currentIdx, currentBounds, viewportPx, breadcrumbs.size) {
                  val b = currentBounds ?: return@LaunchedEffect
                  val want = (b.first + b.second / 2f - viewportPx / 2f).roundToInt().coerceIn(0, scrollState.maxValue)
                  scrollState.animateScrollTo(want, tween(200))
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF2A2A2A))
                      .padding(horizontal = 5.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  IconFlashButton(Icons.Filled.List, "Bookmarks") { onOpenPanel() }
                  Spacer(Modifier.width(5.dp))

                  Row(
                      modifier = Modifier
                          .weight(1f)
                          .onSizeChanged { viewportPx = it.width }
                          .horizontalScroll(scrollState),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      breadcrumbs.forEachIndexed { index, crumb ->
                          if (index > 0) {
                              Text(
                                  text = " / ",
                                  color = Color.White.copy(alpha = if (crumb.kind == CrumbKind.TRAIL) 0.25f else 0.6f),
                                  fontSize = 14.4.sp
                              )
                          }
                          BreadcrumbText(
                              label = crumb.label,
                              kind = crumb.kind,
                              modifier = Modifier.onGloballyPositioned { c ->
                                  crumbBounds[index] = c.positionInParent().x to c.size.width.toFloat()
                              },
                              onClick = crumb.onClick
                          )
                      }
                  }

                  if (menuContent != null) {
                      Spacer(Modifier.width(8.dp))
                      Box {
                          IconFlashButton(Icons.Filled.MoreVert, "Menu", pulse = menuPulse) { onMenuToggle() }
                          if (menuOpen) {
                              // Full-screen scrim: any touch outside the menu closes it
                              Popup(
                                  onDismissRequest = onMenuDismiss,
                                  properties = PopupProperties(focusable = true, dismissOnBackPress = true, dismissOnClickOutside = true)
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .clickable(
                                              interactionSource = remember { MutableInteractionSource() },
                                              indication = null,
                                              onClick = onMenuDismiss
                                          ),
                                  ) {
                                      Column(
                                          modifier = Modifier
                                              .align(Alignment.TopEnd)
                                              .padding(top = 56.dp, end = 8.dp)
                                              .width(220.dp)
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(Color(0xFF333333))
                                              .padding(vertical = 4.dp)
                                              .clickable(
                                                  interactionSource = remember { MutableInteractionSource() },
                                                  indication = null,
                                                  onClick = {}
                                              )
                                      ) {
                                          menuContent.invoke(onMenuDismiss)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // =====================================================================
          // NOTE FOR FUTURE: every row in the top-right menu MUST be a MenuRow.
          // MenuRow is full width with the same minimum height, so every touch area
          // is the same size, even for short text like "Sort" or "Save tabs".
          // Do NOT use a bare Text with clickable here: its touch area would only
          // be as big as the text.
          // =====================================================================
          @Composable
          // dot = true shows a small white notification-style dot at the right end (pending actions)
          fun MenuRow(text: String, dot: Boolean = false, onClick: () -> Unit) {
              val pressed = remember { mutableStateOf(false) }
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .heightIn(min = 48.dp)
                      .background(if (pressed.value) Color.White else Color.Transparent)
                      .pressFlash(pressed, onClick)
                      .padding(horizontal = 16.dp),
                  contentAlignment = Alignment.CenterStart
              ) {
                  Text(
                      text = text,
                      color = if (pressed.value) Color.Black else Color.White,
                      fontSize = 14.sp
                  )
                  if (dot) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterEnd)
                              .size(9.dp)
                              .clip(CircleShape)
                              .background(if (pressed.value) Color.Black else Color.White)
                      )
                  }
              }
          }

          // Skeleton placeholder rows with a soft pulse while content loads
          @Composable
          fun SkeletonRows(count: Int, rowHeight: Dp) {
              val transition = rememberInfiniteTransition(label = "shimmer")
              val alpha by transition.animateFloat(
                  initialValue = 0.15f,
                  targetValue = 0.35f,
                  animationSpec = infiniteRepeatable(tween(900), RepeatMode.Reverse),
                  label = "shimmerAlpha"
              )
              val block = Color.White.copy(alpha = alpha)
              Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp)) {
                  repeat(count) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = rowHeight)
                              .padding(vertical = 6.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(Modifier.size(42.dp).clip(RoundedCornerShape(8.dp)).background(block))
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Box(Modifier.fillMaxWidth(0.7f).height(12.dp).clip(RoundedCornerShape(4.dp)).background(block))
                              Spacer(Modifier.height(6.dp))
                              Box(Modifier.fillMaxWidth(0.4f).height(9.dp).clip(RoundedCornerShape(4.dp)).background(block))
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen(
              refreshKey: Int,
              onRefresh: () -> Unit,
              onRootClick: (File) -> Unit
          ) {
              val context = LocalContext.current
              var refreshing by remember { mutableStateOf(false) }
              val roots = remember(refreshKey) { StorageRoots.get(context) }

              LaunchedEffect(refreshKey) {
                  if (refreshing) {
                      delay(400)
                      refreshing = false
                  }
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      refreshing = true
                      onRefresh()
                  },
                  modifier = Modifier.fillMaxSize()
              ) {
                  if (roots.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("No storage found", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(vertical = 8.dp)
                      ) {
                          items(roots) { (label, root) ->
                              TappableRow(onClick = { onRootClick(root) }) {
                                  Icon(
                                      imageVector = if (label == "Internal Storage") Icons.Filled.PhoneAndroid else Icons.Filled.SdCard,
                                      contentDescription = label,
                                      tint = Color(0xFF90CAF9),
                                      modifier = Modifier.size(56.dp)
                                  )
                                  Spacer(Modifier.width(16.dp))
                                  Column {
                                      Text(text = label, fontSize = 16.sp, fontWeight = FontWeight.Medium)
                                      // Total, free and free percentage. Read in the background (SD cards can be slow).
                                      val stats by produceState<Pair<Long, Long>?>(
                                          initialValue = null,
                                          key1 = root.absolutePath,
                                          key2 = refreshKey
                                      ) {
                                          value = withContext(Dispatchers.IO) {
                                              try {
                                                  val s = StatFs(root.absolutePath)
                                                  s.totalBytes to s.availableBytes
                                              } catch (e: Exception) { null }
                                          }
                                      }
                                      val info = stats
                                      val infoText = if (info == null) {
                                          "Reading storage..."
                                      } else {
                                          val total = info.first
                                          val free = info.second
                                          val pct = if (total > 0) (free * 100 / total).toInt() else 0
                                          "${formatSize(total)} total · ${formatSize(free)} free ($pct%)"
                                      }
                                      Text(
                                          text = infoText,
                                          color = androidx.compose.material3.LocalContentColor.current.copy(alpha = 0.55f),
                                          fontSize = 12.sp,
                                          maxLines = 1
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TappableRow(onClick: () -> Unit, content: @Composable RowScope.() -> Unit) {
              val pressed = remember { mutableStateOf(false) }
              val bg = if (pressed.value) Color.White else Color.Transparent

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(bg)
                      .pressFlash(pressed, onClick)
                      .padding(horizontal = 16.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  CompositionLocalProvider(androidx.compose.material3.LocalContentColor provides if (pressed.value) Color.Black else Color.White) {
                      content()
                  }
              }
          }

          // File list: edge to edge, 15 rows fill the screen at minimum height,
          // rows grow up to 3 name lines. Shows skeleton rows while loading.
          // Uses the memory cache first, so revisiting a folder is instant.
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FileListScreen(
              directory: File,
              sortMode: SortMode,
              refreshKey: Int,
              marked: Set<String>,
              onToggleMark: (File) -> Unit,
              onLongPress: (File) -> Unit,
              onNavigate: (File) -> Unit,
              onOpenArchive: (File) -> Unit,
              onOpenText: (File) -> Unit,
              onExtract: (files: List<File>, then: () -> Unit) -> Unit,
              onOpenImage: (images: List<File>, index: Int) -> Unit
          ) {
              val context = LocalContext.current
              val haptic = LocalHapticFeedback.current

              // Each folder gets its own scroll state: it starts at the top, except when coming back
              // from opening a file (image, zip, ...), then it returns to the remembered position
              val dirPath = directory.absolutePath
              val listState = remember(dirPath) {
                  val s = ScrollMemory.take(dirPath)
                  if (s != null) LazyListState(s[0], s[1]) else LazyListState()
              }
              LaunchedEffect(listState, dirPath) {
                  snapshotFlow { listState.firstVisibleItemIndex to listState.firstVisibleItemScrollOffset }
                      .collect { (i, o) -> ScrollMemory.save(dirPath, i, o) }
              }
              var loadKey by remember { mutableStateOf(0) }
              var refreshing by remember { mutableStateOf(false) }
              var listing by remember(directory) { mutableStateOf(DirCache.get(directory.absolutePath)) }

              // Read in the background; the cached copy (if any) stays on screen until the fresh one arrives
              LaunchedEffect(directory, loadKey, refreshKey) {
                  val fresh = withContext(Dispatchers.IO) {
                      Listing(readEntries(directory)).also { DirCache.put(directory.absolutePath, it) }
                  }
                  listing = fresh
              }

              LaunchedEffect(listing) {
                  if (listing != null) refreshing = false
              }

              // Preload the first few sub-folders so opening them is faster
              LaunchedEffect(listing) {
                  val subs = listing?.entries?.filter { it.isDir }?.take(3) ?: emptyList()
                  subs.forEach { e ->
                      withContext(Dispatchers.IO) {
                          if (DirCache.get(e.file.absolutePath) == null) {
                              DirCache.put(e.file.absolutePath, Listing(readEntries(e.file)))
                          }
                      }
                  }
              }

              val sorted = remember(listing, sortMode) {
                  listing?.let { sortEntries(it.entries, sortMode) }
              }
              val inArchiveDir = remember(dirPath) { ArchiveSupport.isVirtualPath(dirPath) }
              val imagesInDir = remember(sorted) {
                  sorted?.filter { !it.isDir && ThumbnailCache.isImage(it.name) }?.map { it.file } ?: emptyList()
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      refreshing = true
                      loadKey++
                  },
                  modifier = Modifier.fillMaxSize()
              ) {
                  BoxWithConstraints(Modifier.fillMaxSize()) {
                      val rowMin: Dp = maxHeight / 15

                      if (sorted == null) {
                          SkeletonRows(count = 15, rowHeight = rowMin)
                      } else if (sorted.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("Empty folder", color = Color.White, fontSize = 16.sp)
                          }
                      } else {
                          LazyColumn(modifier = Modifier.fillMaxSize(), state = listState) {
                              items(sorted, key = { it.file.absolutePath }) { entry ->
                                  FileRow(
                                      entry = entry,
                                      rowMinHeight = rowMin,
                                      modifier = Modifier.animateItem(),
                                      marked = marked.contains(entry.file.absolutePath),
                                      onLongClick = {
                                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                          onLongPress(entry.file)
                                      },
                                      onClick = {
                                          // Opening (not selecting while items are marked) leaves the faint highlight on this row
                                          // (inside an opened archive the highlight stays on the zip itself)
                          if (marked.isEmpty() && !ArchiveSupport.isInside(context, directory)) LastOpened.path = entry.file.absolutePath
                                          when {
                                              // While items are marked, a tap toggles the mark (multi-select)
                                              marked.isNotEmpty() -> onToggleMark(entry.file)
                                              entry.isDir -> {
                                                  // Opening a folder: forget any pending "go back to position"
                                                  if (!ArchiveSupport.isInside(context, directory)) ScrollMemory.clearRestore()
                                                  onNavigate(entry.file)
                                              }
                                              ThumbnailCache.isImage(entry.name) -> {
                                                  ScrollMemory.markRestore(directory.absolutePath)
                                                  if (inArchiveDir) {
                                                      // Archive: extract this folder's pictures (if not huge) so swiping works
                                                      val imgSize = sorted.filter { !it.isDir && ThumbnailCache.isImage(it.name) }.sumOf { it.size }
                                                      val list = if (imgSize <= 100L * 1024 * 1024) imagesInDir else listOf(entry.file)
                                                      val i = list.indexOf(entry.file).coerceAtLeast(0)
                                                      onExtract(list) { onOpenImage(list, i) }
                                                  } else {
                                                      val idx = imagesInDir.indexOf(entry.file).coerceAtLeast(0)
                                                      onOpenImage(imagesInDir, idx)
                                                  }
                                              }
                                              ArchiveSupport.isArchiveName(entry.name) -> {
                                                  ScrollMemory.markRestore(directory.absolutePath)
                                                  if (inArchiveDir) onExtract(listOf(entry.file)) { onOpenArchive(entry.file) }
                                                  else onOpenArchive(entry.file)
                                              }
                                              else -> {
                                                  ScrollMemory.markRestore(directory.absolutePath)
                                                  val openIt = {
                                                      if (TextFiles.canEdit(entry.file)) onOpenText(entry.file) else openFile(context, entry.file)
                                                  }
                                                  // A file inside an archive is extracted just now, when you open it
                                                  if (inArchiveDir) onExtract(listOf(entry.file)) { openIt() } else openIt()
                                              }
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          // Folders always use the same amber folder icon. Only image and video files show a thumbnail.
          @Composable
          fun FileThumbBox(isDirectory: Boolean, thumb: Bitmap?, folderThumb: Bitmap? = null) {
              Box(
                  modifier = Modifier
                      .size(42.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(if (isDirectory) Color(0xFF3A3A3A) else Color.Transparent),
                  contentAlignment = Alignment.Center
              ) {
                  if (thumb != null && !isDirectory) {
                      Image(
                          bitmap = thumb.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else if (isDirectory) {
                      Icon(
                          imageVector = Icons.Filled.Folder,
                          contentDescription = "Folder",
                          tint = Color(0xFFE0B04F),
                          modifier = Modifier.size(28.dp)
                      )
                      // Small preview badge on the bottom-right corner
                      if (folderThumb != null) {
                          Image(
                              bitmap = folderThumb.asImageBitmap(),
                              contentDescription = null,
                              contentScale = ContentScale.Crop,
                              modifier = Modifier
                                  .align(Alignment.BottomEnd)
                                  .size(20.dp)
                                  .clip(RoundedCornerShape(4.dp))
                                  .background(Color.White)
                                  .padding(1.dp)
                                  .clip(RoundedCornerShape(3.dp))
                          )
                      }
                  } else {
                      Icon(
                          imageVector = Icons.Filled.InsertDriveFile,
                          contentDescription = null,
                          tint = Color(0xFFB0BEC5),
                          modifier = Modifier.size(26.dp)
                      )
                  }
              }
          }

          // One row: thumb | name (up to 3 lines) above size (left) and date (right) | optional Copy pill
          @Composable
          fun FileRow(
              entry: Entry,
              rowMinHeight: Dp,
              modifier: Modifier = Modifier,
              marked: Boolean = false,
              onLongClick: () -> Unit = {},
              onClick: () -> Unit
          ) {
              val context = LocalContext.current
              val file = entry.file
              // Files inside an archive are not extracted yet, so there is nothing to preview
              val inArchive = ArchiveSupport.isVirtualPath(file.absolutePath)
              val hasFileThumb = !inArchive && !entry.isDir && (ThumbnailCache.isImage(entry.name) || ThumbnailCache.isVideo(entry.name))
              val muted = Color.White.copy(alpha = 0.55f)

              val thumb by produceState<Bitmap?>(initialValue = null, key1 = file.absolutePath, key2 = entry.modified) {
                  value = if (hasFileThumb) ThumbnailCache.getThumbnail(context, file, entry.modified) else null
              }

              val folderThumb by produceState<Bitmap?>(initialValue = null, key1 = file.absolutePath, key2 = entry.modified) {
                  value = if (entry.isDir && !inArchive) ThumbnailCache.getFolderThumbnail(context, file) else null
              }

              // Folder item counts come from a background read, remembered after the first time
              val folderCount by produceState<Int?>(initialValue = if (entry.isDir) FolderCount.cached(file.absolutePath) else null, key1 = file.absolutePath) {
                  if (entry.isDir && value == null) {
                      value = withContext(Dispatchers.IO) { FolderCount.load(file) }
                  }
              }

              val sizeText = if (entry.isDir) {
                  folderCount?.let { "$it items" } ?: "Folder"
              } else {
                  formatSize(entry.size)
              }

              val pressedState = remember { mutableStateOf(false) }
              // Marked rows stay white background + black text (static, no pulsing)
              val pressed = pressedState.value || marked
              // Faint highlight for the last opened item; its size/date text is brighter so it stays readable
              // It follows the trail: the opened item itself AND every folder on the way to it
              val lp = LastOpened.path
              val lastOpened = !pressed && lp != null &&
                  (lp == file.absolutePath || (entry.isDir && lp.startsWith(file.absolutePath + "/")))
              val secondary = when {
                  pressed -> Color.Black.copy(alpha = 0.6f)
                  lastOpened -> Color.White.copy(alpha = 0.8f)
                  else -> muted
              }
              val copyPressed = remember { mutableStateOf(false) }

              Row(
                  modifier = modifier
                      .fillMaxWidth()
                      .heightIn(min = rowMinHeight)
                      .background(
                          when {
                              pressed -> Color.White
                              lastOpened -> Color.White.copy(alpha = 0.12f)
                              else -> Color.Transparent
                          }
                      )
                      .pressFlashLong(pressedState, onLongClick, onClick)
                      .padding(horizontal = 8.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  FileThumbBox(isDirectory = entry.isDir, thumb = thumb, folderThumb = folderThumb)
                  Spacer(Modifier.width(12.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          text = entry.name,
                          color = if (pressed) Color.Black else Color.White,
                          fontSize = 15.sp,
                          maxLines = 3,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(2.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(
                              text = sizeText,
                              color = secondary,
                              fontSize = 11.sp,
                              maxLines = 1
                          )
                          Text(
                              text = formatDate(entry.modified),
                              color = secondary,
                              fontSize = 11.sp,
                              maxLines = 1
                          )
                      }
                  }

                  // Copy pill for text-based files: copies the whole content, no opening needed
                  if (!entry.isDir && !inArchive && isTextName(entry.name)) {
                      Spacer(Modifier.width(8.dp))
                      Box(
                          modifier = Modifier
                              .clip(CircleShape)
                              .background(if (copyPressed.value || pressed) Color.Black else Color.White)
                              .pressFlash(copyPressed) { copyFileContent(context, file) }
                              .padding(horizontal = 12.dp, vertical = 6.dp)
                      ) {
                          Text("Copy", color = if (copyPressed.value || pressed) Color.White else Color.Black, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      }
                  }
              }
          }

          // Long-press menu. Normal rows use MenuRow (same touch area). The pending rows
          // (Cancel, Paste here / Move here) pulse white bg / black text every second.
          @Composable
          fun FileContextMenu(
              title: String,
              isMarked: Boolean,
              cancelLabel: String?,
              pasteLabel: String?,
              onRename: () -> Unit,
              onMark: () -> Unit,
              onCopy: () -> Unit,
              onMove: () -> Unit,
              onArchive: () -> Unit,
              onDelete: () -> Unit,
              onCancel: () -> Unit,
              onPaste: () -> Unit,
              onDismiss: () -> Unit
          ) {
              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(14.dp))
                          .background(Color(0xFF2A2A2A))
                          .padding(vertical = 6.dp)
                  ) {
                      Text(
                          text = title,
                          color = Color.White,
                          fontWeight = FontWeight.Bold,
                          fontSize = 16.sp,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis,
                          modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)
                      )
                      Box(Modifier.fillMaxWidth().height(1.dp).background(Color.White.copy(alpha = 0.15f)))
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          if (cancelLabel != null) MenuRow(text = cancelLabel, dot = true) { onCancel() }
                          if (pasteLabel != null) MenuRow(text = pasteLabel, dot = true) { onPaste() }
                          MenuRow(text = "Rename") { onRename() }
                          MenuRow(text = if (isMarked) "Unmark" else "Mark") { onMark() }
                          MenuRow(text = "Copy") { onCopy() }
                          MenuRow(text = "Move") { onMove() }
                          MenuRow(text = "Archive (Zip)") { onArchive() }
                          MenuRow(text = "Delete") { onDelete() }
                      }
                  }
              }
          }

          @Composable
          fun RenameDialog(file: File, onConfirm: (String) -> Unit, onDismiss: () -> Unit) {
              var text by remember { mutableStateOf(file.name) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = Color(0xFF2A2A2A),
                  title = { Text("Rename", color = Color.White) },
                  text = {
                      OutlinedTextField(
                          value = text,
                          onValueChange = { text = it },
                          singleLine = true,
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedTextColor = Color.White,
                              unfocusedTextColor = Color.White,
                              cursorColor = Color.White,
                              focusedBorderColor = Color.White,
                              unfocusedBorderColor = Color.White.copy(alpha = 0.5f)
                          )
                      )
                  },
                  confirmButton = {
                      TextButton(onClick = { onConfirm(text.trim()) }) { Text("OK", color = Color.White) }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("Cancel", color = Color.White) }
                  }
              )
          }

          @Composable
          fun fieldColors() = OutlinedTextFieldDefaults.colors(
              focusedTextColor = Color.White,
              unfocusedTextColor = Color.White,
              cursorColor = Color.White,
              focusedBorderColor = Color.White,
              unfocusedBorderColor = Color.White.copy(alpha = 0.5f),
              focusedPlaceholderColor = Color.White.copy(alpha = 0.4f),
              unfocusedPlaceholderColor = Color.White.copy(alpha = 0.4f)
          )

          // Big dialog button with the same press effect as everything else. primary = white pill.
          @Composable
          fun DialogButton(text: String, modifier: Modifier = Modifier, primary: Boolean = false, onClick: () -> Unit) {
              val pressed = remember { mutableStateOf(false) }
              val inverted = pressed.value != primary
              Box(
                  modifier = modifier
                      .heightIn(min = 48.dp)
                      .clip(RoundedCornerShape(10.dp))
                      .background(if (inverted) Color.White else Color.Transparent)
                      .pressFlash(pressed, onClick),
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      text = text,
                      color = if (inverted) Color.Black else Color.White,
                      fontSize = 14.sp,
                      fontWeight = FontWeight.SemiBold
                  )
              }
          }

          // =====================================================================
          // REUSABLE PROGRESS POPUP (see OpProgress). Same look as the long-press menu.
          // Not dismissable: the only way out is the Cancel button or the task finishing.
          // =====================================================================
          @Composable
          fun ProgressDialog(p: OpProgress) {
              Dialog(
                  onDismissRequest = {},
                  properties = DialogProperties(dismissOnBackPress = false, dismissOnClickOutside = false)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(14.dp))
                          .background(Color(0xFF2A2A2A))
                          .padding(16.dp)
                  ) {
                      Text(
                          text = p.title,
                          color = Color.White,
                          fontWeight = FontWeight.Bold,
                          fontSize = 16.sp,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(4.dp))
                      Text(
                          text = p.detail.ifEmpty { "Working..." },
                          color = Color.White.copy(alpha = 0.6f),
                          fontSize = 13.sp,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(14.dp))
                      val f = p.fraction
                      if (f == null) {
                          LinearProgressIndicator(
                              modifier = Modifier.fillMaxWidth().height(6.dp).clip(CircleShape),
                              color = Color.White,
                              trackColor = Color.White.copy(alpha = 0.2f)
                          )
                      } else {
                          LinearProgressIndicator(
                              progress = { f },
                              modifier = Modifier.fillMaxWidth().height(6.dp).clip(CircleShape),
                              color = Color.White,
                              trackColor = Color.White.copy(alpha = 0.2f)
                          )
                          Spacer(Modifier.height(6.dp))
                          Text(
                              text = "${(f * 100).toInt()}%",
                              color = Color.White.copy(alpha = 0.6f),
                              fontSize = 12.sp,
                              modifier = Modifier.align(Alignment.End)
                          )
                      }
                      Spacer(Modifier.height(8.dp))
                      DialogButton(text = "Cancel", modifier = Modifier.fillMaxWidth()) { p.cancelled.set(true) }
                  }
              }
          }

