          // Skeleton placeholder rows with a soft pulse while content loads
          @Composable
          fun SkeletonRows(count: Int, rowHeight: Dp) {
              val transition = rememberInfiniteTransition(label = "shimmer")
              val alpha by transition.animateFloat(
                  initialValue = 0.15f,
                  targetValue = 0.35f,
                  animationSpec = infiniteRepeatable(tween(900), RepeatMode.Reverse),
                  label = "shimmerAlpha"
              )
              val block = Color.White.copy(alpha = alpha)
              Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp)) {
                  repeat(count) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = rowHeight)
                              .padding(vertical = 6.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(Modifier.size(42.dp).clip(RoundedCornerShape(8.dp)).background(block))
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Box(Modifier.fillMaxWidth(0.7f).height(12.dp).clip(RoundedCornerShape(4.dp)).background(block))
                              Spacer(Modifier.height(6.dp))
                              Box(Modifier.fillMaxWidth(0.4f).height(9.dp).clip(RoundedCornerShape(4.dp)).background(block))
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen(
              refreshKey: Int,
              onRefresh: () -> Unit,
              onRootClick: (File) -> Unit
          ) {
              val context = LocalContext.current
              var refreshing by remember { mutableStateOf(false) }
              val roots = remember(refreshKey) { StorageRoots.get(context) }

              LaunchedEffect(refreshKey) {
                  if (refreshing) {
                      delay(400)
                      refreshing = false
                  }
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      refreshing = true
                      onRefresh()
                  },
                  modifier = Modifier.fillMaxSize()
              ) {
                  if (roots.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("No storage found", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(vertical = 8.dp)
                      ) {
                          items(roots) { (label, root) ->
                              TappableRow(onClick = { onRootClick(root) }) {
                                  Icon(
                                      imageVector = if (label == "Internal Storage") Icons.Filled.PhoneAndroid else Icons.Filled.SdCard,
                                      contentDescription = label,
                                      tint = Color(0xFF90CAF9),
                                      modifier = Modifier.size(56.dp)
                                  )
                                  Spacer(Modifier.width(16.dp))
                                  Column {
                                      Text(text = label, fontSize = 16.sp, fontWeight = FontWeight.Medium)
                                      // Total, free and free percentage. Read in the background (SD cards can be slow).
                                      val stats by produceState<Pair<Long, Long>?>(
                                          initialValue = null,
                                          key1 = root.absolutePath,
                                          key2 = refreshKey
                                      ) {
                                          value = withContext(Dispatchers.IO) {
                                              try {
                                                  val s = StatFs(root.absolutePath)
                                                  s.totalBytes to s.availableBytes
                                              } catch (e: Exception) { null }
                                          }
                                      }
                                      val info = stats
                                      val infoText = if (info == null) {
                                          "Reading storage..."
                                      } else {
                                          val total = info.first
                                          val free = info.second
                                          val pct = if (total > 0) (free * 100 / total).toInt() else 0
                                          "${formatSize(total)} total · ${formatSize(free)} free ($pct%)"
                                      }
                                      Text(
                                          text = infoText,
                                          color = androidx.compose.material3.LocalContentColor.current.copy(alpha = 0.55f),
                                          fontSize = 12.sp,
                                          maxLines = 1
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TappableRow(onClick: () -> Unit, content: @Composable RowScope.() -> Unit) {
              val pressed = remember { mutableStateOf(false) }
              val bg = if (pressed.value) Color.White else Color.Transparent

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(bg)
                      .pressFlash(pressed, onClick)
                      .padding(horizontal = 16.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  CompositionLocalProvider(androidx.compose.material3.LocalContentColor provides if (pressed.value) Color.Black else Color.White) {
                      content()
                  }
              }
          }

          // File list: edge to edge, 15 rows fill the screen at minimum height,
          // rows grow up to 3 name lines. Shows skeleton rows while loading.
          // Uses the memory cache first, so revisiting a folder is instant.
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FileListScreen(
              directory: File,
              sortMode: SortMode,
              refreshKey: Int,
              marked: Set<String>,
              onToggleMark: (File) -> Unit,
              onLongPress: (File) -> Unit,
              onNavigate: (File) -> Unit,
              onOpenImage: (images: List<File>, index: Int) -> Unit
          ) {
              val context = LocalContext.current
              val haptic = LocalHapticFeedback.current
              var loadKey by remember { mutableStateOf(0) }
              var refreshing by remember { mutableStateOf(false) }
              var listing by remember(directory) { mutableStateOf(DirCache.get(directory.absolutePath)) }

              // Read in the background; the cached copy (if any) stays on screen until the fresh one arrives
              LaunchedEffect(directory, loadKey, refreshKey) {
                  val fresh = withContext(Dispatchers.IO) {
                      Listing(readEntries(directory)).also { DirCache.put(directory.absolutePath, it) }
                  }
                  listing = fresh
              }

              LaunchedEffect(listing) {
                  if (listing != null) refreshing = false
              }

              // Preload the first few sub-folders so opening them is faster
              LaunchedEffect(listing) {
                  val subs = listing?.entries?.filter { it.isDir }?.take(3) ?: emptyList()
                  subs.forEach { e ->
                      withContext(Dispatchers.IO) {
                          if (DirCache.get(e.file.absolutePath) == null) {
                              DirCache.put(e.file.absolutePath, Listing(readEntries(e.file)))
                          }
                      }
                  }
              }

              val sorted = remember(listing, sortMode) {
                  listing?.let { sortEntries(it.entries, sortMode) }
              }
              val imagesInDir = remember(sorted) {
                  sorted?.filter { !it.isDir && ThumbnailCache.isImage(it.name) }?.map { it.file } ?: emptyList()
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      refreshing = true
                      loadKey++
                  },
                  modifier = Modifier.fillMaxSize()
              ) {
                  BoxWithConstraints(Modifier.fillMaxSize()) {
                      val rowMin: Dp = maxHeight / 15

                      if (sorted == null) {
                          SkeletonRows(count = 15, rowHeight = rowMin)
                      } else if (sorted.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("Empty folder", color = Color.White, fontSize = 16.sp)
                          }
                      } else {
                          LazyColumn(modifier = Modifier.fillMaxSize()) {
                              items(sorted, key = { it.file.absolutePath }) { entry ->
                                  FileRow(
                                      entry = entry,
                                      rowMinHeight = rowMin,
                                      modifier = Modifier.animateItem(),
                                      marked = marked.contains(entry.file.absolutePath),
                                      onLongClick = {
                                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                          onLongPress(entry.file)
                                      },
                                      onClick = {
                                          when {
                                              // While items are marked, a tap toggles the mark (multi-select)
                                              marked.isNotEmpty() -> onToggleMark(entry.file)
                                              entry.isDir -> onNavigate(entry.file)
                                              ThumbnailCache.isImage(entry.name) -> {
                                                  val idx = imagesInDir.indexOf(entry.file).coerceAtLeast(0)
                                                  onOpenImage(imagesInDir, idx)
                                              }
                                              else -> openFile(context, entry.file)
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  }
              }
          }

