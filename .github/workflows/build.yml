          // ---------- Bookmarks side panel ----------
          @Composable
          fun BookmarksPanel(
              visible: Boolean,
              listVersion: Int,
              onDismiss: () -> Unit,
              onNavigateHome: () -> Unit,
              onNavigateTo: (String) -> Unit,
              onReorder: (List<String>) -> Unit
          ) {
              val context = LocalContext.current
              var order by remember(listVersion) { mutableStateOf(Bookmarks.getAll(context)) }
              var draggingIndex by remember { mutableStateOf(-1) }
              var dragOffsetY by remember { mutableStateOf(0f) }

              if (!visible && draggingIndex == -1) return

              Box(modifier = Modifier.fillMaxSize()) {
                  AnimatedVisibility(
                      visible = visible,
                      enter = fadeIn(),
                      exit = fadeOut()
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0x99000000))
                              .clickable(
                                  interactionSource = remember { MutableInteractionSource() },
                                  indication = null,
                                  onClick = onDismiss
                              )
                      )
                  }

                  AnimatedVisibility(
                      visible = visible,
                      enter = slideInHorizontally(initialOffsetX = { -it }),
                      exit = slideOutHorizontally(targetOffsetX = { -it }),
                      modifier = Modifier.align(Alignment.CenterStart)
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxHeight()
                              .width(240.dp)
                              .background(Color(0xFF232323))
                              .padding(vertical = 12.dp)
                      ) {
                          Text(
                              text = "Bookmarks",
                              color = Color(0xFF888888),
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Medium,
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)
                          )

                          // Home — pinned, not draggable, always first.
                          TappableRow(onClick = onNavigateHome) {
                              Icon(
                                  imageVector = Icons.Filled.Home,
                                  contentDescription = null,
                                  tint = Color(0xFF4FC3F7),
                                  modifier = Modifier.size(20.dp)
                              )
                              Spacer(Modifier.width(10.dp))
                              Text("Home", fontSize = 14.sp, fontWeight = FontWeight.Medium)
                          }

                          Spacer(Modifier.height(4.dp))

                          order.forEachIndexed { index, path ->
                              val name = File(path).name.ifEmpty { path }
                              val isDragging = index == draggingIndex
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .graphicsLayer {
                                          translationY = if (isDragging) dragOffsetY else 0f
                                      }
                                      .background(if (isDragging) Color(0xFF2F2F2F) else Color.Transparent)
                                      .clickable { onNavigateTo(path) }
                                      .padding(horizontal = 16.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(
                                      imageVector = Icons.Filled.DragHandle,
                                      contentDescription = "Reorder",
                                      tint = Color(0xFF666666),
                                      modifier = Modifier
                                          .size(18.dp)
                                          .pointerInput(order) {
                                              detectDragGesturesAfterLongPress(
                                                  onDragStart = {
                                                      draggingIndex = index
                                                      dragOffsetY = 0f
                                                  },
                                                  onDrag = { change, dragAmount ->
                                                      change.consume()
                                                      dragOffsetY += dragAmount.y
                                                      val rowHeightPx = 40f
                                                      val moveBy = (dragOffsetY / rowHeightPx).toInt()
                                                      if (moveBy != 0) {
                                                          val newIndex = (draggingIndex + moveBy).coerceIn(0, order.size - 1)
                                                          if (newIndex != draggingIndex) {
                                                              val mutable = order.toMutableList()
                                                              val item = mutable.removeAt(draggingIndex)
                                                              mutable.add(newIndex, item)
                                                              order = mutable
                                                              draggingIndex = newIndex
                                                              dragOffsetY = 0f
                                                          }
                                                      }
                                                  },
                                                  onDragEnd = {
                                                      draggingIndex = -1
                                                      dragOffsetY = 0f
                                                      onReorder(order)
                                                  },
                                                  onDragCancel = {
                                                      draggingIndex = -1
                                                      dragOffsetY = 0f
                                                  }
                                              )
                                          }
                                  )
                                  Spacer(Modifier.width(8.dp))
                                  Text(name, color = Color.White, fontSize = 14.sp, maxLines = 1, modifier = Modifier.weight(1f))
                              }
                          }

                          if (order.isEmpty()) {
                              Text(
                                  text = "No bookmarks yet",
                                  color = Color(0xFF666666),
                                  fontSize = 12.sp,
                                  modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)
                              )
                          }
                      }
                  }
              }
          }

          // ---------- Image viewer ----------
          @Composable
          fun ImageViewerScreen(images: List<File>, startIndex: Int, onClose: () -> Unit) {
              val pagerState = rememberPagerState(initialPage = startIndex) { images.size }
              var controlsVisible by remember { mutableStateOf(true) }
              var currentPageZoomed by remember { mutableStateOf(false) }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  HorizontalPager(
                      state = pagerState,
                      modifier = Modifier.fillMaxSize(),
                      userScrollEnabled = !currentPageZoomed
                  ) { page ->
                      val file = images[page]
                      if (ThumbnailCache.isGif(file.name)) {
                          GifPage(file = file, onTap = { controlsVisible = !controlsVisible })
                      } else {
                          ZoomableImagePage(
                              file = file,
                              onTap = { controlsVisible = !controlsVisible },
                              onZoomStateChanged = { zoomed ->
                                  if (page == pagerState.currentPage) currentPageZoomed = zoomed
                              }
                          )
                      }
                  }

                  AnimatedVisibility(
                      visible = controlsVisible,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.align(Alignment.TopStart)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xAA000000))
                              .padding(horizontal = 16.dp, vertical = 16.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              imageVector = Icons.Filled.Close,
                              contentDescription = "Close",
                              tint = Color.White,
                              modifier = Modifier.size(24.dp).clickable { onClose() }
                          )
                          Spacer(Modifier.width(14.dp))
                          Text(
                              text = images.getOrNull(pagerState.currentPage)?.name ?: "",
                              color = Color.White,
                              fontSize = 15.sp,
                              maxLines = 1,
                              modifier = Modifier.weight(1f)
                          )
                          Text(
                              text = "${pagerState.currentPage + 1}/${images.size}",
                              color = Color.White.copy(alpha = 0.7f),
                              fontSize = 13.sp
                          )
                      }
                  }
              }

              BackHandler { onClose() }
          }

          // GIFs get a dedicated page using an Android ImageView driven by
          // AnimatedImageDrawable so they actually play
          @Composable
          fun GifPage(file: File, onTap: () -> Unit) {
              val context = LocalContext.current
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null,
                          onClick = onTap
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  AndroidView(
                      factory = { ctx ->
                          android.widget.ImageView(ctx).apply {
                              scaleType = android.widget.ImageView.ScaleType.FIT_CENTER
                              val drawable = FullImageCache.loadAnimatedDrawable(ctx, file.absolutePath)
                              when (drawable) {
                                  is AnimatedImageDrawable -> {
                                      setImageDrawable(drawable)
                                      drawable.start()
                                  }
                                  is Bitmap -> setImageBitmap(drawable)
                              }
                          }
                      },
                      modifier = Modifier.fillMaxSize()
                  )
              }
          }

          @Composable
          fun ZoomableImagePage(
              file: File,
              onTap: () -> Unit,
              onZoomStateChanged: (Boolean) -> Unit
          ) {
              val density = LocalDensity.current
              var containerSize by remember { mutableStateOf(Offset.Zero) }
              val decayAnimationSpec = rememberSplineBasedDecay<Float>()

              val targetDimension = with(density) { (2200.dp.toPx()).toInt() }
              var bitmap by remember(file.absolutePath) { mutableStateOf<Bitmap?>(null) }
              LaunchedEffect(file.absolutePath) {
                  bitmap = FullImageCache.decodeForViewer(file.absolutePath, targetDimension)
              }

              val minScale = 1f
              val maxScale = 6f

              val scaleAnim = remember(file.absolutePath) { Animatable(1f) }
              val offsetXAnim = remember(file.absolutePath) { Animatable(0f) }
              val offsetYAnim = remember(file.absolutePath) { Animatable(0f) }
              val scope = rememberCoroutineScope()

              LaunchedEffect(scaleAnim.value) {
                  onZoomStateChanged(scaleAnim.value > minScale + 0.01f)
              }

              fun clampOffsets(scale: Float, x: Float, y: Float): Offset {
                  if (scale <= minScale) return Offset.Zero
                  val maxOffsetX = (containerSize.x * (scale - 1f)) / (2f * scale)
                  val maxOffsetY = (containerSize.y * (scale - 1f)) / (2f * scale)
                  return Offset(x.coerceIn(-maxOffsetX, maxOffsetX), y.coerceIn(-maxOffsetY, maxOffsetY))
              }

              fun animateTo(target: Float, offX: Float, offY: Float, durationMs: Int = 220) {
                  scope.launch { scaleAnim.animateTo(target, animationSpec = tween(durationMs)) }
                  scope.launch { offsetXAnim.animateTo(offX, animationSpec = tween(durationMs)) }
                  scope.launch { offsetYAnim.animateTo(offY, animationSpec = tween(durationMs)) }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .onSizeChangedCompat { w, h -> containerSize = Offset(w.toFloat(), h.toFloat()) }
                      .pointerInput(file.absolutePath) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val downTime = System.currentTimeMillis()
                              var moved = false
                              var wasMultiTouch = false
                              val velocityTracker = VelocityTracker()

                              do {
                                  val event = awaitPointerEvent()
                                  val zoomChange = event.calculateZoom()
                                  val panChange = event.calculatePan()
                                  val isMultiTouch = event.changes.size > 1
                                  if (isMultiTouch) wasMultiTouch = true

                                  if (isMultiTouch || scaleAnim.value > minScale + 0.01f) {
                                      if (panChange.getDistance() > 1f || zoomChange != 1f) moved = true
                                      val newScale = (scaleAnim.value * zoomChange).coerceIn(minScale, maxScale)
                                      val rawX = offsetXAnim.value + panChange.x / newScale
                                      val rawY = offsetYAnim.value + panChange.y / newScale
                                      val clamped = clampOffsets(newScale, rawX, rawY)
                                      scope.launch { scaleAnim.snapTo(newScale) }
                                      scope.launch { offsetXAnim.snapTo(clamped.x) }
                                      scope.launch { offsetYAnim.snapTo(clamped.y) }
                                      event.changes.forEach {
                                          velocityTracker.addPointerInputChange(it)
                                          it.consume()
                                      }
                                  }
                              } while (event.changes.any { it.pressed })

                              if (scaleAnim.value < minScale + 0.02f && scaleAnim.value != minScale) {
                                  animateTo(minScale, 0f, 0f, 180)
                              } else if (moved && !wasMultiTouch && scaleAnim.value > minScale + 0.01f) {
                                  val velocity = velocityTracker.calculateVelocity()
                                  val currentScale = scaleAnim.value
                                  scope.launch {
                                      offsetXAnim.animateDecay(
                                          initialVelocity = velocity.x / currentScale,
                                          animationSpec = decayAnimationSpec
                                      ) {
                                          val clamped = clampOffsets(currentScale, this.value, offsetYAnim.value)
                                          if (this.value != clamped.x) {
                                              scope.launch { offsetXAnim.snapTo(clamped.x) }
                                          }
                                      }
                                  }
                                  scope.launch {
                                      offsetYAnim.animateDecay(
                                          initialVelocity = velocity.y / currentScale,
                                          animationSpec = decayAnimationSpec
                                      ) {
                                          val clamped = clampOffsets(currentScale, offsetXAnim.value, this.value)
                                          if (this.value != clamped.y) {
                                              scope.launch { offsetYAnim.snapTo(clamped.y) }
                                          }
                                      }
                                  }
                              }

                              if (!moved && !wasMultiTouch) {
                                  val elapsed = System.currentTimeMillis() - downTime
                                  if (elapsed < 500) {
                                      val secondDown = withTimeoutOrNull(300L) {
                                          awaitFirstDown(requireUnconsumed = false)
                                      }
                                      if (secondDown != null) {
                                          do {
                                              val e2 = awaitPointerEvent()
                                              e2.changes.forEach { it.consume() }
                                          } while (e2.changes.any { it.pressed })

                                          if (scaleAnim.value > minScale + 0.05f) {
                                              animateTo(minScale, 0f, 0f)
                                          } else {
                                              val target = 3f
                                              val cx = containerSize.x / 2f
                                              val cy = containerSize.y / 2f
                                              val newOffset = clampOffsets(target, cx - down.position.x, cy - down.position.y)
                                              animateTo(target, newOffset.x, newOffset.y)
                                          }
                                      } else {
                                          onTap()
                                      }
                                  }
                              }
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  val bmp = bitmap
                  if (bmp != null) {
                      Image(
                          bitmap = bmp.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer(
                                  scaleX = scaleAnim.value,
                                  scaleY = scaleAnim.value,
                                  translationX = offsetXAnim.value * scaleAnim.value,
                                  translationY = offsetYAnim.value * scaleAnim.value
                              )
                      )
                  } else {
                      CircularProgressIndicator(color = Color.White.copy(alpha = 0.6f))
                  }
              }
          }

          fun Modifier.onSizeChangedCompat(onSize: (Int, Int) -> Unit): Modifier =
              this.then(
                  Modifier.layout { measurable, constraints ->
                      val placeable = measurable.measure(constraints)
                      onSize(placeable.width, placeable.height)
                      layout(placeable.width, placeable.height) {
                          placeable.place(0, 0)
                      }
                  }
              )

          fun openFile(context: Context, file: File) {
              val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
              val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(file.extension.lowercase()) ?: "*/*"
              openUri(context, uri, mime)
          }

          fun openFile(context: Context, uri: Uri) {
              val mime = context.contentResolver.getType(uri) ?: "*/*"
              openUri(context, uri, mime)
          }

          private fun openUri(context: Context, uri: Uri, mime: String) {
              val intent = Intent(Intent.ACTION_VIEW).apply {
                  setDataAndType(uri, mime)
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              try {
                  context.startActivity(Intent.createChooser(intent, "Open with"))
              } catch (e: Exception) {
                  Toast.makeText(context, "No app to open this file", Toast.LENGTH_SHORT).show()
              }
          }

          @Composable
          fun FileExplorerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF1E1E1E),
                      surface = Color(0xFF2A2A2A),
                      primary = Color.White,
                      onBackground = Color.White,
                      onSurface = Color.White
                  ),
                  content = content
              )
          }
          ENDOFFILE

