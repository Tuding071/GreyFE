          @Composable
          fun FileListScreen(
              directory: File,
              onNavigate: (File) -> Unit,
              onJumpTo: (File) -> Unit,
              onNavigateHome: () -> Unit,
              onOpenImage: (images: List<File>, index: Int) -> Unit,
              onOpenPanel: () -> Unit,
              bookmarkListVersion: Int,
              onBookmarkChanged: () -> Unit
          ) {
              val context = LocalContext.current
              val files = remember(directory) {
                  directory.listFiles()
                      ?.sortedWith(compareBy<File> { it.isFile }.thenBy(naturalOrderComparator) { it.name })
                      ?: emptyList()
              }
              val imagesInDir = remember(files) { files.filter { it.isFile && ThumbnailCache.isImage(it.name) } }

              val bookmarked = remember(directory, bookmarkListVersion) {
                  Bookmarks.isBookmarked(context, directory.absolutePath)
              }

              val storageRoots = remember { getStorageRoots(context) }
              val matchingRoot = storageRoots.firstOrNull { directory.absolutePath.startsWith(it.second.absolutePath) }
              val breadcrumbs = remember(directory) {
                  val list = mutableListOf<Pair<String, () -> Unit>>()
                  list.add("Home" to onNavigateHome)
                  if (matchingRoot != null) {
                      val rootFile = matchingRoot.second
                      val relative = directory.absolutePath.removePrefix(rootFile.absolutePath).trim('/')
                      list.add(matchingRoot.first to { onJumpTo(rootFile) })
                      if (relative.isNotEmpty()) {
                          var acc = rootFile
                          relative.split("/").forEach { segment ->
                              acc = File(acc, segment)
                              val target = acc
                              list.add(segment to { onJumpTo(target) })
                          }
                      }
                  } else {
                      list.add(directory.name to { })
                  }
                  list
              }

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader(
                      breadcrumbs = breadcrumbs,
                      onOpenPanel = onOpenPanel,
                      menuContent = { close ->
                          MenuRow(text = if (bookmarked) "Remove bookmark" else "Add to bookmarks") {
                              if (bookmarked) {
                                  Bookmarks.remove(context, directory.absolutePath)
                              } else {
                                  Bookmarks.add(context, directory.absolutePath)
                              }
                              onBookmarkChanged()
                              close()
                          }
                      }
                  )

                  if (files.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Empty folder", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(8.dp)
                      ) {
                          items(files) { file ->
                              FileRow(file = file, onClick = {
                                  when {
                                      file.isDirectory -> onNavigate(file)
                                      ThumbnailCache.isImage(file.name) -> {
                                          val idx = imagesInDir.indexOf(file).coerceAtLeast(0)
                                          onOpenImage(imagesInDir, idx)
                                      }
                                      else -> openFile(context, file)
                                  }
                              })
                          }
                      }
                  }
              }
          }

