          @Composable
          fun ScreenHeader(
              breadcrumbs: List<Pair<String, () -> Unit>>,
              onOpenPanel: () -> Unit,
              menuContent: (@Composable (closeMenu: () -> Unit) -> Unit)? = null
          ) {
              var menuOpen by remember { mutableStateOf(false) }
              val scrollState = rememberScrollState()

              LaunchedEffect(breadcrumbs.size) {
                  scrollState.scrollTo(scrollState.maxValue)
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF2A2A2A))
                      .padding(horizontal = 12.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(
                      imageVector = Icons.Filled.List,
                      contentDescription = "Bookmarks",
                      tint = Color.White,
                      modifier = Modifier.size(22.dp).clickable { onOpenPanel() }
                  )
                  Spacer(Modifier.width(12.dp))

                  Row(
                      modifier = Modifier
                          .weight(1f)
                          .horizontalScroll(scrollState),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      breadcrumbs.forEachIndexed { index, (label, onClick) ->
                          if (index > 0) {
                              Text(
                                  text = " \u203a ",
                                  color = Color(0xFF777777),
                                  fontSize = 12.sp
                              )
                          }
                          val isLast = index == breadcrumbs.lastIndex
                          Text(
                              text = label,
                              color = if (isLast) Color.White else Color(0xFF4FC3F7),
                              fontSize = 12.sp,
                              maxLines = 1,
                              modifier = Modifier.clickable(enabled = !isLast) { onClick() }
                          )
                      }
                  }

                  if (menuContent != null) {
                      Spacer(Modifier.width(8.dp))
                      Box {
                          Icon(
                              imageVector = Icons.Filled.MoreVert,
                              contentDescription = "Menu",
                              tint = Color.White,
                              modifier = Modifier.size(22.dp).clickable { menuOpen = true }
                          )
                          if (menuOpen) {
                              Popup(onDismissRequest = { menuOpen = false }) {
                                  Column(
                                      modifier = Modifier
                                          .background(Color(0xFF333333), RoundedCornerShape(8.dp))
                                          .padding(vertical = 4.dp)
                                  ) {
                                      menuContent { menuOpen = false }
                                  }
                              }
                          }
                      }
                  }
              }
          }

