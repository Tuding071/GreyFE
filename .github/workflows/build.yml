          // Skeleton placeholder rows with a soft pulse while content loads
          @Composable
          fun SkeletonRows(count: Int, rowHeight: Dp) {
              val transition = rememberInfiniteTransition(label = "shimmer")
              val alpha by transition.animateFloat(
                  initialValue = 0.15f,
                  targetValue = 0.35f,
                  animationSpec = infiniteRepeatable(tween(900), RepeatMode.Reverse),
                  label = "shimmerAlpha"
              )
              val block = Color.White.copy(alpha = alpha)
              Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp)) {
                  repeat(count) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .heightIn(min = rowHeight)
                              .padding(vertical = 6.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(Modifier.size(42.dp).clip(RoundedCornerShape(8.dp)).background(block))
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Box(Modifier.fillMaxWidth(0.7f).height(12.dp).clip(RoundedCornerShape(4.dp)).background(block))
                              Spacer(Modifier.height(6.dp))
                              Box(Modifier.fillMaxWidth(0.4f).height(9.dp).clip(RoundedCornerShape(4.dp)).background(block))
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen(
              refreshKey: Int,
              onRefresh: () -> Unit,
              onRootClick: (File) -> Unit
          ) {
              val context = LocalContext.current
              var refreshing by remember { mutableStateOf(false) }
              val roots = remember(refreshKey) { StorageRoots.get(context) }

              LaunchedEffect(refreshKey) {
                  if (refreshing) {
                      delay(400)
                      refreshing = false
                  }
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      refreshing = true
                      onRefresh()
                  },
                  modifier = Modifier.fillMaxSize()
              ) {
                  if (roots.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("No storage found", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(vertical = 8.dp)
                      ) {
                          items(roots) { (label, root) ->
                              TappableRow(onClick = { onRootClick(root) }) {
                                  Icon(
                                      imageVector = if (label == "Internal Storage") Icons.Filled.PhoneAndroid else Icons.Filled.SdCard,
                                      contentDescription = label,
                                      tint = Color(0xFF90CAF9),
                                      modifier = Modifier.size(56.dp)
                                  )
                                  Spacer(Modifier.width(16.dp))
                                  Text(text = label, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Medium)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TappableRow(onClick: () -> Unit, content: @Composable RowScope.() -> Unit) {
              val interactionSource = remember { MutableInteractionSource() }
              val pressed by interactionSource.collectIsPressedAsState()
              val bg = if (pressed) Color.White else Color.Transparent

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(bg)
                      .clickable(
                          interactionSource = interactionSource,
                          indication = null,
                          onClick = onClick
                      )
                      .padding(horizontal = 16.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  CompositionLocalProvider(androidx.compose.material3.LocalContentColor provides if (pressed) Color.Black else Color.White) {
                      content()
                  }
              }
          }

          // File list: edge to edge, 15 rows fill the screen at minimum height,
          // rows grow up to 3 name lines. Shows skeleton rows while loading.
          // Uses the memory cache first, so revisiting a folder is instant.
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun FileListScreen(
              directory: File,
              sortMode: SortMode,
              onNavigate: (File) -> Unit,
              onOpenImage: (images: List<File>, index: Int) -> Unit
          ) {
              val context = LocalContext.current
              var loadKey by remember { mutableStateOf(0) }
              var refreshing by remember { mutableStateOf(false) }
              var listing by remember(directory) { mutableStateOf(DirCache.get(directory.absolutePath)) }

              // Read in the background; the cached copy (if any) stays on screen until the fresh one arrives
              LaunchedEffect(directory, loadKey) {
                  val fresh = withContext(Dispatchers.IO) {
                      Listing(readEntries(directory)).also { DirCache.put(directory.absolutePath, it) }
                  }
                  listing = fresh
              }

              LaunchedEffect(listing) {
                  if (listing != null) refreshing = false
              }

              // Preload the first few sub-folders so opening them is faster
              LaunchedEffect(listing) {
                  val subs = listing?.entries?.filter { it.isDir }?.take(3) ?: emptyList()
                  subs.forEach { e ->
                      withContext(Dispatchers.IO) {
                          if (DirCache.get(e.file.absolutePath) == null) {
                              DirCache.put(e.file.absolutePath, Listing(readEntries(e.file)))
                          }
                      }
                  }
              }

              val sorted = remember(listing, sortMode) {
                  listing?.let { sortEntries(it.entries, sortMode) }
              }
              val imagesInDir = remember(sorted) {
                  sorted?.filter { !it.isDir && ThumbnailCache.isImage(it.name) }?.map { it.file } ?: emptyList()
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      refreshing = true
                      loadKey++
                  },
                  modifier = Modifier.fillMaxSize()
              ) {
                  BoxWithConstraints(Modifier.fillMaxSize()) {
                      val rowMin: Dp = maxHeight / 15

                      if (sorted == null) {
                          SkeletonRows(count = 15, rowHeight = rowMin)
                      } else if (sorted.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("Empty folder", color = Color.White, fontSize = 16.sp)
                          }
                      } else {
                          LazyColumn(modifier = Modifier.fillMaxSize()) {
                              items(sorted, key = { it.file.absolutePath }) { entry ->
                                  FileRow(
                                      entry = entry,
                                      rowMinHeight = rowMin,
                                      modifier = Modifier.animateItem(),
                                      onClick = {
                                          when {
                                              entry.isDir -> onNavigate(entry.file)
                                              ThumbnailCache.isImage(entry.name) -> {
                                                  val idx = imagesInDir.indexOf(entry.file).coerceAtLeast(0)
                                                  onOpenImage(imagesInDir, idx)
                                              }
                                              else -> openFile(context, entry.file)
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          // Folders always use the same amber folder icon. Only image and video files show a thumbnail.
          @Composable
          fun FileThumbBox(isDirectory: Boolean, thumb: Bitmap?) {
              Box(
                  modifier = Modifier
                      .size(42.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(if (isDirectory) Color(0xFF3A3A3A) else Color.Transparent),
                  contentAlignment = Alignment.Center
              ) {
                  if (thumb != null && !isDirectory) {
                      Image(
                          bitmap = thumb.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else if (isDirectory) {
                      Icon(
                          imageVector = Icons.Filled.Folder,
                          contentDescription = "Folder",
                          tint = Color(0xFFE0B04F),
                          modifier = Modifier.size(28.dp)
                      )
                  } else {
                      Icon(
                          imageVector = Icons.Filled.InsertDriveFile,
                          contentDescription = null,
                          tint = Color(0xFFB0BEC5),
                          modifier = Modifier.size(26.dp)
                      )
                  }
              }
          }

          // One row: thumb | name (up to 3 lines) above size (left) and date (right) | optional Copy pill
          @Composable
          fun FileRow(entry: Entry, rowMinHeight: Dp, modifier: Modifier = Modifier, onClick: () -> Unit) {
              val context = LocalContext.current
              val file = entry.file
              val hasFileThumb = !entry.isDir && (ThumbnailCache.isImage(entry.name) || ThumbnailCache.isVideo(entry.name))
              val muted = Color.White.copy(alpha = 0.55f)

              val thumb by produceState<Bitmap?>(initialValue = null, key1 = file.absolutePath, key2 = entry.modified) {
                  value = if (hasFileThumb) ThumbnailCache.getThumbnail(context, file, entry.modified) else null
              }

              // Folder item counts come from a background read, remembered after the first time
              val folderCount by produceState<Int?>(initialValue = if (entry.isDir) FolderCount.cached(file.absolutePath) else null, key1 = file.absolutePath) {
                  if (entry.isDir && value == null) {
                      value = withContext(Dispatchers.IO) { FolderCount.load(file) }
                  }
              }

              val sizeText = if (entry.isDir) {
                  folderCount?.let { "$it items" } ?: "Folder"
              } else {
                  formatSize(entry.size)
              }

              val interactionSource = remember { MutableInteractionSource() }
              val pressed by interactionSource.collectIsPressedAsState()

              Row(
                  modifier = modifier
                      .fillMaxWidth()
                      .heightIn(min = rowMinHeight)
                      .background(if (pressed) Color.White else Color.Transparent)
                      .clickable(interactionSource = interactionSource, indication = null, onClick = onClick)
                      .padding(horizontal = 8.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  FileThumbBox(isDirectory = entry.isDir, thumb = thumb)
                  Spacer(Modifier.width(12.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          text = entry.name,
                          color = if (pressed) Color.Black else Color.White,
                          fontSize = 15.sp,
                          maxLines = 3,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(2.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(
                              text = sizeText,
                              color = if (pressed) Color.Black.copy(alpha = 0.6f) else muted,
                              fontSize = 11.sp,
                              maxLines = 1
                          )
                          Text(
                              text = formatDate(entry.modified),
                              color = if (pressed) Color.Black.copy(alpha = 0.6f) else muted,
                              fontSize = 11.sp,
                              maxLines = 1
                          )
                      }
                  }

                  // Copy pill for text-based files: copies the whole content, no opening needed
                  if (!entry.isDir && isTextName(entry.name)) {
                      Spacer(Modifier.width(8.dp))
                      Box(
                          modifier = Modifier
                              .clip(CircleShape)
                              .background(Color.White)
                              .clickable { copyFileContent(context, file) }
                              .padding(horizontal = 12.dp, vertical = 6.dp)
                      ) {
                          Text("Copy", color = Color.Black, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      }
                  }
              }
          }

          fun copyFileContent(context: Context, file: File) {
              if (file.length() > 2_000_000L) {
                  Toast.makeText(context, "File too large to copy", Toast.LENGTH_SHORT).show()
                  return
              }
              try {
                  val text = file.readText()
                  val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText(file.name, text))
                  Toast.makeText(context, "Copied ${file.name}", Toast.LENGTH_SHORT).show()
              } catch (e: Exception) {
                  Toast.makeText(context, "Could not read file", Toast.LENGTH_SHORT).show()
              }
          }

          // ---------- Bookmarks side panel ----------
          // No animation: it appears and disappears at once.
          // Press and hold the WHOLE row to drag; it follows the finger until release.
          // Each row shows an internal or SD card icon (same icons as Home).
          @Composable
          fun BookmarksPanel(
              visible: Boolean,
              listVersion: Int,
              onDismiss: () -> Unit,
              onNavigateHome: () -> Unit,
              onNavigateTo: (String) -> Unit,
              onReorder: (List<String>) -> Unit
          ) {
              val context = LocalContext.current
              var order by remember(listVersion) { mutableStateOf(Bookmarks.getAll(context)) }
              var draggingIndex by remember { mutableStateOf(-1) }
              var dragOffsetY by remember { mutableStateOf(0f) }
              val rowHeightPx = with(LocalDensity.current) { 44.dp.toPx() }

              if (!visible && draggingIndex == -1) return

              Box(modifier = Modifier.fillMaxSize()) {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color(0x99000000))
                          .clickable(
                              interactionSource = remember { MutableInteractionSource() },
                              indication = null,
                              onClick = onDismiss
                          )
                  )

                  Column(
                      modifier = Modifier
                          .align(Alignment.CenterStart)
                          .fillMaxHeight()
                          .width(240.dp)
                          .background(Color(0xFF232323))
                          .windowInsetsPadding(WindowInsets.systemBars)
                          .padding(vertical = 12.dp)
                  ) {
                      Text(
                          text = "Bookmarks",
                          color = Color(0xFF888888),
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Medium,
                          modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)
                      )

                      // Home: pinned, first, not draggable
                      TappableRow(onClick = onNavigateHome) {
                          Icon(
                              imageVector = Icons.Filled.Home,
                              contentDescription = null,
                              tint = Color(0xFF4FC3F7),
                              modifier = Modifier.size(20.dp)
                          )
                          Spacer(Modifier.width(10.dp))
                          Text("Home", fontSize = 14.sp, fontWeight = FontWeight.Medium)
                      }

                      Spacer(Modifier.height(4.dp))

                      order.forEachIndexed { index, path ->
                          val name = File(path).name.ifEmpty { path }
                          val isDragging = index == draggingIndex
                          val internal = isInternalPath(context, path)
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .graphicsLayer {
                                      translationY = if (isDragging) dragOffsetY else 0f
                                  }
                                  .background(if (isDragging) Color(0xFF2F2F2F) else Color.Transparent)
                                  .pointerInput(order) {
                                      detectDragGesturesAfterLongPress(
                                          onDragStart = {
                                              draggingIndex = index
                                              dragOffsetY = 0f
                                          },
                                          onDrag = { change, dragAmount ->
                                              change.consume()
                                              dragOffsetY += dragAmount.y
                                              if (draggingIndex >= 0) {
                                                  val moveBy = (dragOffsetY / rowHeightPx).toInt()
                                                  if (moveBy != 0) {
                                                      val newIndex = (draggingIndex + moveBy).coerceIn(0, order.size - 1)
                                                      if (newIndex != draggingIndex) {
                                                          val mutable = order.toMutableList()
                                                          val item = mutable.removeAt(draggingIndex)
                                                          mutable.add(newIndex, item)
                                                          order = mutable
                                                          draggingIndex = newIndex
                                                          dragOffsetY -= moveBy * rowHeightPx
                                                      }
                                                  }
                                              }
                                          },
                                          onDragEnd = {
                                              draggingIndex = -1
                                              dragOffsetY = 0f
                                              onReorder(order)
                                          },
                                          onDragCancel = {
                                              draggingIndex = -1
                                              dragOffsetY = 0f
                                          }
                                      )
                                  }
                                  .clickable { onNavigateTo(path) }
                                  .padding(horizontal = 16.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(
                                  imageVector = if (internal) Icons.Filled.PhoneAndroid else Icons.Filled.SdCard,
                                  contentDescription = if (internal) "Internal storage" else "SD card",
                                  tint = Color(0xFF90CAF9),
                                  modifier = Modifier.size(20.dp)
                              )
                              Spacer(Modifier.width(10.dp))
                              Text(name, color = Color.White, fontSize = 14.sp, maxLines = 1, modifier = Modifier.weight(1f))
                          }
                      }

                      if (order.isEmpty()) {
                          Text(
                              text = "No bookmarks yet",
                              color = Color(0xFF666666),
                              fontSize = 12.sp,
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)
                          )
                      }
                  }
              }
          }

          // ---------- Image viewer ----------
          @Composable
          fun ImageViewerScreen(images: List<File>, startIndex: Int, onClose: () -> Unit) {
              val pagerState = rememberPagerState(initialPage = startIndex) { images.size }
              var controlsVisible by remember { mutableStateOf(true) }
              var currentPageZoomed by remember { mutableStateOf(false) }

              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  HorizontalPager(
                      state = pagerState,
                      modifier = Modifier.fillMaxSize(),
                      userScrollEnabled = !currentPageZoomed
                  ) { page ->
                      val file = images[page]
                      if (ThumbnailCache.isGif(file.name)) {
                          GifPage(file = file, onTap = { controlsVisible = !controlsVisible })
                      } else {
                          ZoomableImagePage(
                              file = file,
                              onTap = { controlsVisible = !controlsVisible },
                              onZoomStateChanged = { zoomed ->
                                  if (page == pagerState.currentPage) currentPageZoomed = zoomed
                              }
                          )
                      }
                  }

                  AnimatedVisibility(
                      visible = controlsVisible,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.align(Alignment.TopStart)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xAA000000))
                              .windowInsetsPadding(WindowInsets.statusBars)
                              .padding(horizontal = 16.dp, vertical = 16.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              imageVector = Icons.Filled.Close,
                              contentDescription = "Close",
                              tint = Color.White,
                              modifier = Modifier.size(24.dp).clickable { onClose() }
                          )
                          Spacer(Modifier.width(14.dp))
                          Text(
                              text = images.getOrNull(pagerState.currentPage)?.name ?: "",
                              color = Color.White,
                              fontSize = 15.sp,
                              maxLines = 1,
                              modifier = Modifier.weight(1f)
                          )
                          Text(
                              text = "${pagerState.currentPage + 1}/${images.size}",
                              color = Color.White.copy(alpha = 0.7f),
                              fontSize = 13.sp
                          )
                      }
                  }
              }

              BackHandler { onClose() }
          }

          // GIFs get a dedicated page using an Android ImageView driven by
          // AnimatedImageDrawable so they actually play
          @Composable
          fun GifPage(file: File, onTap: () -> Unit) {
              val context = LocalContext.current
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null,
                          onClick = onTap
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  AndroidView(
                      factory = { ctx ->
                          android.widget.ImageView(ctx).apply {
                              scaleType = android.widget.ImageView.ScaleType.FIT_CENTER
                              val drawable = FullImageCache.loadAnimatedDrawable(ctx, file.absolutePath)
                              when (drawable) {
                                  is AnimatedImageDrawable -> {
                                      setImageDrawable(drawable)
                                      drawable.start()
                                  }
                                  is Bitmap -> setImageBitmap(drawable)
                              }
                          }
                      },
                      modifier = Modifier.fillMaxSize()
                  )
              }
          }

          @Composable
          fun ZoomableImagePage(
              file: File,
              onTap: () -> Unit,
              onZoomStateChanged: (Boolean) -> Unit
          ) {
              val density = LocalDensity.current
              var containerSize by remember { mutableStateOf(Offset.Zero) }
              val decayAnimationSpec = rememberSplineBasedDecay<Float>()

              val targetDimension = with(density) { (2200.dp.toPx()).toInt() }
              var bitmap by remember(file.absolutePath) { mutableStateOf<Bitmap?>(null) }
              LaunchedEffect(file.absolutePath) {
                  bitmap = FullImageCache.decodeForViewer(file.absolutePath, targetDimension)
              }

              val minScale = 1f
              val maxScale = 6f

              val scaleAnim = remember(file.absolutePath) { Animatable(1f) }
              val offsetXAnim = remember(file.absolutePath) { Animatable(0f) }
              val offsetYAnim = remember(file.absolutePath) { Animatable(0f) }
              val scope = rememberCoroutineScope()

              LaunchedEffect(scaleAnim.value) {
                  onZoomStateChanged(scaleAnim.value > minScale + 0.01f)
              }

              fun clampOffsets(scale: Float, x: Float, y: Float): Offset {
                  if (scale <= minScale) return Offset.Zero
                  val maxOffsetX = (containerSize.x * (scale - 1f)) / (2f * scale)
                  val maxOffsetY = (containerSize.y * (scale - 1f)) / (2f * scale)
                  return Offset(x.coerceIn(-maxOffsetX, maxOffsetX), y.coerceIn(-maxOffsetY, maxOffsetY))
              }

              fun animateTo(target: Float, offX: Float, offY: Float, durationMs: Int = 220) {
                  scope.launch { scaleAnim.animateTo(target, animationSpec = tween(durationMs)) }
                  scope.launch { offsetXAnim.animateTo(offX, animationSpec = tween(durationMs)) }
                  scope.launch { offsetYAnim.animateTo(offY, animationSpec = tween(durationMs)) }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .onSizeChangedCompat { w, h -> containerSize = Offset(w.toFloat(), h.toFloat()) }
                      .pointerInput(file.absolutePath) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val downTime = System.currentTimeMillis()
                              var moved = false
                              var wasMultiTouch = false
                              val velocityTracker = VelocityTracker()

                              do {
                                  val event = awaitPointerEvent()
                                  val zoomChange = event.calculateZoom()
                                  val panChange = event.calculatePan()
                                  val isMultiTouch = event.changes.size > 1
                                  if (isMultiTouch) wasMultiTouch = true

                                  if (isMultiTouch || scaleAnim.value > minScale + 0.01f) {
                                      if (panChange.getDistance() > 1f || zoomChange != 1f) moved = true
                                      val newScale = (scaleAnim.value * zoomChange).coerceIn(minScale, maxScale)
                                      val rawX = offsetXAnim.value + panChange.x / newScale
                                      val rawY = offsetYAnim.value + panChange.y / newScale
                                      val clamped = clampOffsets(newScale, rawX, rawY)
                                      scope.launch { scaleAnim.snapTo(newScale) }
                                      scope.launch { offsetXAnim.snapTo(clamped.x) }
                                      scope.launch { offsetYAnim.snapTo(clamped.y) }
                                      event.changes.forEach {
                                          velocityTracker.addPointerInputChange(it)
                                          it.consume()
                                      }
                                  }
                              } while (event.changes.any { it.pressed })

                              if (scaleAnim.value < minScale + 0.02f && scaleAnim.value != minScale) {
                                  animateTo(minScale, 0f, 0f, 180)
                              } else if (moved && !wasMultiTouch && scaleAnim.value > minScale + 0.01f) {
                                  val velocity = velocityTracker.calculateVelocity()
                                  val currentScale = scaleAnim.value
                                  scope.launch {
                                      offsetXAnim.animateDecay(
                                          initialVelocity = velocity.x / currentScale,
                                          animationSpec = decayAnimationSpec
                                      ) {
                                          val clamped = clampOffsets(currentScale, this.value, offsetYAnim.value)
                                          if (this.value != clamped.x) {
                                              scope.launch { offsetXAnim.snapTo(clamped.x) }
                                          }
                                      }
                                  }
                                  scope.launch {
                                      offsetYAnim.animateDecay(
                                          initialVelocity = velocity.y / currentScale,
                                          animationSpec = decayAnimationSpec
                                      ) {
                                          val clamped = clampOffsets(currentScale, offsetXAnim.value, this.value)
                                          if (this.value != clamped.y) {
                                              scope.launch { offsetYAnim.snapTo(clamped.y) }
                                          }
                                      }
                                  }
                              }

                              if (!moved && !wasMultiTouch) {
                                  val elapsed = System.currentTimeMillis() - downTime
                                  if (elapsed < 500) {
                                      val secondDown = withTimeoutOrNull(300L) {
                                          awaitFirstDown(requireUnconsumed = false)
                                      }
                                      if (secondDown != null) {
                                          do {
                                              val e2 = awaitPointerEvent()
                                              e2.changes.forEach { it.consume() }
                                          } while (e2.changes.any { it.pressed })

                                          if (scaleAnim.value > minScale + 0.05f) {
                                              animateTo(minScale, 0f, 0f)
                                          } else {
                                              val target = 3f
                                              val cx = containerSize.x / 2f
                                              val cy = containerSize.y / 2f
                                              val newOffset = clampOffsets(target, cx - down.position.x, cy - down.position.y)
                                              animateTo(target, newOffset.x, newOffset.y)
                                          }
                                      } else {
                                          onTap()
                                      }
                                  }
                              }
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  val bmp = bitmap
                  if (bmp != null) {
                      Image(
                          bitmap = bmp.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer(
                                  scaleX = scaleAnim.value,
                                  scaleY = scaleAnim.value,
                                  translationX = offsetXAnim.value * scaleAnim.value,
                                  translationY = offsetYAnim.value * scaleAnim.value
                              )
                      )
                  } else {
                      CircularProgressIndicator(color = Color.White.copy(alpha = 0.6f))
                  }
              }
          }

          fun Modifier.onSizeChangedCompat(onSize: (Int, Int) -> Unit): Modifier =
              this.then(
                  Modifier.layout { measurable, constraints ->
                      val placeable = measurable.measure(constraints)
                      onSize(placeable.width, placeable.height)
                      layout(placeable.width, placeable.height) {
                          placeable.place(0, 0)
                      }
                  }
              )

          fun openFile(context: Context, file: File) {
              val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
              val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(file.extension.lowercase()) ?: "*/*"
              openUri(context, uri, mime)
          }

          private fun openUri(context: Context, uri: Uri, mime: String) {
              val intent = Intent(Intent.ACTION_VIEW).apply {
                  setDataAndType(uri, mime)
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              try {
                  context.startActivity(Intent.createChooser(intent, "Open with"))
              } catch (e: Exception) {
                  Toast.makeText(context, "No app to open this file", Toast.LENGTH_SHORT).show()
              }
          }

          @Composable
          fun FileExplorerTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF1E1E1E),
                      surface = Color(0xFF2A2A2A),
                      primary = Color.White,
                      onBackground = Color.White,
                      onSurface = Color.White
                  ),
                  content = content
              )
          }
