          // One row: thumb | name (up to 3 lines) above size (left) and date (right) | optional Copy pill
          @Composable
          fun FileRow(
              entry: Entry,
              rowMinHeight: Dp,
              modifier: Modifier = Modifier,
              marked: Boolean = false,
              onLongClick: () -> Unit = {},
              onClick: () -> Unit
          ) {
              val context = LocalContext.current
              val file = entry.file
              val hasFileThumb = !entry.isDir && (ThumbnailCache.isImage(entry.name) || ThumbnailCache.isVideo(entry.name))
              val muted = Color.White.copy(alpha = 0.55f)

              val thumb by produceState<Bitmap?>(initialValue = null, key1 = file.absolutePath, key2 = entry.modified) {
                  value = if (hasFileThumb) ThumbnailCache.getThumbnail(context, file, entry.modified) else null
              }

              val folderThumb by produceState<Bitmap?>(initialValue = null, key1 = file.absolutePath, key2 = entry.modified) {
                  value = if (entry.isDir) ThumbnailCache.getFolderThumbnail(context, file) else null
              }

              // Folder item counts come from a background read, remembered after the first time
              val folderCount by produceState<Int?>(initialValue = if (entry.isDir) FolderCount.cached(file.absolutePath) else null, key1 = file.absolutePath) {
                  if (entry.isDir && value == null) {
                      value = withContext(Dispatchers.IO) { FolderCount.load(file) }
                  }
              }

              val sizeText = if (entry.isDir) {
                  folderCount?.let { "$it items" } ?: "Folder"
              } else {
                  formatSize(entry.size)
              }

              val pressedState = remember { mutableStateOf(false) }
              // Marked rows stay white background + black text (static, no pulsing)
              val pressed = pressedState.value || marked
              val copyPressed = remember { mutableStateOf(false) }

              Row(
                  modifier = modifier
                      .fillMaxWidth()
                      .heightIn(min = rowMinHeight)
                      .background(if (pressed) Color.White else Color.Transparent)
                      .pressFlashLong(pressedState, onLongClick, onClick)
                      .padding(horizontal = 8.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  FileThumbBox(isDirectory = entry.isDir, thumb = thumb, folderThumb = folderThumb)
                  Spacer(Modifier.width(12.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          text = entry.name,
                          color = if (pressed) Color.Black else Color.White,
                          fontSize = 15.sp,
                          maxLines = 3,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(2.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(
                              text = sizeText,
                              color = if (pressed) Color.Black.copy(alpha = 0.6f) else muted,
                              fontSize = 11.sp,
                              maxLines = 1
                          )
                          Text(
                              text = formatDate(entry.modified),
                              color = if (pressed) Color.Black.copy(alpha = 0.6f) else muted,
                              fontSize = 11.sp,
                              maxLines = 1
                          )
                      }
                  }

                  // Copy pill for text-based files: copies the whole content, no opening needed
                  if (!entry.isDir && isTextName(entry.name)) {
                      Spacer(Modifier.width(8.dp))
                      Box(
                          modifier = Modifier
                              .clip(CircleShape)
                              .background(if (copyPressed.value || pressed) Color.Black else Color.White)
                              .pressFlash(copyPressed) { copyFileContent(context, file) }
                              .padding(horizontal = 12.dp, vertical = 6.dp)
                      ) {
                          Text("Copy", color = if (copyPressed.value || pressed) Color.White else Color.Black, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      }
                  }
              }
          }

