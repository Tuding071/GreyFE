name: Build GreyB Explorer

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK path
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: app/release.keystore
          key: greyb-explorer-keystore-v1

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/greyb/explorer
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:label="GreyB Explorer"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="GreyB Explorer">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          ENDOFFILE

      - name: Generate file_paths.xml
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <root-path name="root" path="." />
              <external-path name="external" path="." />
              <files-path name="internal_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          ENDOFFILE

      - name: Generate styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#1E1E1E</item>
                  <item name="android:navigationBarColor">#1E1E1E</item>
                  <item name="android:statusBarColor">#1E1E1E</item>
              </style>
          </resources>
          ENDOFFILE

      - name: Generate MainActivity.kt
        run: |
          cat > app/src/main/java/com/greyb/explorer/MainActivity.kt << 'ENDOFFILE'
          package com.greyb.explorer

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.webkit.MimeTypeMap
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import androidx.documentfile.provider.DocumentFile
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      FileExplorerTheme {
                          FileExplorerApp()
                      }
                  }
              }
          }

          fun hasStoragePermission(context: Context): Boolean {
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  Environment.isExternalStorageManager()
              } else {
                  ContextCompat.checkSelfPermission(
                      context,
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  ) == PackageManager.PERMISSION_GRANTED
              }
          }

          fun getStorageRoots(context: Context): List<Pair<String, File>> {
              val roots = mutableListOf<Pair<String, File>>()

              // 1. Primary external storage
              Environment.getExternalStorageDirectory()?.let {
                  if (it.exists() && it.canRead()) {
                      roots.add("Internal Storage" to it)
                  }
              }

              // 2. Use getExternalFilesDirs to find other volumes
              try {
                  val externalDirs = context.getExternalFilesDirs(null)
                  for (dir in externalDirs) {
                      if (dir != null) {
                          val path = dir.absolutePath
                          val index = path.indexOf("/Android/data/")
                          if (index != -1) {
                              val rootPath = path.substring(0, index)
                              val root = File(rootPath)
                              if (root.exists() && root.canRead() && root != Environment.getExternalStorageDirectory()) {
                                  roots.add(root.name to root)
                              }
                          }
                      }
                  }
              } catch (e: Exception) { }

              // 3. Scan /storage for volume IDs (e.g., XXXX-XXXX)
              try {
                  val storageDir = File("/storage")
                  if (storageDir.exists() && storageDir.canRead()) {
                      storageDir.listFiles()?.forEach { f ->
                          if (f.isDirectory && f.name != "emulated" && f.name != "self" && f.canRead()) {
                              if (f.name.matches(Regex("[0-9A-F]{4}-[0-9A-F]{4}"))) {
                                  roots.add("SD Card" to f)
                              }
                          }
                      }
                      val emulated = File("/storage/emulated/0")
                      if (emulated.exists() && emulated.canRead() && roots.none { it.second == emulated }) {
                          roots.add(0, "Internal Storage" to emulated)
                      }
                  }
              } catch (e: Exception) { }

              return roots.distinctBy { it.second.absolutePath }
          }

          @Composable
          fun FileExplorerApp() {
              val context = LocalContext.current
              var navigationStack by remember { mutableStateOf<List<File>>(emptyList()) }
              val currentDir = navigationStack.lastOrNull()
              var hasPermission by remember { mutableStateOf(hasStoragePermission(context)) }
              var refreshTrigger by remember { mutableStateOf(0) }

              // SAF state
              var safRoot by remember { mutableStateOf<DocumentFile?>(null) }
              var safStack by remember { mutableStateOf<List<DocumentFile>>(emptyList()) }

              val prefs = context.getSharedPreferences("saf_prefs", Context.MODE_PRIVATE)

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  hasPermission = hasStoragePermission(context)
              }

              val safLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      try {
                          val doc = DocumentFile.fromTreeUri(context, uri)
                          if (doc != null && doc.canRead()) {
                              // Take persistable permission
                              context.contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              )
                              prefs.edit().putString("saf_uri", uri.toString()).apply()
                              safRoot = doc
                              safStack = listOf(doc)
                          }
                      } catch (e: Exception) {
                          Toast.makeText(context, "Cannot access selected folder", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              // Load saved SAF URI on startup
              LaunchedEffect(Unit) {
                  val savedUriString = prefs.getString("saf_uri", null)
                  if (savedUriString != null) {
                      try {
                          val uri = Uri.parse(savedUriString)
                          val doc = DocumentFile.fromTreeUri(context, uri)
                          if (doc != null && doc.canRead()) {
                              safRoot = doc
                              safStack = listOf(doc)
                          } else {
                              prefs.edit().remove("saf_uri").apply()
                          }
                      } catch (e: Exception) {
                          prefs.edit().remove("saf_uri").apply()
                      }
                  }
                  if (!hasPermission) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                          intent.data = Uri.parse("package:${context.packageName}")
                          context.startActivity(intent)
                      } else {
                          permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                  }
              }

              val lifecycleOwner = LocalLifecycleOwner.current
              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_RESUME) {
                          hasPermission = hasStoragePermission(context)
                          refreshTrigger++
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              BackHandler(enabled = navigationStack.isNotEmpty() || safStack.size > 1) {
                  if (safStack.size > 1) {
                      safStack = safStack.dropLast(1)
                  } else if (navigationStack.isNotEmpty()) {
                      navigationStack = navigationStack.dropLast(1)
                  }
              }

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color(0xFF1E1E1E)
              ) {
                  if (safRoot != null) {
                      SafBrowserScreen(
                          currentDoc = safStack.last(),
                          onNavigate = { doc -> safStack = safStack + doc },
                          onBack = { safStack = safStack.dropLast(1) },
                          onExit = {
                              safRoot = null
                              safStack = emptyList()
                              prefs.edit().remove("saf_uri").apply()
                          }
                      )
                  } else if (!hasPermission) {
                      PermissionScreen(
                          onGrant = {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                  val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                  intent.data = Uri.parse("package:${context.packageName}")
                                  context.startActivity(intent)
                              } else {
                                  permissionLauncher.launch(Manifest.permission.READ_EXTERNAL_STORAGE)
                              }
                          },
                          onUseSaf = { safLauncher.launch(null) }
                      )
                  } else {
                      if (currentDir == null) {
                          StorageRootsScreen(
                              refreshKey = refreshTrigger,
                              onRefresh = { refreshTrigger++ },
                              onRootClick = { root -> navigationStack = listOf(root) },
                              onAddStorage = { safLauncher.launch(null) }
                          )
                      } else {
                          FileListScreen(
                              directory = currentDir!!,
                              onNavigate = { dir -> navigationStack = navigationStack + dir },
                              onBack = { navigationStack = navigationStack.dropLast(1) }
                          )
                      }
                  }
              }
          }

          @Composable
          fun PermissionScreen(onGrant: () -> Unit, onUseSaf: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxSize(),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("Storage permission required", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(8.dp))
                  Text("Grant access to browse files", color = Color.White.copy(alpha = 0.7f), fontSize = 16.sp)
                  Spacer(Modifier.height(24.dp))
                  Button(onClick = onGrant, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1565C0))) {
                      Text("Grant Access", color = Color.White, fontSize = 16.sp)
                  }
                  Spacer(Modifier.height(12.dp))
                  TextButton(onClick = onUseSaf) {
                      Text("Use SAF instead", color = Color(0xFF4FC3F7), fontSize = 14.sp)
                  }
              }
          }

          @Composable
          fun StorageRootsScreen(
              refreshKey: Int,
              onRefresh: () -> Unit,
              onRootClick: (File) -> Unit,
              onAddStorage: () -> Unit
          ) {
              val context = LocalContext.current
              val roots = remember(refreshKey) { getStorageRoots(context) }

              Column(Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier.fillMaxWidth().background(Color(0xFF2A2A2A)).padding(horizontal = 16.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text("Refresh", color = Color(0xFF4FC3F7), fontSize = 14.sp, modifier = Modifier.clickable { onRefresh() })
                      Text("Add Storage", color = Color(0xFF4FC3F7), fontSize = 14.sp, modifier = Modifier.clickable { onAddStorage() })
                  }

                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(16.dp)
                  ) {
                      items(roots) { (label, root) ->
                          Row(
                              modifier = Modifier.fillMaxWidth().clickable { onRootClick(root) }.padding(vertical = 14.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(text = if (label == "Internal Storage") "📱" else "💾", fontSize = 22.sp)
                              Spacer(Modifier.width(12.dp))
                              Text(text = label, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Medium)
                          }
                      }
                  }
              }
          }

          @Composable
          fun FileListScreen(
              directory: File,
              onNavigate: (File) -> Unit,
              onBack: () -> Unit
          ) {
              val context = LocalContext.current
              val files = remember(directory) {
                  directory.listFiles()?.sortedWith(compareBy<File> { it.isFile }.thenBy { it.name.lowercase() }) ?: emptyList()
              }

              Column(Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier.fillMaxWidth().background(Color(0xFF2A2A2A)).padding(horizontal = 16.dp, vertical = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text("←", color = Color.White, fontSize = 20.sp, modifier = Modifier.clickable { onBack() })
                      Spacer(Modifier.width(12.dp))
                      Text(directory.path, color = Color.White, fontSize = 16.sp, maxLines = 1)
                  }

                  if (files.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Empty folder", color = Color.White, fontSize = 16.sp)
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(8.dp)
                      ) {
                          items(files) { file ->
                              FileRow(file = file, onClick = {
                                  if (file.isDirectory) onNavigate(file) else openFile(context, file)
                              })
                          }
                      }
                  }
              }
          }

          @Composable
          fun SafBrowserScreen(
              currentDoc: DocumentFile,
              onNavigate: (DocumentFile) -> Unit,
              onBack: () -> Unit,
              onExit: () -> Unit
          ) {
              val context = LocalContext.current
              val children = remember(currentDoc) {
                  currentDoc.listFiles().sortedWith(compareBy<DocumentFile> { it.isDirectory }.thenBy { it.name?.lowercase() ?: "" })
              }

              Column(Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier.fillMaxWidth().background(Color(0xFF2A2A2A)).padding(horizontal = 16.dp, vertical = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text("←", color = Color.White, fontSize = 20.sp, modifier = Modifier.clickable { onBack() })
                      Spacer(Modifier.width(12.dp))
                      Text(currentDoc.name ?: "Selected Folder", color = Color.White, fontSize = 16.sp, maxLines = 1, modifier = Modifier
