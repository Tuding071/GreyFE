                  Row(
                      modifier = Modifier
                          .weight(1f)
                          .horizontalScroll(scrollState),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      breadcrumbs.forEachIndexed { index, (label, onClick) ->
                          if (index > 0) {
